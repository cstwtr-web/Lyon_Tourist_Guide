<style>
  :root {
    --bg: #e8f2ef;
    --txt-bg: #17323b;
    --mut-bg: #5b7a80;
    --line-bg: rgba(23,50,59,.15);
    --card: #ffffff;
    --line: #c3dcd5;
    --txt: #17323b;
    --mut: #5b7a80;
    --amber: #e0940f;
    --amber-text: #e0940f;
    --green: #0e9f6e;
    --green-text: #0e9f6e;
    --blue: #2563eb;
    --red: #dc4c4c;

    /* Design tokens */
    --radius-sm: 10px;
    --radius-md: 16px;
    --radius-lg: 22px;
    --radius-pill: 99px;
    --shadow-sm: 0 2px 8px rgba(0,0,0,.06);
    --shadow-md: 0 4px 16px rgba(0,0,0,.10);
    --shadow-lg: 0 -8px 24px rgba(0,0,0,.18);
    --shadow: var(--shadow-md);

    --radius: 16px;
  }

  body.phase-morning {
    --bg: #d4e8e3;
    --txt-bg: #17323b;
    --mut-bg: #3d5f63;
    --line-bg: rgba(23,50,59,.18);
    --amber-text: #b87800;
    --green-text: #0a7f56;
  }
  body.phase-day {
    --bg: #e8f2ef;
    --txt-bg: #17323b;
    --mut-bg: #5b7a80;
    --line-bg: rgba(23,50,59,.15);
    --amber-text: #e0940f;
    --green-text: #0e9f6e;
  }
  body.phase-evening {
    --bg: #2e8b81;
    --txt-bg: #eaf7f4;
    --mut-bg: #b8dcd5;
    --line-bg: rgba(255,255,255,.28);
    --amber-text: #ffd07a;
    --green-text: #8af0c5;
  }
  body.phase-night {
    --bg: #1f6f6b;
    --txt-bg: #eaf7f4;
    --mut-bg: #a8ccc6;
    --line-bg: rgba(255,255,255,.22);
    --amber-text: #ffd07a;
    --green-text: #8af0c5;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    background-color: var(--bg);
    color: var(--txt-bg);
    font-family: -apple-system, 'Segoe UI', Roboto, sans-serif;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
    padding-bottom: calc(72px + env(safe-area-inset-bottom));
    transition: background-color 1.4s ease, color 1.4s ease;
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.01ms !important;
      transition-duration: 0.01ms !important;
    }
  }

  .kicker, .kicker .phase, .stepno, .stepno .badge-done, .meta, .meta b,
  .alldone p, .guide-box, .guide-text, .guide-open-btn,
  .guide-title, .tip, .ttable td, .ttable .t-name,
  .ttable .t-det, .ttable .t-det b, .ttable .t-tot, .trip-note {
    transition: background-color 1.4s ease, color 1.4s ease, border-color 1.4s ease;
  }

  .sky {
    position: fixed; inset: 0; z-index: 0; pointer-events: none;
    transition: background 1.4s ease;
  }
  .sky.morning { background: radial-gradient(120% 90% at 50% -10%, rgba(255,245,220,.35), transparent 55%); }
  .sky.day     { background: radial-gradient(120% 90% at 50% -10%, rgba(220,240,255,.25), transparent 55%); }
  .sky.evening { background: radial-gradient(120% 90% at 50% -10%, rgba(255,200,150,.12), transparent 55%); }
  .sky.night   { background: radial-gradient(120% 90% at 50% -10%, rgba(150,170,220,.08), transparent 55%); }

  .topbar {
    position: fixed; top: 0; left: 0; right: 0; z-index: 30;
    display: flex; justify-content: space-between; align-items: center;
    padding: calc(10px + env(safe-area-inset-top)) 14px 8px;
  }
  .tbtn {
    background: #ffffffdd; border: 1.5px solid var(--line); color: var(--mut);
    font-weight: 800; font-size: 12px; padding: 10px 14px; border-radius: 10px;
    min-height: 42px; cursor: pointer;
  }
  .tbtn:focus-visible { outline: 3px solid var(--amber); outline-offset: 2px; }
  .tbtn.on { color: var(--amber); border-color: var(--amber); }
  .clock {
    font-size: 12px; font-weight: 800; color: var(--mut);
    font-variant-numeric: tabular-nums;
    background: #ffffffcc; padding: 7px 12px; border-radius: 10px;
    border: 1px solid var(--line);
  }

  .daystrip {
    position: fixed; top: calc(58px + env(safe-area-inset-top)); left: 0; right: 0;
    display: flex; justify-content: center; gap: 8px; z-index: 20; padding: 0 14px;
  }
  .daystrip button {
    background: #ffffffdd; border: 1.5px solid var(--line); color: var(--mut);
    font-weight: 800; font-size: 12px; padding: 9px 18px; border-radius: 99px;
    min-height: 38px; letter-spacing: .3px; cursor: pointer;
    transition: background .2s, border-color .2s, color .2s, box-shadow .2s, transform .12s;
  }
  .daystrip button:focus-visible { outline: 3px solid var(--amber); outline-offset: 2px; }
  .daystrip button.on {
    background: var(--amber); border-color: var(--amber); color: #1a1400;
    box-shadow: 0 4px 14px #ffc93c44;
  }
  .daystrip button:active { transform: scale(.96); }

  main {
    position: relative; z-index: 10; height: 100%;
    display: flex; flex-direction: column;
    padding: calc(108px + env(safe-area-inset-top)) 18px 0;
    overflow-y: auto; -webkit-overflow-scrolling: touch;
  }
  main.foodpage { padding-top: calc(12px + env(safe-area-inset-top)); }
  /* FIX 1: spazio di scorrimento sotto la card — così "Apri guida completa",
     i bottoni mappa e il tip non restano mai coperti dal pad fisso
     (PREC / FATTO / NEXT / TAXI) e dalla barra di navigazione. */
  main#nowPage { padding-bottom: 124px; }
  main[hidden] { display: none !important; }

  .kicker {
    text-align: center; font-size: 11px; font-weight: 800;
    letter-spacing: 1.8px; text-transform: uppercase;
    color: var(--amber-text); margin-bottom: 6px;
  }
  .kicker .phase {
    display: inline-block; margin-left: 8px; color: var(--mut-bg);
    letter-spacing: .4px; text-transform: none; font-weight: 700;
  }
  .stepno {
    text-align: center; font-size: 12px; color: var(--mut-bg);
    font-weight: 700; font-variant-numeric: tabular-nums; margin-bottom: 14px;
  }
  .stepno .badge-done { color: var(--green-text); font-weight: 800; }

  .bigcard {
    flex: 1; display: flex; flex-direction: column; justify-content: flex-start;
    max-width: 480px; margin: 0 auto; width: 100%; padding-bottom: 24px;
  }
  .emoji {
    font-size: 56px; text-align: center; margin-bottom: 10px;
    filter: drop-shadow(0 6px 18px #0006);
    animation: float 3.6s ease-in-out infinite;
  }
  /* FIX 2: emoji in linea con il titolo (a sinistra della scritta),
     card più compatta: più contenuti visibili senza scorrere. */
  .cardhead {
    display: flex; align-items: center; justify-content: center;
    gap: 10px; margin-bottom: 10px;
  }
  .cardhead .emoji { font-size: 40px; margin-bottom: 0; flex: none; }
  .cardhead .title { margin-bottom: 0; }
  @keyframes float {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-7px); }
  }
  .title {
    font-size: clamp(22px, 6.2vw, 28px); font-weight: 900;
    text-align: center; line-height: 1.18; margin-bottom: 10px;
  }
  .meta {
    text-align: center; font-size: 14px; color: var(--mut-bg); margin-bottom: 8px; line-height: 1.4;
  }
  .meta b { color: var(--txt-bg); }
  .poi-open-btn {
    display: block; width: 100%; max-width: 440px; margin: 14px auto 0; padding: 11px 14px;
    background: rgba(15,90,80,.05); border: 1.5px solid var(--line-bg); color: var(--txt-bg);
    font-family: inherit; font-size: 12.5px; font-weight: 800; border-radius: 10px;
    text-align: center; min-height: 44px; transition: transform .1s;
  }
  .poi-open-btn:active { transform: scale(.98); }
  .poi-open-btn:focus-visible { outline: 3px solid #fff; outline-offset: 2px; }
  body.phase-evening .poi-open-btn,
  body.phase-night .poi-open-btn { background: rgba(0,0,0,.15); }

  .guide-box {
    margin: 0 auto 16px; max-width: 440px;
    background: rgba(15,90,80,.05); border-left: 3px solid var(--amber-text);
    padding: 14px 16px; border-radius: 0 16px 16px 0;
    text-align: left; box-shadow: var(--shadow); width: 100%;
  }
  body.phase-evening .guide-box,
  body.phase-night .guide-box {
    background: rgba(0,0,0,.22); box-shadow: 0 4px 16px rgba(0,0,0,.25);
  }
  .guide-title {
    font-size: 11px; font-weight: 800; text-transform: uppercase;
    letter-spacing: 1.4px; color: var(--amber-text);
    margin-bottom: 8px; display: flex; align-items: center; gap: 5px;
  }
  .guide-text {
    font-size: 14px; line-height: 1.55; color: var(--txt-bg);
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
  body.phase-evening .guide-text,
  body.phase-night .guide-text { color: #dceeea; }
  .guide-open-btn {
    display: block; width: 100%; margin-top: 12px; padding: 12px 14px;
    background: linear-gradient(135deg, rgba(255,201,60,.18), rgba(255,201,60,.06));
    border: 1.5px solid rgba(255,201,60,.4);
    color: var(--amber-text); font-size: 13px; font-weight: 800;
    letter-spacing: .2px; border-radius: 10px; cursor: pointer;
    text-align: center; transition: transform .12s, background .15s;
  }
  .guide-open-btn:active { transform: scale(.97); background: rgba(255,201,60,.28); }
  .guide-open-btn:focus-visible { outline: 3px solid var(--amber); outline-offset: 2px; }

  .tip {
    margin: 14px auto 0; max-width: 400px;
    background: #ffc93c14; border: 1px solid #ffc93c33; color: #8a5b00;
    font-size: 13px; padding: 12px 14px; border-radius: 16px;
    line-height: 1.45; text-align: center;
  }
  body.phase-evening .tip,
  body.phase-night .tip {
    background: rgba(255,201,60,.12); border-color: rgba(255,201,60,.35); color: #ffe4a3;
  }
  .warn { background: #ff6b6b14; border-color: #ff6b6b44; color: #c06a6a; }
  body.phase-evening .tip.warn,
  body.phase-night .tip.warn {
    background: rgba(255,107,107,.14); border-color: rgba(255,107,107,.38); color: #ffbcbc;
  }

  .map-actions {
    display: flex; justify-content: center; gap: 6px; margin: 14px auto 0;
    width: 100%; max-width: 440px; flex-wrap: nowrap;
  }
  /* Bottoni mappa unificati: stile neutro, icona+label differenziano il mezzo */
  .map-btn {
    display: flex; align-items: center; justify-content: center; gap: 4px; text-decoration: none;
    font-size: 11px; font-weight: 800; padding: 9px 4px; border-radius: 10px;
    background: rgba(15,90,80,.05); border: 1.5px solid var(--line-bg);
    color: var(--txt-bg);
    transition: transform .1s, background .2s;
    min-height: 40px; white-space: nowrap;
    flex: 1 1 0; min-width: 0;
    box-shadow: var(--shadow-sm);
  }
  .map-btn:active { transform: scale(.95); }
  .map-btn:focus-visible { outline: 3px solid var(--amber); outline-offset: 2px; }
  body.phase-evening .map-btn,
  body.phase-night .map-btn {
    background: rgba(0,0,0,.20);
    color: var(--txt-bg);
  }

  .poi-list {
    max-width: 440px; margin: 8px auto 14px; width: 100%;
    background: rgba(255,255,255,.55); border: 1px solid var(--line);
    border-radius: 16px; overflow: hidden; box-shadow: var(--shadow);
  }
  .poi {
    display: flex; align-items: center; gap: 8px;
    padding: 8px 9px; border-bottom: 1px solid rgba(23,50,59,.08);
  }
  .poi:last-child { border-bottom: none; }
  .poi.start { border-left: 4px solid var(--green-text); }
  .poi.end { border-left: 4px solid var(--amber-text); }
  .poi .pi {
    font-size: 16px; width: 22px; text-align: center; flex-shrink: 0;
  }
  .poi .pt { flex: 1; min-width: 0; }
  .poi .pt b { display: block; font-size: 12.5px; font-weight: 700; color: var(--txt); line-height: 1.25; }
  .poi .pt small { display: block; font-size: 9.5px; color: #6b8589; margin-top: 1px; line-height: 1.3; }
  .poi .wrap { display: flex; flex-direction: column; gap: 3px; align-items: flex-end; flex-shrink: 0; }
  .poi .flag {
    font-size: 9px; font-weight: 800; color: #0a7f56; white-space: nowrap;
    background: #0e9f6e1a; border: 1px solid #0e9f6e55; border-radius: 10px; padding: 2px 6px;
  }
  .poi .go {
    flex-shrink: 0; font-size: 10px; font-weight: 800; text-decoration: none;
    background: #1d4ed8; color: #fff; padding: 7px 9px; border-radius: 10px;
    min-height: 34px; display: flex; align-items: center; justify-content: center; white-space: nowrap;
  }
  body.phase-evening .poi-list,
  body.phase-night .poi-list {
    background: rgba(0,0,0,.2); border-color: var(--line-bg);
    box-shadow: 0 4px 16px rgba(0,0,0,.25);
  }
  body.phase-evening .poi,
  body.phase-night .poi { border-bottom-color: rgba(255,255,255,.1); }
  body.phase-evening .poi .pt b,
  body.phase-night .poi .pt b { color: #eaf7f4; }
  body.phase-evening .poi .pt small,
  body.phase-night .poi .pt small { color: #b8dcd5; }
  body.phase-evening .poi .flag,
  body.phase-night .poi .flag {
    color: var(--green-text); background: rgba(255,255,255,.08); border-color: rgba(255,255,255,.25);
  }

  .sos-block {
    background: #fff5f5; border: 1.5px solid #ef9a9a; border-radius: 16px;
    padding: 12px 13px; margin-bottom: 14px;
  }
  .sos-block .sos-t {
    font-size: 11px; font-weight: 800; text-transform: uppercase;
    letter-spacing: 1px; color: #b71c1c; margin-bottom: 9px;
  }
  .sos-row {
    display: flex; align-items: center; justify-content: space-between;
    gap: 8px; padding: 7px 0;
  }
  .sos-chip {
    display: flex; align-items: center; gap: 8px; font-size: 13px;
    font-weight: 800; color: #7f1d1d; min-width: 0;
  }
  .sos-chip small { display: block; font-size: 10.5px; font-weight: 700; color: #a36a6a; }
  .sos-row a {
    text-decoration: none; font-size: 11.5px; font-weight: 800;
    padding: 9px 12px; border-radius: 10px; min-height: 38px;
    display: flex; align-items: center; white-space: nowrap;
  }
  .sos-row .a-tel { background: #b91c1c; color: #fff; }
  .sos-row .a-map { background: #1d4ed8; color: #fff; margin-left: 6px; }

  .pad {
    position: fixed; bottom: calc(64px + env(safe-area-inset-bottom)); left: 0; right: 0; z-index: 15;
    background: linear-gradient(to top, var(--bg) 65%, transparent);
    display: flex; align-items: center; justify-content: center;
    padding: 14px 16px; transition: background 1.4s ease;
  }
  .pad-inner {
    display: flex; align-items: center; justify-content: center; gap: 8px;
    width: 100%; max-width: 480px;
  }
  .pbtn {
    border: none; border-radius: 16px; font-weight: 800;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 2px; text-decoration: none; cursor: pointer;
  }
  .pbtn small { font-size: 9.5px; font-weight: 800; opacity: .85; letter-spacing: .2px; }
  .pbtn:active { transform: scale(.93); }
  .pbtn:focus-visible { outline: 3px solid var(--amber); outline-offset: 2px; }
  .pbtn.nav {
    width: 46px; height: 58px; background: #ffffffdd;
    border: 1.5px solid var(--line); color: var(--mut); font-size: 16px;
  }
  .pbtn.nav.off { opacity: .28; pointer-events: none; }
  .pbtn.metro {
    width: 50px; height: 58px; background: #ffffffdd; color: var(--mut);
    font-size: 18px; border: 1.5px solid var(--line);
  }
  .pbtn.tel {
    width: 50px; height: 58px; background: #ffffffdd; color: var(--mut);
    font-size: 18px; border: 1.5px solid var(--line);
  }
  body.phase-evening .pbtn.nav,
  body.phase-evening .pbtn.metro,
  body.phase-evening .pbtn.tel,
  body.phase-night .pbtn.nav,
  body.phase-night .pbtn.metro,
  body.phase-night .pbtn.tel {
    background: rgba(0,0,0,.25);
    border-color: var(--line-bg);
    color: var(--txt-bg);
  }
  .pbtn.done {
    flex: 1; background: var(--green); color: #06281c; font-size: 13.5px; height: 58px;
    font-weight: 900;
    box-shadow: 0 8px 24px #2ee6a855; animation: pulse 2.2s infinite;
  }
  .pbtn.done small { font-size: 10.5px; }
  @keyframes pulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.015); }
  }
  .pbtn.done:active { animation: none; }
  .pbtn.undo {
    flex: 1; background: #f9e0e0; color: #b03030; font-size: 12.5px; height: 58px;
    border: 1.5px solid #d98080; box-shadow: none; animation: none;
  }
  .pbtn.undo small { font-size: 10.5px; color: #c06a6a; }

  .alldone {
    flex: 1; display: flex; flex-direction: column; align-items: center;
    justify-content: center; text-align: center; gap: 16px; padding: 20px;
  }
  .alldone .emoji { animation: none; font-size: 72px; }
  .alldone h2 { font-size: 24px; font-weight: 900; }
  .alldone p { color: var(--mut-bg); font-size: 15px; max-width: 300px; line-height: 1.45; }

  .day-h {
    margin: 12px auto 10px;
    background: linear-gradient(135deg, #0f766e, #14b8a6);
    border-radius: 16px; padding: 16px; width: 100%; max-width: 480px;
  }
  .day-h .dh-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
  .day-h h2 { font-size: 17px; font-weight: 900; color: #fff; }
  .day-h .dh-sub {
    font-size: 11.5px; color: #eafff7; font-weight: 700;
    text-transform: uppercase; letter-spacing: .4px;
  }
  .dh-time {
    font-size: 11.5px; font-weight: 800; background: rgba(0,0,0,.35);
    color: #eafff7; padding: 7px 11px; border-radius: 999px;
    white-space: nowrap; font-variant-numeric: tabular-nums;
  }
  .prog { display: flex; align-items: center; gap: 10px; margin-top: 12px; }
  .prog .bar {
    flex: 1; height: 8px; background: rgba(0,0,0,.35);
    border-radius: 99px; overflow: hidden;
  }
  .prog .bar i {
    display: block; height: 100%; background: var(--green);
    width: 0; transition: width .35s ease;
  }
  .prog b { font-size: 12px; color: #eafff7; font-variant-numeric: tabular-nums; }

  .steps {
    padding: 0 0 24px; display: flex; flex-direction: column; gap: 10px;
    width: 100%; max-width: 480px; margin: 0 auto;
  }
  .step {
    background: var(--card); border: 1.5px solid var(--line);
    border-radius: 16px; padding: 14px; display: flex; gap: 12px;
    cursor: pointer; color: var(--txt); transition: border-color .2s, background .2s;
  }
  .step:focus-visible { outline: 3px solid var(--amber); outline-offset: 2px; }
  .step.done { opacity: .48; }
  .step.done .st-tit { text-decoration: line-through; }
  .step.cur { border-color: var(--amber); background: #ffc93c14; }
  .chk {
    appearance: none; -webkit-appearance: none;
    width: 32px; height: 32px; min-width: 32px;
    border: 2px solid var(--line); border-radius: 10px;
    margin-top: 2px; position: relative; cursor: pointer;
  }
  .chk:checked { background: var(--green); border-color: var(--green); }
  .chk:checked::after {
    content: '✓'; position: absolute; color: #06281c;
    font-size: 18px; font-weight: 900; inset: 0;
    display: flex; align-items: center; justify-content: center;
  }
  .st-body { flex: 1; min-width: 0; }
  .badges { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 6px; }
  .bdg {
    font-size: 10.5px; font-weight: 800; background: #cfe6df;
    color: var(--mut); padding: 4px 9px; border-radius: 10px;

  "0:6":{heroEmoji:"🍽️",subtitle:"Cena in un bouchon",intro:"Le storiche trattorie lionesi: andouillette, quenelle, saucisson chaud. Il modo più autentico per chiudere la giornata.",sections:[
    {icon:"⚡",title:"In sintesi",text:"⏱️ 1h 30–2h · 💶 25–40 €/persona (vino incluso) · 🕐 prenotate per 4 · 📍 Vieux Lyon<br>💳 molti bouchon accettano solo contanti o hanno POS lento: portali"},
    {icon:"⭐",title:"Non perdere",text:"• L'<b>andouillette</b> (salsiccia di maiale e trippa) — il piatto-simbolo<br>• La <b>quenelle di luccio</b> con salsa Nantua<br>• Il <b>saucisson chaud brioché</b><br>• Un <b>Côtes du Rhône</b> della casa"},
    {icon:"📖",title:"Cosa sono i bouchon",text:"Trattorie storiche di Lione, riconoscibili dal <b>fascio di fieno</b> appeso all'insegna. Cucina di recupero, porzioni generose, atmosfera rumorosa: sono l'opposto dello stellato, ed è per questo che sono autentici."},
    {icon:"👩‍🍳",title:"Le 'Mères Lyonnaises'",text:"Figure come <b>Eugénie Brazier</b> (prima donna con tre stelle Michelin, 1933) hanno reso celebre la cucina lionese. Il modello era: padrona di casa + cucina borghese semplificata + prodotti del mercato."},
    {icon:"🍖",title:"Cosa mangiare",text:"<b>Andouillette</b> (se ti piace il sapore forte), <b>quenelle</b> (delicata, per tutti), <b>saucisson chaud</b> (antipasto tipico). Vino: un <b>Côtes du Rhône</b> o un Beaujolais (il 'pot lyonnais', la brocca di ceramica)."},
    {icon:"🎲",title:"Se...",text:"🚫 Se il bouchon è pieno: alternative nella scheda 🍽️ Mangiare<br>🥗 Se sei vegetariano: la cucina lionese è tradizionalmente di carne, ma molti bouchon hanno opzioni (chiedi al momento della prenotazione)<br>🍷 Se vuoi solo bere: molti bouchon hanno un banco bar dove si può bere un bicchiere senza cena"},
    {icon:"📞",title:"Prenotazioni",text:"Nomi e numeri nella scheda 🍽️ Mangiare. Prenotate <b>oggi pomeriggio</b> per stasera: i bouchon si riempiono."},
    {icon:"💡",title:"Consiglio",text:"Portate <b>contanti</b>: molti bouchon non accettano carte. E non ordinate tutto subito: le porzioni sono abbondanti, meglio dividere."},
    {icon:"📞",title:"Numeri utili",text:"🍽️ <b>Ristoranti</b>: scheda 🍽️ Mangiare · 🚕 <b>Taxi Lyon</b>: <a href='tel:+33478268181'>04 78 26 81 81</a>"}]},

  "0:7":{heroEmoji:"🚕",subtitle:"Rientro in hotel",intro:"Rientro comodo in taxi. Meglio non tornare a piedi.",sections:[
    {icon:"⚡",title:"In sintesi",text:"⏱️ 10 min · 💶 20–27 € · 📍 da Vieux Lyon a Hôtel Charlemagne (Perrache)<br>🚕 taxi in Place Saint-Jean o chiamato per telefono"},
    {icon:"⭐",title:"Non perdere",text:"• La <b>vista notturna</b> della Cattedrale dal finestrino<br>• Il <b>lungofiume della Saona</b> illuminato (se il taxi passa da lì)"},
    {icon:"🚕",title:"Come chiamare",text:"Ci sono taxi in Place Saint-Jean fino a tardi. In alternativa: <b>Taxi Lyon 24/7</b> al <a href='tel:+33478268181'>04 78 26 81 81</a> (radiotaxi, sempre attivo) oppure <b>Allo Taxi</b> al <a href='tel:+33478282323'>04 78 28 23 23</a>."},
    {icon:"🎲",title:"Se...",text:"🌧️ Se piove e non trovi taxi: chiama, non aspettare sotto la pioggia<br>💶 Se hai solo carta: quasi tutti i taxi accettano carte ormai, ma chiedi prima di salire<br>🚶 Se vuoi risparmiare: 25 min a piedi, ma è in salita dopo cena — sconsigliato"},
    {icon:"💡",title:"Consiglio",text:"Chiama il taxi all'uscita del ristorante o usa l'app. Non tornare a piedi: 2 km in salita dopo cena non sono piacevoli, soprattutto con il freddo di fine ottobre."},
    {icon:"🌙",title:"Domani",text:"Bellecour, Terreaux, Mur des Lyonnais, Parc de la Tête d'Or, Halles Bocuse e Brasserie Georges. Sveglia alle 8:00, partenza alle 9:00."},
    {icon:"📞",title:"Numeri utili",text:"🚕 <b>Taxi Lyon 24/7</b>: <a href='tel:+33478268181'>04 78 26 81 81</a><br>🚕 <b>Allo Taxi</b>: <a href='tel:+33478282323'>04 78 28 23 23</a><br>🚨 <b>Emergenze</b>: 112"}]},

  "1:0":{heroEmoji:"🚇",wiki:"Place Bellecour",subtitle:"Place Bellecour",intro:"310x200 metri: la più grande piazza pedonale d'Europa. Il punto di partenza della giornata.",sections:[
    {icon:"⚡",title:"In sintesi",text:"⏱️ 10 min (piazza) · 💶 gratis · 🚇 Metro A/D, fermata <b>Bellecour</b> · 🕐 sempre aperta · ♿ accessibile<br>📍 Centro di Lione, tra Rodano e Saona"},
    {icon:"⭐",title:"Non perdere",text:"• La <b>statua equestre di Luigi XIV</b> al centro (1825)<br>• Il <b>chilometro zero</b>: tutte le distanze di Lione si misurano da qui<br>• La <b>vista sulla collina di Fourvière</b> da sud-ovest<br>• La <b>ruota panoramica</b> in inverno (dicembre–gennaio)"},
    {icon:"📍",title:"Dove sei",text:"<b>Place Bellecour</b>, Metro A/D fermata Bellecour. <a href='https://www.google.com/maps/search/?api=1&query=Place+Bellecour+Lyon' target='_blank'>Apri mappa</a>"},
    {icon:"📖",title:"Da sapere",text:"Con i suoi <b>67.128 m²</b> (310×200 m), è la più grande piazza pedonale d'Europa e la quinta di Francia. Costruita nel XVII secolo su progetto di Robert de Cotte, rifatta nel 1825 con la statua di Luigi XIV."},
    {icon:"👀",title:"Da vedere",text:"La <b>statua equestre di Luigi XIV</b> (fusa nel 1825 da François-Frédéric Lemot) e il <b>memoriale della Resistenza</b> a sud-ovest. A nord-est, il <b>giardino</b> con la fontana."},
    {icon:"🎲",title:"Se...",text:"☕ Se hai fame: i caffè intorno alla piazza sono turistici ma comodi per una colazione<br>🛍️ Se vuoi fare shopping: Rue de la République parte da qui (pedonale, 1 km)<br>🚻 Se ti serve un bagno: quelli pubblici sono a est (angolo Rue des Marronniers)"},
    {icon:"💡",title:"Consiglio",text:"Piazza enorme e senza ombra: cappello e acqua, soprattutto se torni in estate. Oggi è la prima tappa, ma non perderci più di 10 minuti: il bello arriva dopo."},
    {icon:"🚻",title:"Pratico",text:"Bagni pubblici a est della piazza. Fontanella Wallace (acqua potabile) all'angolo nord-est."}]},

  "1:1":{heroEmoji:"⛲",wiki:"Place des Terreaux",subtitle:"Place des Terreaux",intro:"Il cuore di Lione: Municipio, Fontana Bartholdi e Museo di Belle Arti. La piazza che ha visto la ghigliottina e i tesori nascosti.",sections:[
    {icon:"⚡",title:"In sintesi",text:"⏱️ 15–20 min (piazza) · 💶 gratis · 🚇 Metro A/C, <b>Hôtel de Ville – Louis Pradel</b> · 🕐 sempre aperta · ♿ accessibile<br>📍 Tra Croix-Rousse e Presqu'île"},
    {icon:"⭐",title:"Non perdere",text:"• La <b>Fontana Bartholdi</b> (1892, lo stesso scultore della Statua della Libertà)<br>• La <b>facciata del Municipio</b> (XVII sec., con la campana Marie)<br>• Il <b>Museo di Belle Arti</b> a nord (8 €, chiuso il martedì)<br>• Le <b>facciate dipinte</b> delle case a est (ex atelier)"},
    {icon:"📍",title:"Dove sei",text:"<b>Place des Terreaux</b>. Metro A/C, Hôtel de Ville – Louis Pradel. <a href='https://www.google.com/maps/search/?api=1&query=Place+des+Terreaux+Lyon' target='_blank'>Apri mappa</a>"},
    {icon:"📖",title:"Da sapere",text:"Il nome deriva dai <b>'terreaux'</b>, i fossati fangosi dell'epoca romana. Nel Medioevo era un mercato. Nel 1793, durante la Rivoluzione, qui fu ghigliottinato il sindaco royaliste e 200 oppositori."},
    {icon:"💰",title:"Curiosità",text:"Nel <b>1993</b>, durante i lavori per la metropolitana, fu scoperto un tesoro di <b>543 monete d'oro e d'argento</b> (XIV–XV sec.) sotto la piazza. Oggi è esposto al Museo di Belle Arti."},
    {icon:"👀",title:"Da vedere",text:"L'<b>Hôtel de Ville</b> (XVII sec., facciata monumentale), la <b>Fontana di Bartholdi</b> (1892), il <b>Museo di Belle Arti</b> (una delle collezioni più ricche di Francia: 8 €, chiuso il martedì, gratis il primo venerdì del mese)."},
    {icon:"🎲",title:"Se...",text:"🖼️ Se piove: il Museo di Belle Arti è perfetto (10:30–18:00)<br>⏳ Se hai 30 min in più: sali alla <b>Croix-Rousse</b> con la funicolare C (a 200 m)<br>☕ Se hai sete: i caffè a sud della piazza sono meno turistici di quelli a nord"},
    {icon:"💡",title:"Consiglio",text:"Sedetevi a un tavolino e godetevi il viavai. È una delle piazze più vive di Lione: qui si incontra tutto il centro."},
    {icon:"🚻",title:"Pratico",text:"Bagni pubblici a nord (angolo Rue Paul Chenavard). Fontanella davanti al Municipio."}]},

  "1:2":{heroEmoji:"🎨",wiki:"Fresque des Lyonnais",subtitle:"Mur des Lyonnais",intro:"Fresco monumentale di 800 m² con 36 personaggi che celebrano 2000 anni di storia di Lione. Gratis, visibile dalla strada, 10 minuti ben spesi.",sections:[
    {icon:"⚡",title:"In sintesi",text:"⏱️ 10–15 min · 💶 gratis · 🕐 sempre visibile · 🚶 5 min da Place des Terreaux · ♿ accessibile<br>📍 49 Rue de la Martinière, 1er arrondissement"},
    {icon:"⭐",title:"Non perdere",text:"• I <b>fratelli Lumière</b> (inventori del cinema) sulla sinistra<br>• <b>Claudio</b>, l'imperatore romano nato a Lione<br>• <b>Saint-Exupéry</b> con il Piccolo Principe<br>• <b>Paul Bocuse</b>, lo chef più famoso di Francia<br>• <b>Jacquard</b> con il telaio per la seta"},
    {icon:"📍",title:"Dove sei",text:"<b>Rue de la Martinière</b>, a 5 minuti da Place des Terreaux. <a href='https://www.google.com/maps/search/?api=1&query=Fresque+des+Lyonnais+Lyon' target='_blank'>Apri mappa</a>"},
    {icon:"📖",title:"Da sapere",text:"Dipinto nel <b>1995</b> da un collettivo di artisti (CitéCréation, fondata nel 1978). <b>800 m²</b> e <b>36 personaggi</b>: Claudio, i <b>fratelli Lumière</b>, <b>Jacquard</b>, <b>Paul Bocuse</b>, <b>Saint-Exupéry</b>, la fresque racconta 2000 anni di storia lionese in un trompe-l'œil architettonico."},
    {icon:"🎨",title:"Il trompe-l'œil",text:"Il muro 'finge' di essere un palazzo con balconi, finestre e botteghe. I personaggi si affacciano dalle finestre finte come se fossero inquilini. Guarda i dettagli: il cinema dei Lumière, il telaio di Jacquard, il Piccolo Principe che parla con Saint-Exupéry."},
    {icon:"🎲",title:"Se...",text:"☔ Se piove: il muro è scoperto, ma vale comunque una sosta di 5 min<br>⏳ Se hai 20 min in più: prosegui fino alla <b>Fresque des Canuts</b> (Croix-Rousse, sempre di CitéCréation)<br>📸 Se vuoi la foto migliore: di mattina, con il sole sulla facciata"},
    {icon:"💡",title:"Consiglio",text:"Gratuita e visibile dalla strada: 10 minuti ben spesi. Cerca tutti e 36 i personaggi (ci sono anche De Gaulle, l'abbé Pierre, Bertrand Tavernier)."},
    {icon:"🚻",title:"Pratico",text:"Niente bagni in loco. Fontanella a Place des Terreaux (5 min a piedi)."}]},

  "1:3":{heroEmoji:"🌳",wiki:"Parc de la Tête d'Or",subtitle:"Parc de la Tête d'Or",intro:"Grande parco cittadino con lago, serre botaniche e piccolo zoo. Ingresso gratuito, 117 ettari, uno dei più grandi parchi urbani di Francia.",sections:[
    {icon:"⚡",title:"In sintesi",text:"⏱️ 1h–1h 30 · 💶 gratis · 🕐 <b>6:30–20:30</b> (invernale) · 🚊 Tram T1/T4 o Metro A · ♿ accessibile<br>📍 6e arrondissement, quartiere Part-Dieu"},
    {icon:"⭐",title:"Non perdere",text:"• Il <b>lago</b> con le barche (noleggio ~12 €/30 min)<br>• Le <b>serre botaniche</b> (Victoria amazonica, orchidee) — chiudono 17:30<br>• Il <b>giardino zoologico</b> gratuito (leoni, giraffe, elefanti)<br>• La <b>Porte des Enfants du Rhône</b>, l'ingresso monumentale sul Rodano"},
    {icon:"📍",title:"Dove sei",text:"Nel quartiere della Part-Dieu. Tram ~20 min dal centro. <a href='https://www.google.com/maps/search/?api=1&query=Parc+de+la+Tête+d%27Or+Lyon' target='_blank'>Apri mappa</a>"},
    {icon:"📖",title:"Da sapere",text:"Inaugurato nel <b>1857</b>, <b>117 ettari</b>, progettato da Denis e Eugène Buhler. Il nome deriva da una leggenda: una <b>testa di Cristo in oro</b> sarebbe sepolta sul fondo del lago. Da qui il nome 'Tête d'Or'."},
    {icon:"🕐",title:"Orari e stagioni",text:"Dal 15 ottobre chiude alle <b>20:30</b> (orario invernale); d'estate fino alle 22:30. Ingresso gratuito. Le serre chiudono prima (17:30). Lo zoo chiude alle 18:00."},
    {icon:"🎲",title:"Se...",text:"☔ Se piove: rimanda, il bello è camminare all'aperto<br>🥪 Se hai fame: chioschi interni (panini, gelati) ma cari; meglio un panino fuori<br>👶 Se hai bambini: lo zoo e il trenino (2 €) sono perfetti<br>⏳ Se hai 30 min in più: la <b>Roseraie</b> (giugno) o le <b>serre</b> (sempre)"},
    {icon:"💡",title:"Consiglio",text:"Punta sul lago e sulle serre: sono la parte più caratteristica. Se hai poco tempo, salta lo zoo (carino ma standard) e fai il giro del lago."},
    {icon:"🚻",title:"Pratico",text:"Bagni pubblici in varie zone del parco (mappa all'ingresso). Fontanelle ovunque. Chioschi bar sparsi."}]},

  "1:4":{heroEmoji:"🧀",wiki:"Halles Paul Bocuse",subtitle:"Les Halles Paul Bocuse",intro:"Il tempio della gastronomia: Sibilia (salumi dal 1922) e Giraudet (quenelle). Il pranzo più buono della giornata.",sections:[
    {icon:"⚡",title:"In sintesi",text:"⏱️ 45 min–1h · 💶 15–30 €/persona · 🕐 <b>lun–sab 7:00–22:00</b>, dom 7:00–13:00 · 🚊 Tram T1/T4 o Metro B · ♿ accessibile<br>📍 102 Cours Lafayette"},
    {icon:"⭐",title:"Non perdere",text:"• La <b>quenelle di Giraudet</b> (dal 1935)<br>• Il <b>saucisson brioché di Sibilia</b> (dal 1922)<br>• Le <b>ostriche di Antonin</b> (se ti piacciono)<br>• Il <b>formaggio di Mons</b> (affinato in cantina)"},
    {icon:"📍",title:"Dove sei",text:"<b>102 Cours Lafayette</b>. Tram T1/T4, fermata <b>Halles Paul Bocuse</b>. <a href='https://www.google.com/maps/search/?api=1&query=Halles+Paul+Bocuse+Lyon' target='_blank'>Apri mappa</a>"},
    {icon:"📖",title:"Da sapere",text:"Radici nel <b>1859</b>, intitolate a <b>Paul Bocuse</b> nel <b>2006</b> (quando era ancora vivo). Oggi <b>56 commercianti</b> su 13.000 m², tra banchi di gastronomia, ristoranti e fiorai."},
    {icon:"🍴",title:"Cosa assaggiare",text:"La <b>quenelle</b> da Giraudet (5–8 € al pezzo), il <b>saucisson brioché</b> da Sibilia (7–10 €), le <b>ostriche</b> da Antonin (15–25 € la dozzina). C'è anche il <b>vino al bicchiere</b> in molti banchi: 4–6 €."},
    {icon:"🎲",title:"Se...",text:"🌧️ Se piove: perfetto, è coperto<br>💶 Se hai solo carta: quasi tutti accettano carte, ma qualche banco storico preferisce contanti<br>🍽️ Se vuoi sederti: i ristoranti interni (Chez Léon, Chez Antonin) hanno tavoli, ma sono cari<br>🚫 Se sei vegetariano: Giraudet ha anche opzioni di verdura"},
    {icon:"💡",title:"Consiglio",text:"Non fermarti al primo banco: fai un giro completo, poi scegli. Molti banchi fanno assaggi gratuiti. Il pranzo migliore: prendi 3–4 cose piccole in banchi diversi e mangiale ai tavolini esterni."},
    {icon:"📞",title:"Numeri utili",text:"🥟 <b>Giraudet</b>: <a href='tel:+33478623405'>04 78 62 34 05</a> · 🥓 <b>Sibilia</b>: <a href='tel:+33478622129'>04 78 62 21 29</a><br>🍽️ <b>Altri banchi</b>: scheda 🍽️ Mangiare"}]},

  "1:5":{heroEmoji:"😴",subtitle:"Riposo in hotel",intro:"Pausa meritata. Due ore per ricaricare le batterie prima della cena in Brasserie Georges.",sections:[
    {icon:"⚡",title:"In sintesi",text:"⏱️ 2h · 📍 Hôtel Charlemagne (23 Cours Charlemagne) · 🚇 Metro A, fermata <b>Perrache</b> (5 min a piedi)<br>🔋 tempo di ricarica: doccia, riposo, cambio"},
    {icon:"⭐",title:"Cosa fare",text:"• <b>Doccia</b> e riposo<br>• <b>Ricarica</b> del telefono (power bank per la sera)<br>• Se serve: <b>lavanderia self-service</b> in Rue de la Charité (5 min)<br>• <b>Monoprix</b> sotto l'hotel per acqua e snack"},
    {icon:"📍",title:"Dove sei",text:"<b>Hôtel Charlemagne</b>, 23 Cours Charlemagne. Metro A, fermata <b>Perrache</b>. <a href='https://www.google.com/maps/search/?api=1&query=Hôtel+Charlemagne+Lyon' target='_blank'>Apri mappa</a>"},
    {icon:"💡",title:"Consiglio",text:"Usa questo tempo per una doccia e un riposo vero. La cena è alle 19:30: alle 19:00 devi essere pronto. Se hai bambini, questo è il momento del pisolino."},
    {icon:"🎲",title:"Se...",text:"🛍️ Se vuoi fare un giro: il <b>Monoprix</b> sotto l'hotel ha tutto (acqua, snack, caricabatterie)<br>🧺 Se hai bisogno di lavanderia: <b>Lav'Club</b> in Rue de la Charité (5 min a piedi)<br>☕ Se hai fame: caffè e brioche al bar dell'hotel o al Monoprix"},
    {icon:"📞",title:"Numeri utili",text:"🏨 <b>Hotel Charlemagne</b>: <a href='tel:+33472777000'>04 72 77 70 00</a><br>🚕 <b>Taxi Lyon</b>: <a href='tel:+33478268181'>04 78 26 81 81</a>"}]},

  "1:6":{heroEmoji:"🍺",wiki:"Brasserie Georges",subtitle:"Brasserie Georges",intro:"Istituzione lionese dal 1836, atmosfera Art Déco. A 300 metri dall'hotel, comodissima per la cena.",sections:[
    {icon:"⚡",title:"In sintesi",text:"⏱️ 1h 30–2h · 💶 30–50 €/persona · 🕐 <b>tutti i giorni 11:15–00:15</b> · 🚶 5 min dall'hotel · ♿ accessibile<br>📍 30 Cours de Verdun, Perrache"},
    {icon:"⭐",title:"Non perdere",text:"• La <b>sala Art Déco</b> (1924) con i lampadari in vetro<br>• La <b>birra in loco</b>, prodotta nei tini d'epoca<br>• La <b>facciata neoclassica</b> su Cours de Verdun<br>• Il <b>soufflé</b> o la <b>choucroute</b> (piatti della tradizione)"},
    {icon:"📍",title:"Dove sei",text:"A 300 metri dall'hotel. <a href='https://www.google.com/maps/search/?api=1&query=Brasserie+Georges+Lyon' target='_blank'>Apri mappa</a>"},
    {icon:"📖",title:"Da sapere",text:"Fondata nel <b>1836</b> da Georges Hoffherr. Nel <b>1924</b> fu ridecorata in stile <b>Art Déco</b> (lampadari in vetro di René Lalique, soffitto a cassettoni). Nel <b>2012</b> ha servito <b>3.245 coperti</b> in un giorno: è una delle brasserie più grandi d'Europa."},
    {icon:"🍽️",title:"Alternative",text:"Se è piena (capita il venerdì): <b>Les Petites Cantines</b> (74 Rue de la Charité, 10–18 €, no-profit) o <b>HEAT Food Court</b> (70 Quai Perrache, 10–20 €, food hall con 8 cucine). Entrambe a 10 min a piedi."},
    {icon:"🎲",title:"Se...",text:"🍺 Se non hai prenotato: la Brasserie Georges accetta walk-in ma aspettative di 20–30 min il venerdì sera<br>🥗 Se sei vegetariano: pochi piatti, ma insalate e zuppe ci sono<br>💶 Se hai solo carta: nessun problema, accettano tutto"},
    {icon:"🌙",title:"Dopo cena",text:"Due passi digestivi sul lungo Saona (5 min): l'argine è illuminato e sicuro fino alle 23:00."},
    {icon:"📞",title:"Numeri utili",text:"🍺 <b>Brasserie Georges</b>: <a href='tel:+33472565454'>04 72 56 54 54</a><br>🍽️ <b>Alternative</b>: scheda 🍽️ Mangiare"}]},

  "1:7":{heroEmoji:"🚶",subtitle:"Rientro a piedi",intro:"300 metri lungo la Saona. Due passi digestivi prima di dormire.",sections:[
    {icon:"⚡",title:"In sintesi",text:"⏱️ 5 min a piedi · 🚶 300 m · 📍 da Brasserie Georges a Hôtel Charlemagne<br>🌊 lungo il Quai Perrache (argine della Saona)"},
    {icon:"⭐",title:"Non perdere",text:"• L'<b>argine illuminato</b> della Saona<br>• La <b>vista sul pont Gallieni</b> (1909, il ponte che attraversa la Saona)<br>• Se siete fortunati: i <b>cormorani</b> che dormono sui piloni"},
    {icon:"🌊",title:"Il lungofiume",text:"Il Quai Perrache è uno degli argini più tranquilli di Lione: poco traffico, panchine, alberi. Di sera è frequentato da coppie e runner, molto sicuro."},
    {icon:"🎲",title:"Se...",text:"🌧️ Se piove: c'è un percorso coperto passando per Rue de la Charité<br>🚶 Se hai voglia di camminare di più: allunga fino a <b>Place Bellecour</b> (10 min) prima di rientrare<br>🌙 Se è tardi: l'argine è illuminato fino a mezzanotte"},
    {icon:"💡",title:"Consiglio",text:"Passeggiata breve ma piacevole. Domani si parte per il tour in auto: metti la sveglia alle 8:00."},
    {icon:"🌙",title:"Domani",text:"Musée des Confluences (esterno), Halles Bocuse (ultimi acquisti), Gare Part-Dieu, Tour Incity, partenza. Tutto in auto, ~2 ore."},
    {icon:"📞",title:"Numeri utili",text:"🏨 <b>Hotel Charlemagne</b>: <a href='tel:+33472777000'>04 72 77 70 00</a> · 🚕 <b>Taxi Lyon</b>: <a href='tel:+33478268181'>04 78 26 81 81</a>"}]},

  "2:0":{heroEmoji:"🚗",wiki:"Musée des Confluences",subtitle:"Musée des Confluences",intro:"Architettura futuristica dove Rodano e Saona si incontrano. Da vedere dall'esterno (il museo apre alle 10:30), ma l'edificio merita da solo il viaggio.",sections:[
    {icon:"⚡",title:"In sintesi",text:"⏱️ 20–30 min (esterno) · 2h (interno) · 💶 gratis fuori, <b>12 €</b> dentro · 🕐 <b>10:30–18:30</b> (mar–dom) · 🚗 10 min in auto · ♿ accessibile<br>📍 86 Quai Perrache, 2e arrondissement"},
    {icon:"⭐",title:"Non perdere",text:"• La <b>forma dell'edificio</b> (una 'nuvola' di vetro e acciaio)<br>• La <b>confluenza Rodano–Saona</b> (il punto esatto è a 200 m)<br>• Il <b>quartiere Confluence</b> (ex dock industriali rinati)<br>• Se entri: il <b>scheletro di balenottera</b> nella hall"},
    {icon:"📍",title:"Dove sei",text:"~10 min in auto dall'hotel. <a href='https://www.google.com/maps/search/?api=1&query=Musée+des+Confluences+Lyon' target='_blank'>Apri mappa</a>"},

function phaseFor(h) {
  if (h >= 5 && h < 9) return 'morning';
  if (h >= 9 && h < 17) return 'day';
  if (h >= 17 && h < 21) return 'evening';
  return 'night';
}
function applyPhase() {
  const h = new Date().getHours();
  const p = phaseFor(h);
  document.body.classList.remove('phase-morning', 'phase-day', 'phase-evening', 'phase-night');
  document.body.classList.add('phase-' + p);
  const sky = document.getElementById('sky');
  if (sky) sky.className = 'sky ' + p;
}
applyPhase();
setInterval(applyPhase, 60000);

const view = document.getElementById('nowPage');
const dayView = document.getElementById('dayPage');
const overlay = document.getElementById('overlay');
const guideOverlay = document.getElementById('guideOverlay');
let toastTO;

function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTO);
  toastTO = setTimeout(() => t.classList.remove('show'), 2400);
}

function phaseLabel() {
  const s = steps[idx];
  if (!s) return '';
  const [hh, mm] = s.time.split(':').map(Number);
  const diff = (hh * 60 + mm) - (H * 60 + now.getMinutes());
  if (diff > 60) return `tra ${Math.floor(diff / 60)}h${String(diff % 60).padStart(2, '0')}`;
  if (diff > 0) return `tra ${diff} min`;
  if (diff > -60) return `in ritardo di ${-diff} min · niente panico`;
  return 'flessibile';
}

function mapLinks(s) {
  const b = 'https://www.google.com/maps/dir/?api=1';
  const l = `&origin=${encodeURIComponent(s.orig)}&destination=${encodeURIComponent(s.dest)}`;
  return {
    walk: `${b}${l}&travelmode=walking`,
    transit: `${b}${l}&travelmode=transit`,
    drive: `${b}${l}&travelmode=driving`
  };
}
/* Link a un PUNTO di interesse (marker sulla mappa), non a un percorso */
function poiLink(q) {
  return 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(q);
}

let poisOpen = {};
function togglePois() {
  const k = dayIdx + ':' + idx;
  poisOpen[k] = !poisOpen[k];
  render();
}

function renderDayStrip() {
  const strip = document.getElementById('daystrip');
  strip.innerHTML = DAYS.map((d, i) =>
    `<button class="${i === dayIdx ? 'on' : ''}" onclick="switchDay(${i})" role="tab" aria-selected="${i === dayIdx}" aria-label="${d.date}">${d.label}</button>`
  ).join('');
}

function render() {
  renderDayStrip();
  renderDayPage();
  const s = steps[idx];
  if (!s) {
    view.innerHTML = `
      <div class="alldone">
        <div class="emoji">🎉</div>
        <h2>Giornata completata!</h2>
        <p><b>${DAYS[dayIdx].name}</b> è tutto spuntato.<br>Tocca un altro giorno in alto oppure 🗓️ Giorno / ⚙️ Servizio.</p>
        <button class="tbtn on" style="min-height:48px;padding:12px 22px" onclick="openSheet()">⚙️ Apri servizio</button>
      </div>`;
    const pad = document.getElementById('pad-fixed');
    if (pad) { pad.innerHTML = ''; pad.style.display = 'none'; }
    return;
  }
  const isDone = !!state[dayIdx + ':' + idx];
  const guideData = GUIDES[dayIdx + ':' + idx];
  const pois = POIS[dayIdx + ':' + idx] || [];
  const origName = (s.orig || '').replace(/ Lyon$/, '');
  const destName = (s.dest || '').replace(/ Lyon$/, '');
  const norm = x => x.toLowerCase().replace(/œ/g, 'oe');
  const poiRows = [
    s.orig ? { i: '🚩', n: origName, d: 'partenza', q: s.orig, k: 'start' } : null,
    ...pois.filter(p => norm(p.n) !== norm(origName) && norm(p.n) !== norm(destName)),
    s.dest && s.dest !== s.orig ? { i: '🏁', n: destName, d: 'arrivo', q: s.dest, k: 'end' } : null
  ].filter(Boolean);
  const m = mapLinks(s);
  /* Tappa "sul posto": origine = destinazione → niente percorso, solo il punto */
  const onsite = s.orig && s.dest && s.orig === s.dest;
  const doneBtn = isDone
    ? `<button class="pbtn undo" onclick="toggleDone()" aria-label="Deseleziona tappa">DESELEZIONA ✕<small>annulla spunta</small></button>`
    : `<button class="pbtn done" onclick="toggleDone()" aria-label="Segna come fatto">FATTO ✓<small>avanti →</small></button>`;

  view.innerHTML = `
    <div class="kicker">Adesso · ${DAYS[dayIdx].name}<span class="phase" id="phase"></span></div>
    <div class="stepno">Tappa ${idx + 1} di ${steps.length} · ${s.dur}${isDone ? ' · <span class="badge-done">✓ completata</span>' : ''}</div>
    <div class="bigcard">
      <div class="cardhead">
        <div class="emoji" aria-hidden="true">${s.emoji}</div>
        <div class="title">${s.title}</div>
      </div>
      <div class="meta">${s.meta}</div>
      ${s.desc ? `
        <div class="guide-box">
          <div class="guide-title">📖 Cosa sapere</div>
          <div class="guide-text">${s.desc}</div>${guideData ? `<button class="guide-open-btn" onclick="openGuide()">📖 Apri guida completa →</button>` : ''}
        </div>
      ` : ''}
      <div class="map-actions">
        ${onsite
          ? `<a class="map-btn map-here" href="${poiLink(s.dest)}" target="_blank" rel="noopener">📍 Il punto sulla mappa</a>`
          : `<a class="map-btn map-walk" href="${m.walk}" target="_blank" rel="noopener">🚶 A piedi</a>
             <a class="map-btn map-transit" href="${m.transit}" target="_blank" rel="noopener">🚇 Mezzi</a>
             <a class="map-btn map-drive" href="${m.drive}" target="_blank" rel="noopener">🚕 Taxi</a>
             <a class="map-btn map-here" href="${poiLink(s.orig)}" target="_blank" rel="noopener">📍 Sei qui</a>`}
      </div>
      ${poiRows.length ? `<button class="poi-open-btn" onclick="togglePois()">${poisOpen[dayIdx + ':' + idx] ? '▴ Chiudi i punti di interesse' : '📍 Apri i punti di interesse della tappa'}</button>` : ''}
      ${poisOpen[dayIdx + ':' + idx] && poiRows.length ? `<div class="poi-list">${poiRows.map(p => `<div class="poi ${p.k || ''}"><span class="pi">${p.i}</span><span class="pt"><b>${p.n}</b><small>${p.d || ''}</small></span><span class="wrap">${p.walk ? '<span class="flag">🚶 solo a piedi</span>' : ''}<a class="go" href="${poiLink(p.q)}" target="_blank" rel="noopener">🗺️ Apri</a></span></div>`).join('')}</div>` : ''}
      ${s.tip ? `<div class="tip ${s.warn ? 'warn' : ''}">${s.tip}</div>` : ''}
    </div>`;

  let padHTML = document.getElementById('pad-fixed');
  if (!padHTML) {
    padHTML = document.createElement('div');
    padHTML.id = 'pad-fixed';
    padHTML.className = 'pad';
    document.body.appendChild(padHTML);
  }
  padHTML.innerHTML = `
    <div class="pad-inner">
      <button class="pbtn metro" onclick="openTransit()" aria-label="Pianta dei mezzi pubblici">🚇<small>METRO</small></button>
      <button class="pbtn nav ${idx === 0 ? 'off' : ''}" onclick="prevS()" aria-label="Tappa precedente">◀<small>PREC</small></button>
      ${doneBtn}
      <button class="pbtn nav ${idx >= steps.length - 1 ? 'off' : ''}" onclick="nextS()" aria-label="Tappa successiva">▶<small>NEXT</small></button>
      <a class="pbtn tel" href="${s.tel ? 'tel:' + s.tel : 'tel:+33478268181'}" aria-label="${s.tel ? 'Chiama' : 'Chiama taxi'}">📞<small>${s.tel ? 'CHIAMA' : 'TAXI'}</small></a>
    </div>`;
  tick();
}

function tick() {
  const ph = document.getElementById('phase');
  if (ph) ph.textContent = '· ' + phaseLabel();
}
setInterval(tick, 30000);
setInterval(() => {
  const c = document.getElementById('clock');
  if (c) c.textContent = new Date().toLocaleTimeString('it-IT', { hour: '2-digit', minute: '2-digit' });

function renderDayPage() {
  const day = DAYS[dayIdx];

  dayView.innerHTML = `

      <div class="dh-top">

        <span class="dh-time">${day.time}</span>
      </div>
      <div class="prog">
        <div class="bar"><i style="width:${done / day.steps.length * 100}%"></i></div>
        <b>${done}/${day.steps.length}</b>
      </div>
    </div>
    <div class="steps">
      ${day.steps.map((s, i) => {
        const k = dayIdx + ':' + i;
        const isDone = !!state[k];
        const cur = i === idx;
        const g = GUIDES[k];
        const hint = cur && !isDone ? '▶ prossima tappa' : (g ? '📖 guida disponibile' : '');
        return `
          <div class="step ${isDone ? 'done' : ''} ${cur ? 'cur' : ''}" data-i="${i}" data-k="${k}" onclick="goStep(${i})" role="button" tabindex="0">
            <input type="checkbox" class="chk" ${isDone ? 'checked' : ''} data-k="${k}" aria-label="${s.title}" onclick="event.stopPropagation()">
            <div class="st-body">
              <div class="badges">
                <span class="bdg">${i + 1}/${day.steps.length}</span>
                <span class="bdg">${s.time}</span>
              </div>
              <div class="st-tit">${s.emoji}${s.title}</div>
              <div class="st-sub">${s.meta.replace(/<[^>]+>/g, '')}</div>${hint ? `<div class="st-hint">${hint}</div>` : ''}
            </div>
          </div>`;
      }).join('')}
    </div>`;
  dayView.querySelectorAll('.chk').forEach(c => {
    c.addEventListener('change', () => {
      const k = c.dataset.k;
      const card = c.closest('.step');
      const si = +card.dataset.i;
      if (c.checked) {
        state[k] = true;
        undoStack.push(k);
        card.classList.add('done');
        toast(`✓ ${DAYS[dayIdx].steps[si].title}`);
      } else {
        delete state[k];
        card.classList.remove('done');
      }
      save(state);
      const newIdx = steps.findIndex((_, j) => !state[dayIdx + ':' + j]);
      idx = newIdx < 0 ? steps.length : newIdx;
      render();
    });
  });
}

function goStep(i) {
  idx = i;
  showPage('nowPage');

  toast(`▶ ${steps[i].title}`);

function closeGuide() {
  guideOverlay.hidden = true;
  guideOverlay.innerHTML = '';
}
guideOverlay.addEventListener('click', closeGuide);

function toggleDone() {
  const key = dayIdx + ':' + idx;
  if (state[key]) {
    delete state[key];
    save(state);
    undoStack = undoStack.filter(k => k !== key);
    if (navigator.vibrate) navigator.vibrate(20);
    toast(`↩︎ Deselezionata: ${steps[idx].title}`);
    render();
  } else {
    state[key] = true;
    save(state);
    undoStack.push(key);
    if (navigator.vibrate) navigator.vibrate(30);
    toast(`✓ ${steps[idx].title}`);
    idx++;
    if (idx >= steps.length) {
      if (navigator.vibrate) navigator.vibrate([40, 60, 40]);
    }
    render();
  }
}
function nextS() {
  if (idx < steps.length - 1) {
    idx++;
    render();
  }
}
function prevS() {
  if (idx > 0) {
    idx--;
    render();
  }
}

overlay.addEventListener('click', closeSheet);
function switchDay(i) {
  dayIdx = i;
  steps = DAYS[i].steps;
  idx = steps.findIndex((_, k) => !state[i + ':' + k]);
  if (idx < 0) idx = steps.length;
  closeSheet();
  render();
  toast(`Giorno ${i + 1} · ${DAYS[i].name}`);
}
function jumpTo(i) {
  idx = i;
  closeSheet();
  render();
  toast(`▶ Ripresa da: ${steps[i].title}`);
}
function undoLast() {
  const key = undoStack.filter(k => k.startsWith(dayIdx + ':')).pop();
  if (key) {
    const i = +key.split(':')[1];
    delete state[key];
    save(state);
    undoStack = undoStack.filter(k => k !== key);
    idx = i;
    closeSheet();
    render();
    toast('↩︎ Ultima spunta annullata');
    return;
  }
  toast('Niente da annullare');
}
function resetDay() {
  if (!confirm(`Azzerare tutte le tappe di "${DAYS[dayIdx].name}"?`)) return;
  steps.forEach((_, i) => delete state[dayIdx + ':' + i]);
  undoStack = undoStack.filter(k => !k.startsWith(dayIdx + ':'));
  save(state);
  idx = 0;
  closeSheet();
  render();
  toast('Giornata azzerata');
}
function resetAll() {
  if (!confirm('Azzerare l’intero viaggio (tutti i giorni)?')) return;
  state = {};
  save(state);
  undoStack = [];
  dayIdx = 0;
  steps = DAYS[0].steps;
  idx = 0;
  closeSheet();
  render();
  toast('Viaggio azzerato');
}
document.getElementById('svcBtn').addEventListener('click', openSheet);

document.getElementById('food').innerHTML = FOOD.map(g => `
  <div class="list">
    <div class="list-h">${g.h}</div>
    ${g.items.map(r => `
      <div class="ritem">
        <div class="r-top">
          <span class="r-name">${r.n}</span>
          <span class="r-price">${r.p}</span>
        </div>
        <div class="r-addr">${r.a}</div>
        <div class="r-btns">
          ${r.tel ? `<a class="b-tel" href="tel:${r.tel}">📞 Chiama</a>` : ''}
          <a class="b-map" href="${r.map}" target="_blank" rel="noopener">📍 Mappa</a>
          ${r.w ? `<a class="b-web" href="${r.w}" target="_blank" rel="noopener">🌐 Sito</a>` : ''}
        </div>
      </div>
    `).join('')}
  </div>
`).join('') + `
  <div class="tips">
    <div>💡 <b>Prenotate i bouchon</b> — sono piccoli e si riempiono. Portate contanti.</div>
    <div>⏰ Ristoranti chiusi tra 14:00 e 19:00. Halles Bocuse: lun–sab 7:30–19:30 · domenica solo mattina (7:30–13:00).</div>
  </div>`;

const PAGES = {
  nowPage: view,
  dayPage: dayView,
  foodPage: document.getElementById('foodPage'),
  tripPage: document.getElementById('tripPage')
};
function showPage(id) {
  Object.entries(PAGES).forEach(([k, el]) => el.hidden = k !== id);
  document.querySelectorAll('nav a').forEach(x => x.classList.toggle('on', x.dataset.nav === id));
  const strip = document.getElementById('daystrip');
  const useDay = (id === 'nowPage' || id === 'dayPage');
  strip.style.display = useDay ? 'flex' : 'none';
  const pad = document.getElementById('pad-fixed');
  if (pad) pad.style.display = (id === 'nowPage') ? 'flex' : 'none';
  if (id === 'dayPage') renderDayPage();
  if (id === 'nowPage') render();
  window.scrollTo({ top: 0 });
}
document.querySelectorAll('nav a').forEach(a => {
  a.addEventListener('click', e => {
    e.preventDefault();
    showPage(a.dataset.nav);
  });
});

let tx = 0, ty = 0;
view.addEventListener('touchstart', e => {
  tx = e.touches[0].clientX;
  ty = e.touches[0].clientY;
}, { passive: true });
view.addEventListener('touchend', e => {
  const dx = e.changedTouches[0].clientX - tx;
  const dy = e.changedTouches[0].clientY - ty;
  if (Math.abs(dx) > 70 && Math.abs(dx) > Math.abs(dy)) {
    dx < 0 ? nextS() : prevS();
  }
}, { passive: true });
document.addEventListener('keydown', e => {
  if (!PAGES.nowPage.hidden) {
    if (e.key === 'ArrowRight') nextS();
    if (e.key === 'ArrowLeft') prevS();
    if (e.key === ' ') {
      e.preventDefault();
      toggleDone();
    }
  }
  if (e.key === 'Escape') {
    if (!guideOverlay.hidden) closeGuide();
    else if (!overlay.hidden) closeSheet();
  }
});

render();
</script>
