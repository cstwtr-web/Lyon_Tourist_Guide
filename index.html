<!--
  Lyon_Guide · versione "libro"
  Un solo file, nessuna dipendenza, funziona offline (anche da file://).
  I punti numerati 1–17 sono la chiave di lettura: la pagina N porta al punto N.
  Dati in cima allo script (HOTEL, P, CH, FOOD, GUIDES, TRIP, INFO_HTML), poi stato e render().
  Coordinate dei punti: approssimate (±50 m), servono alla pianta schematica e al pallino GPS.
-->
<style>
  :root{
    --bg:#eef5f2; --card:#fff; --ink:#17323b; --mut:#5b7a80; --line:#c3dcd5; --line2:#e2ece9;
    --amber:#e0940f; --amber-t:#8a5a00; --green:#0e9f6e; --green-l:#c8eedd; --blue:#1d4ed8; --gps:#2563eb;
    --red-bg:#fde8e8; --red:#8f1d1d; --tip:#fff6dc; --paper:#fffdf7; --violet:#7c3aed;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{background:var(--bg);color:var(--ink);font-family:-apple-system,'Segoe UI',Roboto,sans-serif;font-size:16px;
    -webkit-text-size-adjust:100%;padding-top:calc(60px + env(safe-area-inset-top));padding-bottom:calc(64px + env(safe-area-inset-bottom))}
  a{color:inherit}
  button{font-family:inherit;color:inherit}
  @media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}
  :focus-visible{outline:3px solid var(--amber);outline-offset:2px}

  /* ---- barra in alto: i capitoli ---- */
  .topbar{position:fixed;top:0;left:0;right:0;z-index:30;display:flex;gap:6px;padding:calc(8px + env(safe-area-inset-top)) 12px 8px;background:rgba(238,245,242,.96);backdrop-filter:blur(10px);border-bottom:1px solid var(--line2)}
  .dchip{flex:1;min-height:44px;border-radius:99px;background:#fff;border:1px solid var(--line);color:var(--mut);font-weight:800;font-size:13px;line-height:1.05;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer}
  .dchip small{font-size:10px;font-weight:700;opacity:.85}
  .dchip.on{background:var(--amber);border-color:var(--amber);color:#fff}

  main{max-width:520px;margin:0 auto;padding:10px 14px 190px}
  main.nopad{padding-bottom:30px}

  /* ---- navigazione in basso ---- */
  nav.bnav{position:fixed;left:0;right:0;bottom:0;z-index:40;background:#fff;border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom)}
  nav.bnav button{flex:1;background:none;border:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:58px;font-size:10.5px;font-weight:800;color:var(--mut);cursor:pointer}
  nav.bnav button span{font-size:19px}
  nav.bnav button.on{color:#b87800}

  /* ---- zona pollice: azione principale + sfoglia ---- */
  .pad{position:fixed;left:0;right:0;bottom:calc(58px + env(safe-area-inset-bottom));z-index:35;padding:14px 14px 10px;background:linear-gradient(rgba(238,245,242,0),var(--bg) 24%)}
  .pad.paper{background:linear-gradient(rgba(255,253,247,0),var(--paper) 24%)}
  .pad-in{max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:8px}
  .pb{display:block;width:100%;border:0;border-radius:16px;font-weight:900;text-align:center;padding:12px 8px;font-size:15.5px;background:var(--green);color:#fff;box-shadow:0 4px 12px rgba(14,159,110,.3);text-decoration:none;cursor:pointer;min-height:52px}
  .pb small{display:block;font-size:11px;font-weight:700;opacity:.92;margin-top:2px}
  .pb.dark{background:var(--ink);box-shadow:none}
  .pr{display:flex;gap:8px}
  .ps{flex:1;border-radius:14px;text-align:center;padding:9px 6px;font-weight:800;font-size:14px;background:#fff;color:var(--ink);border:1px solid var(--line);cursor:pointer;min-height:48px}
  .ps small{display:block;font-size:10.5px;font-weight:700;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ps.off{opacity:.35;pointer-events:none}

  /* ---- testate ---- */
  .kick{font-size:11px;font-weight:900;letter-spacing:.12em;color:#b87800;text-transform:uppercase;margin:4px 0 6px}
  .tt{display:flex;gap:10px;align-items:center;margin:2px 0 8px}
  .num{flex:none;width:42px;height:42px;border-radius:50%;background:var(--green);color:#fff;font-weight:900;font-size:19px;display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 4px var(--green-l)}
  .num.grey{background:#9fb3b3;box-shadow:0 0 0 4px #e3eaea}
  .num.hotel{background:var(--ink);box-shadow:0 0 0 4px #d6e2e6;font-size:20px}
  .tt .n{font-size:23px;font-weight:900;line-height:1.12}
  .tt .n small{display:block;font-size:11px;font-weight:800;letter-spacing:.06em;color:var(--mut);text-transform:uppercase;margin-bottom:2px}
  .story{font-size:15px;line-height:1.5;margin-bottom:10px}
  .story b{color:var(--amber-t)}

  /* ---- schede ---- */
  .card{background:var(--card);border:1px solid #d4e6e0;border-radius:16px;padding:11px 12px;margin-bottom:9px}
  .card h4{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--mut);margin-bottom:6px;font-weight:900}
  .pills{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:9px}
  .pill{font-size:12.5px;font-weight:800;padding:6px 10px;border-radius:99px;background:#fff;border:1px solid var(--line)}
  .pill.red{background:var(--red-bg);border-color:#f3c4c4;color:var(--red)}
  .warn{background:var(--red-bg);color:var(--red);border-radius:12px;padding:9px 11px;font-size:13.5px;font-weight:700;margin-bottom:9px;line-height:1.4}
  .tip{background:var(--tip);border-radius:12px;padding:9px 11px;font-size:13.5px;margin-bottom:9px;line-height:1.45}
  .est{font-size:13px;color:#3d5f63;line-height:1.45}
  .est b{color:var(--ink)}
  .bar{height:7px;border-radius:99px;background:var(--line2);overflow:hidden;margin:2px 0 6px}
  .bar i{display:block;height:100%;background:var(--green);border-radius:99px}

  .see{list-style:none}
  .see li{display:flex;gap:9px;font-size:14px;line-height:1.35;padding:6px 0;align-items:flex-start;border-top:1px solid var(--line2)}
  .see li:first-child{border-top:0}
  .see li .i{flex:none;width:22px;text-align:center;font-size:16px}
  .see li .s{color:var(--mut)}
  .see li.tap{cursor:pointer}
  .see li .chev{margin-left:auto;color:#9fb3b3;font-weight:900;padding-left:6px;font-size:18px;line-height:1}
  .see li .k{flex:none;width:24px;height:24px;border-radius:50%;background:var(--ink);color:#fff;font-size:11.5px;font-weight:900;display:flex;align-items:center;justify-content:center}
  .see li .k.done{background:#9fb3b3}.see li .k.cur{background:var(--green)}.see li .k.nx{background:var(--amber)}
  .see li .t{margin-left:auto;font-size:12px;font-weight:800;color:var(--mut);white-space:nowrap;padding-left:6px}
  .how{list-style:none;counter-reset:h}
  .how li{counter-increment:h;display:flex;gap:9px;font-size:14px;line-height:1.4;padding:5px 0}
  .how li::before{content:counter(h);flex:none;width:22px;height:22px;border-radius:7px;background:var(--violet);color:#fff;font-size:12px;font-weight:900;display:flex;align-items:center;justify-content:center;margin-top:1px}
  .leggi{display:flex;width:100%;align-items:center;gap:10px;margin-top:9px;padding:10px 12px;border-radius:12px;background:var(--ink);color:#fff;border:0;text-align:left;cursor:pointer;min-height:52px}
  .leggi .bk{font-size:24px;line-height:1}
  .leggi b{font-size:15px;font-weight:900;display:block}
  .leggi small{font-size:11.5px;opacity:.82;font-weight:700}
  .leggi .ar{margin-left:auto;font-size:20px;font-weight:900;color:#ffd07a}
  details.ese{background:#fff;border:1px solid #d4e6e0;border-radius:14px;margin-bottom:9px}
  details.ese summary{list-style:none;cursor:pointer;padding:12px;font-weight:800;font-size:14px;min-height:44px}
  details.ese summary::-webkit-details-marker{display:none}
  details.ese summary::after{content:"＋";float:right;color:var(--mut)}
  details.ese[open] summary::after{content:"－"}
  details.ese div{padding:0 12px 12px;font-size:13.5px;line-height:1.55}
  .btn3{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 9px}
  .btn3 a,.btn3 button{flex:1 1 auto;min-width:96px;min-height:44px;display:flex;align-items:center;justify-content:center;gap:4px;padding:8px 10px;border-radius:12px;border:1px solid var(--line);background:#fff;font-size:13px;font-weight:800;text-decoration:none;color:var(--ink);cursor:pointer}

  /* ---- pianta ---- */
  .map{position:relative;border-radius:14px;overflow:hidden;background:#eef1e8;border:1px solid #d4e6e0;margin-bottom:5px}
  .map svg{display:block;width:100%;height:auto}
  .map .mbtn{position:absolute;top:8px;font-size:12px;font-weight:800;background:#fff;color:var(--ink);padding:0 10px;border-radius:10px;box-shadow:0 1px 4px rgba(0,0,0,.18);border:0;min-height:36px;cursor:pointer}
  .map .full{right:8px}.map .gpsb{left:8px}
  .map .gpsb.on{background:var(--gps);color:#fff}
  .mtools{display:flex;gap:6px;margin:0 0 5px}
  .mtools .mt{flex:1;min-height:40px;border-radius:10px;border:1px solid var(--line);background:#fff;font-size:12.5px;font-weight:800;color:var(--ink);cursor:pointer}
  .mtools .mt.on{background:var(--gps);border-color:var(--gps);color:#fff}
  .mleg{display:flex;flex-wrap:wrap;gap:3px 10px;font-size:11px;font-weight:700;color:var(--mut);margin:0 2px 9px}
  .mleg i{display:inline-block;width:10px;height:10px;border-radius:50%;vertical-align:-1px;margin-right:3px}
  .mleg .gtxt{color:var(--gps);font-weight:800}
  .mk{cursor:pointer}

  /* ---- lettura ---- */
  body.reading{background:var(--paper)}
  .rd-h{position:sticky;top:calc(60px + env(safe-area-inset-top));z-index:5;background:var(--paper);margin:-10px -14px 0;padding:10px 14px 8px;border-bottom:1px solid #eadfc8}
  .rd-h .tt{margin:0}
  .rd-h .tt .n{font-size:20px}
  .chips{display:flex;gap:6px;margin-top:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
  .chips::-webkit-scrollbar{display:none}
  .chips button{flex:none;font-size:12px;font-weight:800;padding:0 11px;min-height:36px;border-radius:99px;background:#fff;border:1px solid #e3d6b8;white-space:nowrap;color:#5b4a1f;cursor:pointer}
  .chips button.on{background:var(--amber);border-color:var(--amber);color:#fff}
  .rd{padding:14px 4px 0;color:#2a2a24}
  .rd h3{font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:#b87800;margin:18px 0 6px;font-weight:900;scroll-margin-top:150px}
  .rd h3:first-child{margin-top:4px}
  .rd .tx{font-family:Georgia,'Times New Roman',serif;font-size:17px;line-height:1.6}
  .rd .tx b{font-family:-apple-system,'Segoe UI',Roboto,sans-serif;font-size:15px}
  .rd .tx a{color:#1d4ed8}
  .rd .lead2{font-family:Georgia,serif;font-size:18px;font-style:italic;color:#3d3a2e;line-height:1.55}
  .rd .hl{background:#fff1c9;border-left:4px solid var(--amber);margin:0 -18px;padding:6px 18px 10px}

  /* ---- sommario / indice / mangiare ---- */
  .chap{display:block;width:100%;text-align:left;background:#fff;border:1px solid #d4e6e0;border-radius:16px;padding:11px 12px;margin-bottom:9px;cursor:pointer}
  .chap.on{border:2px solid var(--amber)}
  .chap .top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
  .chap .top b{font-size:16px}
  .chap .top span{font-size:11.5px;font-weight:800;color:var(--mut);white-space:nowrap}
  .chap p{font-size:13px;line-height:1.45;margin:4px 0 7px;color:#3d5f63}
  .nums{display:flex;flex-wrap:wrap;gap:4px;align-items:center}
  .nums span{width:25px;height:25px;border-radius:50%;background:var(--ink);color:#fff;font-size:11px;font-weight:900;display:flex;align-items:center;justify-content:center}
  .nums span.done{background:#9fb3b3}.nums span.cur{background:var(--green)}
  .nums em{font-style:normal;font-size:11.5px;font-weight:700;color:var(--mut);margin-left:3px}
  .todo{list-style:none}
  .todo li{display:flex;gap:9px;align-items:flex-start;padding:7px 0;border-top:1px solid var(--line2);font-size:13.5px;line-height:1.4}
  .todo li:first-child{border-top:0}
  .todo .st{flex:none;font-size:11px;font-weight:900;padding:3px 8px;border-radius:99px;background:var(--red-bg);color:var(--red);white-space:nowrap}
  .todo .st.ok{background:#e1f6ec;color:#0a7f56}
  .reset{display:flex;width:100%;text-align:left;align-items:center;gap:11px;background:#fff;border:1.5px dashed #c99a4a;border-radius:14px;padding:12px;margin:14px 0 9px;cursor:pointer}
  .reset .ic{font-size:24px;font-weight:900;color:#b87800}
  .reset b{font-size:14.5px;font-weight:900;display:block}
  .reset small{font-size:12px;color:var(--mut);line-height:1.4;display:block}
  .search{width:100%;background:#fff;border:1px solid var(--line);border-radius:12px;padding:11px 12px;font-size:16px;margin-bottom:8px;font-family:inherit;color:var(--ink)}
  .seg{display:flex;background:#fff;border:1px solid var(--line);border-radius:12px;padding:3px;margin-bottom:9px}
  .seg button{flex:1;border:0;background:none;border-radius:9px;min-height:38px;font-weight:800;font-size:13px;color:var(--mut);cursor:pointer}
  .seg button.on{background:var(--ink);color:#fff}
  .idx{list-style:none}
  .idx li{display:flex;align-items:center;gap:9px;padding:8px 0;border-top:1px solid var(--line2);font-size:13.5px}
  .idx li:first-child{border-top:0}
  .idx .k{flex:none;width:30px;height:30px;border-radius:50%;background:var(--ink);color:#fff;font-size:12px;font-weight:900;display:flex;align-items:center;justify-content:center;border:0;cursor:pointer}
  .idx .k.o{background:#fff;color:var(--mut);border:1.5px dashed #9fb3b3;cursor:default}
  .idx .k.st{background:#fff4dc;color:#8a5a00;border:1.5px solid #e0b25a;cursor:default}
  .idx .k.ht{background:#d6e2e6;color:var(--ink);cursor:default}
  .idx .nm{flex:1;line-height:1.3;min-width:0}
  .idx .nm b{font-weight:800}
  .idx .nm small{display:block;font-size:11.5px;color:var(--mut)}
  .ib{flex:none;width:40px;height:40px;border-radius:10px;background:var(--blue);color:#fff;display:flex;align-items:center;justify-content:center;font-size:15px;text-decoration:none;border:0;cursor:pointer}
  .ib.rd{background:var(--ink)}
  .ib.star{background:#fff;border:1.5px solid var(--line);color:#c3cfcf;font-size:18px}
  .ib.star.on{background:var(--amber);border-color:var(--amber);color:#fff}
  .sec-t{font-size:11.5px;font-weight:900;color:#b87800;letter-spacing:.1em;text-transform:uppercase;margin:14px 2px 6px}
  .rest{border-top:1px solid var(--line2);padding:9px 0}
  .rest:first-of-type{border-top:0}
  .rest.mine{background:#e9f8f1;margin:0 -8px;padding:9px 8px;border-radius:10px;border-top:0}
  .rest .rt{display:flex;gap:9px;align-items:flex-start}
  .rest .lt{flex:none;width:26px;height:26px;border-radius:50%;background:#fff4dc;color:#8a5a00;border:1.5px solid #e0b25a;font-size:12px;font-weight:900;display:flex;align-items:center;justify-content:center}
  .rest.mine .lt{background:var(--amber);border-color:var(--amber);color:#fff}
  .rest .rn{flex:1;line-height:1.35;font-size:14px;min-width:0}
  .rest .rn b{font-weight:800}
  .rest .rn small{display:block;color:var(--mut);font-size:12px}
  .rest .rb{display:flex;gap:6px;margin:7px 0 0 35px;flex-wrap:wrap}
  .rest .rb a,.rest .rb button{min-height:40px;padding:0 11px;border-radius:10px;font-size:12.5px;font-weight:800;display:flex;align-items:center;gap:4px;text-decoration:none;border:1px solid var(--line);background:#fff;color:var(--ink);cursor:pointer}
  .rest .rb .tel{background:var(--blue);border-color:var(--blue);color:#fff}
  .rest .rb .stb.on{background:var(--amber);border-color:var(--amber);color:#fff}
  .bk-st{display:inline-block;font-size:10.5px;font-weight:900;padding:2px 7px;border-radius:99px;margin-left:4px;vertical-align:1px}
  .bk-st.no{background:var(--red-bg);color:var(--red)}
  .bk-st.ok{background:#e1f6ec;color:#0a7f56}

  /* ---- SOS / Info (contenuti della versione precedente) ---- */
  .list{margin-bottom:14px}
  .list-h,.sec-h{font-size:12px;font-weight:900;color:#b87800;letter-spacing:.08em;text-transform:uppercase;margin:12px 2px 7px}
  .ritem{background:#fff;border:1px solid #d4e6e0;border-radius:14px;padding:11px 12px;margin-bottom:8px}
  .ritem.alert{background:var(--red-bg);border-color:#f3c4c4}

  "0:1":{heroEmoji:"🏘️",wiki:"Vieux Lyon",subtitle:"Vieux Lyon · Place Saint-Jean",intro:"La Città Vecchia è il più grande quartiere rinascimentale d'Europa, tutelato dall'UNESCO. Stasera siete nel suo cuore, Place Saint-Jean: la piazza che apre la passeggiata.",sections:[
    {icon:"⚡",title:"In sintesi",text:"⏱️ 5–10 min (solo piazza) · 💶 gratis · 🚇 Metro D, fermata <b>Vieux Lyon</b> · 🕐 sempre aperta<br>📍 Punto di partenza della serata"},

    {icon:"📖",title:"Da sapere",text:"La <b>Vecchia Lione</b> si estende lungo la riva destra della Saona. Qui, durante il Rinascimento, lavoravano gli artigiani della seta. Le facciate color pastello che vedete sono proprio di quel periodo (XVI sec.)."},

    {icon:"🛡️",title:"Salvato nel 1964",text:"Negli anni '60 il quartiere rischiava la demolizione. Nel <b>1964</b> è diventato il <b>primo 'secteur sauvegardé' di Francia</b>; dal <b>1998</b> il centro storico di Lione è <b>patrimonio UNESCO</b>."},

  "x:croix":{heroEmoji:"👨‍🏭",wiki:"Croix-Rousse",title:"Extra · La Croix-Rousse, la collina che lavora",subtitle:"Croix-Rousse · extra",intro:"La terza collina di Lione: qui i canuts tessero la seta. Da visitare solo se hai mezza giornata in più.",sections:[

    {icon:"⭐",title:"Non perdere",text:"• Il <b>Mur des Canuts</b> (fresco di 1.200 m² su Boulevard des Canuts)<br>• Il <b>mercato di Boulevard de la Croix-Rousse</b> (mar–dom mattina)<br>• La <b>salita delle scale</b> con vista sulla città"},
    {icon:"📖",title:"La collina che lavora",text:"Contrapposta alla Fourvière 'che prega', la <b>Croix-Rousse</b> ospitava le seterie. I soffitti sono alti (4 m) perché i telai Jacquard occupavano molto spazio."},
    {icon:"🧵",title:"I canuts",text:"Nel <b>1831</b> da qui partì la <b>rivolta dei canuts</b>, tra le prime grandi rivolte operaie d'Europa: i tessitori contro le tariffe imposte dai mercanti di seta."},

  "0:2":{heroEmoji:"🚪",wiki:"Traboule",subtitle:"La Longue Traboule · 54 Rue Saint-Jean",intro:"Il traboule più lungo di Lione: cinque cortili rinascimentali in fila, da Rue Saint-Jean a Rue du Bœuf. Un passaggio coperto esistente solo in questa città.",sections:[
    {icon:"⚡",title:"In sintesi",text:"⏱️ 5–10 min · 💶 gratis · 🕐 <b>chiude alle 19:00</b> · 🚪 ingresso 54 Rue Saint-Jean → uscita 27 Rue du Bœuf<br>♿ scalini nei cortili (non accessibile in carrozzina)"},
    {icon:"⭐",title:"Non perdere",text:"• La <b>scala a chiocciola</b> nel primo cortile<br>• La <b>facciata del XVI secolo</b> sul lato di Rue du Bœuf<br>• I passaggi semi-coperti che collegano i cortili"},
    {icon:"📍",title:"Dove sei",text:"Ingresso al <b>54 di Rue Saint-Jean</b>, uscita al <b>27 di Rue du Bœuf</b>. Il portone è a due passi dalla Cattedrale. <a href='https://www.google.com/maps/search/?api=1&query=Longue+Traboule%2C+54+Rue+Saint-Jean%2C+69005+Lyon' target='_blank'>Apri mappa</a>"},
    {icon:"📖",title:"Cosa sono i traboules",text:"Dal latino <i>trans ambulare</i>, 'passare attraverso': scorciatoie che collegano due strade attraversando uno o più palazzi. Quelle del Vieux Lyon sono quasi tutte <b>rinascimentali</b>; quelle della Croix-Rousse (XVIII–XIX sec.) sono legate ai <b>canuts</b>, i tessitori della seta."},
    {icon:"🧭",title:"Quanti sono",text:"Circa <b>500</b> tra traboules e cortili (≈200 nel Vieux Lyon), ma solo <b>una cinquantina</b> aperti al pubblico. Dal <b>1990</b> una convenzione con i proprietari garantisce il passaggio 7:00–19:00, in cambio di pulizia e luci pagate dalla città. Questa attraversa <b>cinque cortili e quattro edifici</b>: è la più lunga del Vieux Lyon."},
    {icon:"🚪",title:"Come entrare",text:"Aperta <b>tutti i giorni 7:00–19:00</b>. Si entra da uno dei due portoni (54 Rue Saint-Jean o 27 Rue du Bœuf). È usata ogni giorno dai residenti: silenzio, niente flash, niente foto alle persone."},
    {icon:"🧩",title:"Una parola tutta lionese",text:"Esiste anche la <b>miraboule</b>: il cortile interno che non porta da nessuna parte, se non a sé stesso. La parola l'ha inventata lo storico Félix Benoît negli anni '60."},
    {icon:"🎲",title:"Se...",text:"🚫 Se è chiuso (dopo le 19:00): niente da fare, passa alla Cattedrale<br>⏳ Se hai 15 min in più: <b>Traboule de la Tour Rose</b> (16 Rue du Bœuf, ingresso con citofono)<br>☔ Se piove: è la cosa migliore da fare al coperto"},
    {icon:"💡",title:"Consiglio",text:"Entra da Rue Saint-Jean ed esci in Rue du Bœuf: così sbuchi davanti alla facciata del Cinquecento."},
    {icon:"⚠️",title:"Attenzione",text:"Chiude alle <b>19:00</b>: per questo lo facciamo <i>prima</i> della cattedrale e di Fourvière."}]},

  "0:3":{heroEmoji:"⛪",wiki:"Cathédrale Saint-Jean-Baptiste de Lyon",subtitle:"Cattedrale Saint-Jean",intro:"Il cuore del Vieux Lyon: il miglior esempio europeo di transizione romanico→gotico, con uno dei più antichi orologi astronomici d'Europa.",sections:[
    {icon:"⚡",title:"In sintesi",text:"⏱️ 15–30 min · 💶 gratis · 🕐 <b>lun–ven 8:15–19:45</b> · sab–dom 8:15–19:00<br>📍 Place Saint-Jean"},
    {icon:"⭐",title:"Non perdere",text:"• L'<b>orologio astronomico</b>, uno dei più antichi d'Europa<br>• Il <b>rosone</b> sopra il portale centrale<br>• Il <b>Giardino Archeologico</b> accanto alla cattedrale (resti delle chiese paleocristiane)"},
    {icon:"📍",title:"Dove sei",text:"<b>Place Saint-Jean</b>, a due passi dall'uscita della traboule. <a href='https://www.google.com/maps/search/?api=1&query=Cath%C3%A9drale+Saint-Jean-Baptiste%2C+8+Place+Saint-Jean%2C+69005+Lyon' target='_blank'>Apri mappa</a>"},
    {icon:"⛪",title:"La Cattedrale",text:"<b>Uno dei migliori esempi europei di transizione dal romanico al gotico</b>: l'abside e il coro sono romanici (dal 1175), la navata e la facciata gotiche (fino al 1480). Aperta <b>8:15–19:45</b> nei giorni feriali, ingresso gratuito. È un luogo di culto: voce bassa durante le funzioni."},
    {icon:"🕰️",title:"L'orologio astronomico",text:"Citato già nel <b>XV secolo</b>, reinstallato da Hugues Levet nel <b>1598</b>. Si anima solo <b>quattro volte al giorno: 12:00, 14:00, 15:00 e 16:00</b>. Stasera ammira solo il meccanismo."},
    {icon:"👑",title:"Qui è passata la storia",text:"Due <b>concili ecumenici</b> (1245 e 1274), l'incoronazione di papa <b>Giovanni XXII</b> (1316) e il matrimonio di <b>Enrico IV con Maria de' Medici</b> (13 dicembre 1600)."},
    {icon:"🏗️",title:"Tre secoli di cantiere",text:"Iniziata verso il <b>1180</b> e finita nel <b>1480</b>: per questo l'abside è romanica e la facciata gotica. Il Dio Padre in cima al timpano è del 1481."},
    {icon:"🔍",title:"Cosa guardare nell'orologio",text:"Oltre all'ora segna la <b>data</b>, le posizioni di <b>Sole, Luna e Terra</b> e il sorgere delle stelle sopra Lione. Quando si anima, gli automi mettono in scena animali e un'<b>Annunciazione</b>."},
    {icon:"🎲",title:"Se...",text:"☔ Se piove: perfetto, sei al coperto<br>🚫 Se è chiusa (dopo le 19:45): la facciata illuminata vale comunque la sosta<br>⏳ Se hai 15 min in più: il Giardino Archeologico accanto"},
    {icon:"💡",title:"Consiglio",text:"Non fermarti alla navata: guarda il passaggio dal romanico del coro al gotico della facciata, e il <b>rosone</b> dal lato opposto della piazza."}]},

  "0:4":{heroEmoji:"🚡",wiki:"Funiculaire de Fourvière",subtitle:"Funicolare Saint-Jean → Fourvière",intro:"La funicolare parte accanto alla Cattedrale e ti porta sulla 'Collina che prega'. Cinque minuti di salita, quasi tutta in galleria.",sections:[
    {icon:"⚡",title:"In sintesi",text:"⏱️ 5 min · 💶 <b>2,10 €</b> (biglietto TCL, 1h: salita + discesa) · 🕐 ogni 5–10 min, ultima corsa ~22:00<br>🚡 linea F2, stazione <b>Vieux Lyon – Cathédrale Saint-Jean</b>"},
    {icon:"⭐",title:"Non perdere",text:"• Il <b>panorama sulla città</b> appena usciti dalla stazione superiore<br>• La <b>basilica illuminata</b> a pochi passi dall'uscita"},
    {icon:"📍",title:"Dove sei",text:"Stazione della funicolare accanto alla <b>Cattedrale di Saint-Jean</b>. <a href='https://www.google.com/maps/search/?api=1&query=Funiculaire+de+Lyon%2C+Cath%C3%A9drale+Saint-Jean-Baptiste%2C+69005+Lyon' target='_blank'>Apri mappa</a>"},
    {icon:"📖",title:"La collina che prega",text:"Sulla collina nacque il primo nucleo di <b>Lugdunum</b>. Qui nacquero <b>Claudio</b> e <b>Caracalla</b>. Oggi è il quartiere religioso e panoramico della città."},
    {icon:"🏛️",title:"La zona romana",text:"Restano il <b>Teatro Antico</b> (il più antico di Francia, 15 a.C.) e l'<b>Odeon</b>. Il Museo Gallo-Romano (a 5 min) espone la <b>tavola in bronzo di Claudio</b>."},
    {icon:"🚡",title:"La funicolare",text:"La prima funicolare di Lione (Saint-Jean–Saint-Just, oggi F1) è del <b>1878</b>; quella di Fourvière, la F2, del <b>1900</b>. Il ticket TCL (2,10 €) vale <b>1 ora</b> con convalide illimitate: copre anche la discesa."},
    {icon:"🧵",title:"Le due 'ficelle'",text:"I lionesi chiamano le funicolari <b>'ficelle'</b>, lo spago. Dalla stessa stazione partono la <b>F1</b> (1878) per Saint-Just e i teatri romani, e la <b>F2</b> (1900) per Fourvière: prendete la F2."},

  "0:5":{heroEmoji:"🌃",wiki:"Basilique de Fourvière",subtitle:"Basilica di Fourvière",intro:"La basilica (1872–1896) mescola bizantino, romanico e gotico. L'esplanade panoramica accanto è il punto foto migliore di Lione, di giorno e di notte.",sections:[
    {icon:"⚡",title:"In sintesi",text:"⏱️ 20–30 min (basilica + terrazza) · 💶 gratis · 🕐 basilica <b>7:00–20:00</b> · cancelli del santuario fino alle 23:00<br>📍 Cima della collina di Fourvière"},
    {icon:"⭐",title:"Non perdere",text:"• L'<b>esplanade panoramica</b> accanto alla basilica (il tappeto di luci di notte, le Alpi di giorno)<br>• I <b>mosaici dorati</b> dell'interno<br>• La <b>cripta di San Giuseppe</b> sotto la basilica (gratis)<br>• La <b>Vergine dorata</b> (1852) sulla torre della vecchia cappella"},
    {icon:"📍",title:"Dove sei",text:"Sulla cima della collina, alla terrazza davanti alla basilica. <a href='https://www.google.com/maps/search/?api=1&query=Basilique+Notre-Dame+de+Fourvi%C3%A8re%2C+8+Place+de+Fourvi%C3%A8re%2C+69005+Lyon' target='_blank'>Apri mappa</a>"},
    {icon:"📖",title:"Da sapere",text:"Iniziata nel <b>1872</b> e consacrata nel <b>1896</b>, su progetto di <b>Pierre Bossan</b>. Capolavoro neobizantino con influenze gotiche e romaniche, nata da un voto del 1870, durante la guerra franco-prussiana."},
    {icon:"😲",title:"Curiosità",text:"Vista dalla Città Vecchia, sembra un <b>gigantesco elefante rovesciato</b>! Le due chiese sono sovrapposte: in alto la basilica, in basso la cripta dedicata a San Giuseppe."},
    {icon:"👀",title:"La vista",text:"Stasera, il tappeto di luci della città. Di giorno, se limpido, <b>le Alpi fino al Monte Bianco</b>. A destra si vede la <b>Tour Métallique</b>, la 'Tour Eiffel di Lione'."},
    {icon:"🏛️",title:"Nei dintorni",text:"A 5 min a piedi, al <b>6 Rue de l'Antiquaille</b>: il <b>Grand Théâtre</b> (~15 a.C., il più antico di Francia; fino a <b>10.700</b> spettatori dopo l'ampliamento di Adriano) e l'<b>Odéon</b> (3.000 posti). Ingresso gratis, in ottobre <b>7:00–19:00</b>: stasera sono chiusi."},
    {icon:"🕯️",title:"Qui è nata la Festa delle Luci",text:"L'8 dicembre <b>1852</b> si inaugurava la <b>Vergine dorata</b> di Fabisch (rinviata da settembre per una piena della Saona). Pioveva; la sera il cielo si aprì e i lionesi misero spontaneamente <b>lumini alle finestre</b>. Da allora ogni 8 dicembre la città si illumina; dal 1999 è la <b>Fête des Lumières</b>."},
    {icon:"🗼",title:"La Tour Métallique",text:"<b>85,90 m</b> di traliccio, costruita tra il <b>1892 e il 1894</b> imitando l'ultimo piano della Tour Eiffel. Sta a ~372 m d'altitudine, il punto più alto di Lione. Oggi trasmette TV e radio: non si visita."},
    {icon:"🎲",title:"Se...",text:"☔ Se piove: la basilica è coperta ma la terrazza no<br>⏳ Se hai 15 min in più: affacciati sui Teatri Romani dall'alto (di sera sono chiusi)<br>🌫️ Se c'è nebbia: la terrazza perde il panorama, ma l'interno della basilica vale comunque<br>🌙 Se torni a dicembre: la <b>Festa delle Luci</b> (8 dicembre) trasforma Fourvière in uno spettacolo"},
    {icon:"💡",title:"Consiglio",text:"L'esplanade accanto alla basilica è il punto foto migliore di Lione. Di sera porta un giubbotto: in cima c'è spesso vento."}]},

  "0:6":{heroEmoji:"🚡",subtitle:"Funicolare giù a Saint-Jean",intro:"Discesa rapida con la F2 verso il cuore del Vieux Lyon.",sections:[
    {icon:"⚡",title:"In sintesi",text:"⏱️ 5 min · 💶 compresa nel ticket della salita (se entro 1h) · 🕐 ogni 5–10 min, ultima ~22:00<br>🚡 linea F2, da Fourvière a Vieux Lyon – Cathédrale"},
    {icon:"⭐",title:"Non perdere",text:"• Un ultimo sguardo al <b>panorama notturno</b> prima di entrare in stazione"},
    {icon:"📍",title:"Dove sei",text:"Stazione superiore della funicolare F2, a 50 m dalla basilica. <a href='https://www.google.com/maps/search/?api=1&query=Funiculaire+Fourvi%C3%A8re%2C+Place+de+Fourvi%C3%A8re%2C+69005+Lyon' target='_blank'>Apri mappa</a>"},
    {icon:"🚡",title:"La funicolare",text:"Il biglietto della salita vale <b>1 ora</b> con convalide illimitate: se hai convalidato meno di un'ora fa, riconvalida lo stesso ticket."},
    {icon:"🎲",title:"Se...",text:"⚠️ Se la F2 è in manutenzione: bus navetta TCL da/per Fourvière (stesso biglietto)<br>🥾 Se vuoi scendere a piedi: la <b>Montée Saint-Barthélemy</b> (10 min, ripida) porta in Rue Saint-Jean<br>🌃 Se è tardi: l'ultima F2 parte verso le 22:00 (verifica tcl.fr), poi taxi"},
    {icon:"💡",title:"Consiglio",text:"La F2 parte ogni 5–10 min. In discesa di solito non c'è coda: se la cabina è piena, aspetta la successiva."},
    {icon:"📞",title:"Numeri utili",text:"🚇 <b>Info TCL</b>: <a href='https://www.tcl.fr' target='_blank'>tcl.fr</a> (orari e manutenzioni in tempo reale) · 🚕 <b>Taxi Lyonnais</b>: <a href='tel:+33478268181'>04 78 26 81 81</a>"}]},

  "0:7":{heroEmoji:"🍽️",subtitle:"Cena in un bouchon",intro:"Le storiche trattorie lionesi: andouillette, quenelle, saucisson chaud. Il modo più autentico per chiudere la giornata.",sections:[
    {icon:"⚡",title:"In sintesi",text:"⏱️ 1h 30–2h · 💶 25–40 €/persona (vino incluso) · 🕐 prenotate per 4 · 📍 Vieux Lyon<br>💳 qualche locale piccolo preferisce i contanti: tenetene un po'"},
    {icon:"⭐",title:"Non perdere",text:"• L'<b>andouillette</b> (salsiccia di maiale e trippa) — il piatto-simbolo<br>• La <b>quenelle di luccio</b> con salsa Nantua<br>• Il <b>saucisson chaud brioché</b><br>• Un <b>Côtes du Rhône</b> della casa"},
    {icon:"📖",title:"Cosa sono i bouchon",text:"Trattorie storiche di Lione, riconoscibili dal <b>fascio di fieno</b> appeso all'insegna. Cucina di recupero, porzioni generose, atmosfera rumorosa: sono l'opposto dello stellato, ed è per questo che sono autentici."},
    {icon:"👩‍🍳",title:"Le 'Mères Lyonnaises'",text:"Figure come <b>Eugénie Brazier</b> (prima donna con tre stelle Michelin, 1933) hanno reso celebre la cucina lionese. Il modello era: padrona di casa + cucina borghese semplificata + prodotti del mercato."},
    {icon:"🍖",title:"Cosa mangiare",text:"<b>Andouillette</b> (se ti piace il sapore forte), <b>quenelle</b> (delicata, per tutti), <b>saucisson chaud</b> (antipasto tipico). Vino: un <b>Côtes du Rhône</b> o un Beaujolais (il 'pot lyonnais', la brocca di ceramica)."},
    {icon:"🎲",title:"Se...",text:"🚫 Se il bouchon è pieno: alternative nella scheda 🍽️ Mangiare<br>🥗 Se sei vegetariano: la cucina lionese è tradizionalmente di carne, ma molti bouchon hanno opzioni (chiedi al momento della prenotazione)<br>🍷 Se vuoi solo bere: molti bouchon hanno un banco bar dove si può bere un bicchiere senza cena"},
    {icon:"📞",title:"Prenotazioni",text:"Nomi e numeri nella scheda 🍽️ Mangiare. Prenotate <b>prima di partire</b>: il giovedì sera i bouchon si riempiono."},
    {icon:"💡",title:"Consiglio",text:"Non ordinate tutto subito: le porzioni sono abbondanti, meglio dividere. Il servizio è già incluso nel conto."},
    {icon:"📞",title:"Numeri utili",text:"🍽️ <b>Ristoranti</b>: scheda 🍽️ Mangiare · 🚕 <b>Taxi Lyonnais</b>: <a href='tel:+33478268181'>04 78 26 81 81</a>"}]},

  "0:8":{heroEmoji:"🚕",subtitle:"Rientro in hotel",intro:"Rientro comodo in taxi. Meglio non tornare a piedi.",sections:[
    {icon:"⚡",title:"In sintesi",text:"⏱️ 10 min · 💶 20–27 € · 📍 da Vieux Lyon a Hôtel Charlemagne (Perrache)<br>🚕 taxi in Place Saint-Jean o chiamato per telefono"},
    {icon:"⭐",title:"Non perdere",text:"• La <b>vista notturna</b> della Cattedrale dal finestrino<br>• Il <b>lungofiume della Saona</b> illuminato (se il taxi passa da lì)"},
    {icon:"🚕",title:"Come chiamare",text:"Ci sono taxi in Place Saint-Jean fino a tardi. In alternativa: <b>Taxi Lyonnais 24/7</b> al <a href='tel:+33478268181'>04 78 26 81 81</a> (radiotaxi, sempre attivo) oppure <b>Allo Taxi</b> al <a href='tel:+33472104106'>04 72 10 41 06</a>."},
    {icon:"🎲",title:"Se...",text:"🌧️ Se piove e non trovi taxi: chiama, non aspettare sotto la pioggia<br>💶 Se hai solo carta: quasi tutti i taxi accettano carte ormai, ma chiedi prima di salire<br>🚶 Se vuoi risparmiare: ~30 min a piedi in piano lungo la Saona"},
    {icon:"💡",title:"Consiglio",text:"Chiamate il taxi quando chiedete il conto: in 4 ci state in un solo taxi. Domani la giornata è lunga."},
    {icon:"🌙",title:"Domani",text:"Bellecour, Terreaux, Mur des Lyonnais, Parc de la Tête d'Or, Halles Bocuse e Brasserie Georges. Sveglia alle 8:00, partenza alle 9:00."},
    {icon:"📞",title:"Numeri utili",text:"🚕 <b>Taxi Lyonnais 24/7</b>: <a href='tel:+33478268181'>04 78 26 81 81</a><br>🚕 <b>Allo Taxi</b>: <a href='tel:+33472104106'>04 72 10 41 06</a><br>🚨 <b>Emergenze</b>: 112"}]},

  "1:0":{heroEmoji:"🚇",wiki:"Place Bellecour",subtitle:"Place Bellecour",intro:"312×200 metri: la più grande piazza pedonale d'Europa. Il punto di partenza della giornata.",sections:[
    {icon:"⚡",title:"In sintesi",text:"⏱️ 10 min (piazza) · 💶 gratis · 🚇 Metro A/D, fermata <b>Bellecour</b> · 🕐 sempre aperta · ♿ accessibile<br>📍 Centro di Lione, tra Rodano e Saona"},
    {icon:"⭐",title:"Non perdere",text:"• La <b>statua equestre di Luigi XIV</b> al centro (1825)<br>• Il <b>chilometro zero</b>: tutte le distanze di Lione si misurano da qui<br>• La <b>vista sulla collina di Fourvière</b> da sud-ovest"},
    {icon:"📍",title:"Dove sei",text:"<b>Place Bellecour</b>, Metro A/D fermata Bellecour. <a href='https://www.google.com/maps/search/?api=1&query=Place+Bellecour%2C+69002+Lyon' target='_blank'>Apri mappa</a>"},
    {icon:"📖",title:"Da sapere",text:"Con <b>~62.000 m²</b> (312×200 m) è la più grande piazza pedonale d'Europa e la terza di Francia. Le facciate sono di <b>Robert de Cotte</b>; la prima statua di Luigi XIV (1713) fu distrutta nel 1793."},
    {icon:"👀",title:"Da vedere",text:"La <b>statua equestre di Luigi XIV</b> (1825, di François-Frédéric Lemot) e, sullo sfondo, la <b>collina di Fourvière</b> con la basilica."},
    {icon:"🐴",title:"'Sotto la coda del cavallo'",text:"I lionesi chiamano la statua il <b>Cheval de Bronze</b> e si danno appuntamento 'sotto la coda del cavallo'. La prima statua del Re Sole (1713) fu fusa durante la Rivoluzione; quella attuale è stata restaurata nel 2023–2024."},
    {icon:"✈️",title:"Saint-Exupéry e il Piccolo Principe",text:"Sul lato Saona, davanti alla libreria Decitre: <b>Antoine de Saint-Exupéry</b>, nato a Lione, seduto con il <b>Piccolo Principe</b> su una colonna di marmo bianco (2000, centenario della nascita)."},
    {icon:"📛",title:"Da dove viene il nome",text:"Da <b>'Bella Curtis'</b>, 'bel giardino': era una vigna dell'arcivescovo. È Place Bellecour solo dal <b>1850</b>, dopo essere stata place Louis-le-Grand, de la Fédération e Bonaparte. L'<b>Office du Tourisme</b> è nel padiglione della piazza, lato Rodano."},
    {icon:"🎲",title:"Se...",text:"🛍️ Se vuoi fare shopping: Rue de la République parte da qui (pedonale, 1 km)"},
    {icon:"💡",title:"Consiglio",text:"Piazza enorme e senza ripari dal vento: a fine ottobre una giacca in più. Non perderci più di 10 minuti: il bello arriva dopo."}]},

  "1:1":{heroEmoji:"⛲",wiki:"Place des Terreaux",subtitle:"Place des Terreaux",intro:"Il cuore di Lione: Municipio, Fontana Bartholdi e Museo di Belle Arti.",sections:[
    {icon:"⚡",title:"In sintesi",text:"⏱️ 15–20 min (piazza) · 💶 gratis · 🚇 Metro A/C, <b>Hôtel de Ville – Louis Pradel</b> · 🕐 sempre aperta · ♿ accessibile<br>📍 Tra Croix-Rousse e Presqu'île"},
    {icon:"⭐",title:"Non perdere",text:"• La <b>Fontana Bartholdi</b> (1892, lo stesso scultore della Statua della Libertà)<br>• La <b>facciata del Municipio</b> (XVII sec.)<br>• Il <b>Museo di Belle Arti</b> sul lato sud (8 €, chiuso il martedì)"},
    {icon:"📍",title:"Dove sei",text:"<b>Place des Terreaux</b>. Metro A/C, Hôtel de Ville – Louis Pradel. <a href='https://www.google.com/maps/search/?api=1&query=Place+des+Terreaux%2C+69001+Lyon' target='_blank'>Apri mappa</a>"},
    {icon:"📖",title:"Da sapere",text:"Il nome viene dai <b>'terreaux'</b>, i terrapieni con cui fu colmato un antico fossato. Oggi è la piazza del Municipio e del Museo di Belle Arti."},
    {icon:"👀",title:"Da vedere",text:"L'<b>Hôtel de Ville</b> (XVII sec., facciata monumentale), la <b>Fontana di Bartholdi</b> (1892), il <b>Museo di Belle Arti</b> (una delle collezioni più ricche di Francia: 8 €, chiuso il martedì, venerdì 10:30–18:00)."},
    {icon:"⛲",title:"Una fontana nata per Bordeaux",text:"Bartholdi la disegnò per <b>Bordeaux</b> come 'carro trionfale della Garonna', ma era troppo cara: Lione la comprò dopo l'Esposizione universale del <b>1889</b>. Marianne guida <b>quattro cavalli</b>, i fiumi che corrono al mare; pesa <b>21 tonnellate</b>. Al centro della piazza dal 1992, restaurata nel 2016–2018."},
    {icon:"🎭",title:"L'Opéra di Jean Nouvel",text:"A 2 minuti, in Place de la Comédie: un teatro del <b>1831</b> su cui Jean Nouvel (1985–1993) ha posato una grande <b>volta di vetro e acciaio</b> che ne raddoppia l'altezza."},
    {icon:"🎲",title:"Se...",text:"🖼️ Se piove: il Museo di Belle Arti è perfetto (10:30–18:00)<br>⏳ Se hai 30 min in più: sali alla <b>Croix-Rousse</b> con la Metro C (a cremagliera) da Hôtel de Ville"},
    {icon:"💡",title:"Consiglio",text:"Sedetevi a un tavolino e godetevi il viavai. È una delle piazze più vive di Lione: qui si incontra tutto il centro."}]},

  "1:2":{heroEmoji:"🎨",wiki:"Fresque des Lyonnais",subtitle:"Mur des Lyonnais",intro:"Muro dipinto di 800 m² con ~30 lionesi celebri: 2000 anni di storia di Lione. Gratis, visibile dalla strada, 10 minuti ben spesi.",sections:[
    {icon:"⚡",title:"In sintesi",text:"⏱️ 10–15 min · 💶 gratis · 🕐 sempre visibile · 🚶 ~10 min da Place des Terreaux<br>📍 Angolo 49 Quai Saint-Vincent / 2 Rue de la Martinière, 1er"},
    {icon:"⭐",title:"Non perdere",text:"• I <b>fratelli Lumière</b> (inventori del cinema)<br>• <b>Claudio</b>, l'imperatore romano nato a Lione<br>• <b>Saint-Exupéry</b> con il Piccolo Principe<br>• <b>Paul Bocuse</b>, lo chef più famoso di Francia<br>• <b>Jacquard</b> con il telaio per la seta (lato Quai Saint-Vincent)"},
    {icon:"📍",title:"Dove sei",text:"Angolo <b>Quai Saint-Vincent / Rue de la Martinière</b>, lungo la Saona, ~10 minuti da Place des Terreaux. <a href='https://www.google.com/maps/search/?api=1&query=Fresque+des+Lyonnais%2C+2+Rue+de+la+Martini%C3%A8re%2C+69001+Lyon' target='_blank'>Apri mappa</a>"},
    {icon:"📖",title:"Da sapere",text:"Dipinto nel <b>1994–95</b> dalla Cité de la Création. <b>800 m²</b> su due lati e <b>~30 personaggi</b> (25 storici e 6 contemporanei): Claudio, i <b>fratelli Lumière</b>, <b>Jacquard</b>, <b>Ampère</b>, <b>Paul Bocuse</b>, <b>Saint-Exupéry</b>. Un trompe-l'œil architettonico su 2000 anni di storia lionese."},
    {icon:"🎨",title:"Il trompe-l'œil",text:"Il muro 'finge' di essere un palazzo con balconi, finestre e botteghe. I personaggi si affacciano dalle finestre finte come se fossero inquilini. Guarda i dettagli: il cinema dei Lumière, il telaio di Jacquard, il Piccolo Principe che parla con Saint-Exupéry."},
    {icon:"🧑‍🤝‍🧑",title:"Chi cercare",text:"• <b>Lato Quai Saint-Vincent</b>: l'imperatore Claudio, Jacquard, il pittore Puvis de Chavannes, il regista Bertrand Tavernier<br>• <b>Lato Rue de la Martinière</b>: Ampère, i fratelli Lumière, Saint-Exupéry con il Piccolo Principe, <b>Guignol</b> con il suo creatore Laurent Mourguet, Paul Bocuse, Juliette Récamier"},
    {icon:"🎲",title:"Se...",text:"☔ Se piove: il muro è scoperto, ma vale comunque una sosta di 5 min<br>⏳ Se hai 20 min in più: il <b>Mur des Canuts</b> alla Croix-Rousse (Metro C)<br>📸 Se vuoi la foto migliore: di mattina, con il sole sulla facciata"},
    {icon:"💡",title:"Consiglio",text:"Gratuita e visibile dalla strada. Fate il gioco: chi trova per primo <b>Guignol</b>, il <b>Piccolo Principe</b> e il regista <b>Bertrand Tavernier</b>?"}]},

  "1:3":{heroEmoji:"🌳",wiki:"Parc de la Tête d'Or",subtitle:"Parc de la Tête d'Or",intro:"Grande parco cittadino con lago, serre botaniche e piccolo zoo. Ingresso gratuito, 105 ettari, uno dei più grandi parchi urbani di Francia.",sections:[
    {icon:"⚡",title:"In sintesi",text:"⏱️ 1h–1h 30 · 💶 gratis · 🕐 <b>6:30–20:30</b> (invernale) · 🚇 Metro A <b>Masséna</b> + 10 min a piedi · 🚌 C1<br>📍 6e arrondissement"},
    {icon:"⭐",title:"Non perdere",text:"• Il <b>lago</b> (16 ettari) e l'imbarcadero<br>• Le <b>Grandes Serres</b> (piante tropicali) — <b>9:00–16:30</b><br>• Il <b>giardino zoologico</b> gratuito<br>• La <b>Porte des Enfants du Rhône</b>, l'ingresso monumentale sul Rodano"},
    {icon:"📍",title:"Dove sei",text:"Nel 6e arrondissement. Metro A fino a <b>Masséna</b>, poi ~10 min a piedi. <a href='https://www.google.com/maps/search/?api=1&query=Parc+de+la+T%C3%AAte+d%27Or%2C+Place+G%C3%A9n%C3%A9ral+Leclerc%2C+69006+Lyon' target='_blank'>Apri mappa</a>"},
    {icon:"📖",title:"Da sapere",text:"Creato nel <b>1857</b>, oggi <b>105 ettari</b> (117 quelli acquistati nel 1856), progettato da Denis e Eugène Bühler. Il nome deriva da una leggenda: una <b>testa di Cristo in oro</b> sarebbe sepolta sul fondo del lago. Da qui il nome 'Tête d'Or'."},
    {icon:"🕐",title:"Orari e stagioni",text:"Dal 15 ottobre chiude alle <b>20:30</b> (orario invernale); d'estate fino alle 22:30. Non si entra negli ultimi 15 minuti e può chiudere con vento forte. Le Grandes Serres: <b>9:00–16:30</b>."},
    {icon:"⛏️",title:"Un lago scavato a mano",text:"Il paesaggista svizzero <b>Denis Bühler</b> disegnò il parco in circa quattro anni, ispirandosi al Bois de Boulogne e ai giardini inglesi. Il lago di <b>16 ettari</b> fu scavato da <b>disoccupati</b> assunti dalla città."},
    {icon:"🪖",title:"L'isola del ricordo",text:"Sul lago, l'<b>Île du Souvenir</b> (o 'isola dei cigni') ospita il monumento ai caduti della Grande Guerra di <b>Tony Garnier</b>. Aperta <b>11:00–17:00</b>."},
    {icon:"🦒",title:"Lo zoo gratuito",text:"La <b>pianura africana</b> (dal 2006) con giraffe, antilopi e watussi, e le <b>Foreste d'Asia</b> (2021) con 25 specie minacciate."},
    {icon:"🎲",title:"Se...",text:"☔ Se piove: rimanda, il bello è camminare all'aperto<br>🥪 Se hai fame: chioschi interni (panini, gelati) ma cari; meglio un panino fuori<br>⏳ Se hai 30 min in più: le <b>serre</b> (entro le 16:30)"},
    {icon:"💡",title:"Consiglio",text:"Punta sul lago e sulle serre: sono la parte più caratteristica. Se hai poco tempo, salta lo zoo (carino ma standard) e fai il giro del lago."},
    {icon:"🚻",title:"Pratico",text:"Bagni pubblici in varie zone del parco (mappa all'ingresso). Fontanelle ovunque. Chioschi bar sparsi."}]},

  "1:4":{heroEmoji:"🧀",wiki:"Halles Paul Bocuse",subtitle:"Les Halles Paul Bocuse",intro:"Il tempio della gastronomia: Sibilia (salumi dal 1922) e Giraudet (quenelle). Il pranzo più buono della giornata.",sections:[
    {icon:"⚡",title:"In sintesi",text:"⏱️ 45 min–1h · 💶 15–30 €/persona · 🕐 banchi <b>lun–sab 7:30–19:30</b>, dom 7:30–13:00 · ristoranti <b>11:30–14:30</b> · 🚌 C3/C13<br>📍 102 Cours Lafayette"},
    {icon:"⭐",title:"Non perdere",text:"• La <b>quenelle di Giraudet</b><br>• Il <b>saucisson brioché di Sibilia</b> (dal 1922)<br>• Le <b>ostriche di Antonin</b> (se ti piacciono)<br>• Il <b>formaggio di Mons</b> (affinato in cantina)"},
    {icon:"📍",title:"Dove sei",text:"<b>102 Cours Lafayette</b>. Bus C3/C13, fermata <b>Halles Paul Bocuse</b>. <a href='https://www.google.com/maps/search/?api=1&query=Halles+de+Lyon+Paul+Bocuse%2C+102+Cours+Lafayette%2C+69003+Lyon' target='_blank'>Apri mappa</a>"},
    {icon:"📖",title:"Da sapere",text:"Il mercato coperto dei gourmet lionesi, intitolato a <b>Paul Bocuse</b> quando lo chef era ancora vivo. <b>56 commercianti</b>, di cui 12 ristoratori."},
    {icon:"🍴",title:"Cosa assaggiare",text:"La <b>quenelle</b> da Giraudet, il <b>saucisson brioché</b> da Sibilia, le <b>ostriche</b> da Chez Antonin o Chez Léon. Prezzi indicativi nella scheda 🍽️ Mangiare."},
    {icon:"🕰️",title:"Un po' di storia",text:"Le prime Halles aprirono ai Cordeliers il <b>1° marzo 1859</b>, in un edificio di ferro e vetro. I commercianti si sono trasferiti qui nel <b>gennaio 1971</b>; la grande facciata di vetro è del restyling dei primi anni 2000."},
    {icon:"🦪",title:"Altri banchi famosi",text:"<b>Pupier</b> per i frutti di mare e la fromagerie <b>Mère Richard</b>, oltre a Sibilia e Giraudet."},
    {icon:"🎲",title:"Se...",text:"🌧️ Se piove: perfetto, è coperto<br>💶 Se hai solo carta: quasi tutti accettano carte, ma qualche banco storico preferisce contanti<br>🍽️ Se vuoi sederti: i ristoranti interni (Chez Léon, Chez Antonin) hanno tavoli, ma sono cari<br>🚫 Se sei vegetariano: Giraudet ha anche opzioni di verdura"},
    {icon:"💡",title:"Consiglio",text:"Non fermarti al primo banco: fai un giro completo, poi scegli. Molti banchi fanno assaggi gratuiti. Il pranzo migliore: prendi 3–4 cose piccole in banchi diversi e mangiale ai tavolini esterni."},

function routeLink(dest, mode, via) {
  let u = "https://www.google.com/maps/dir/?api=1&destination=" + enc(dest) + "&travelmode=" + mode;
  if (via && via.length) u += "&waypoints=" + enc(via.join("|"));
  return u;
}
function loopLink(l) {
  return "https://www.google.com/maps/dir/?api=1&origin=" + enc(l.from) + "&destination=" + enc(l.to) + "&waypoints=" + enc(l.via.join("|")) + "&travelmode=walking";

function openBigMap(i) {

/* =====================================================================
   RENDER

const $ = id => document.getElementById(id);
const main = $("main"), pad = $("pad"), padIn = $("padIn"), overlay = $("overlay");

function render() {
  mapRegistry = [];
  document.body.classList.toggle("reading", !!S.read && S.v === "guida");
  $("topbar").innerHTML = CH.map((c, i) => `<button class="dchip ${i === S.ch ? "on" : ""}" role="tab" aria-selected="${i === S.ch}" onclick="switchCh(${i})">${c.chip}<small>Cap. ${c.n}${curOf(i) === "end" ? " ✓" : ""}</small></button>`).join("");
  document.querySelectorAll("nav.bnav button").forEach(b => b.classList.toggle("on", b.dataset.v === S.v));
  let padH = "";
  if (S.v === "guida") { const r = S.read ? renderRead() : renderGuide(); main.innerHTML = r.body; padH = r.pad; }
  else if (S.v === "sommario") { const r = renderSommario(); main.innerHTML = r.body; padH = r.pad; }
  else if (S.v === "indice") main.innerHTML = renderIndice();
  else if (S.v === "mangiare") main.innerHTML = renderFood();
  else main.innerHTML = renderSos();
  pad.hidden = !padH; padIn.innerHTML = padH; pad.classList.toggle("paper", !!S.read && S.v === "guida");
  main.classList.toggle("nopad", !padH);
}
function curOf(ci) { const pg = PAGES[ci], i = Math.min(S.pos[ci] || 0, pg.length - 1); return pg[i].t; }

/* ---------- GUIDA ---------- */
function renderGuide() {
  const ci = S.ch, c = CH[ci], pg = PAGES[ci], i = curPage(), x = pg[i];
  const prev = pg[i - 1], nxt = pg[i + 1], nc = CH[ci + 1];
  const nextBtn = nxt ? `<button class="ps" onclick="flip(1)" aria-label="Pagina successiva">${pageLabel(nxt)} ▶<small>${nextSub(nxt)}</small></button>`
    : nc ? `<button class="ps" onclick="switchCh(${ci + 1},true)" aria-label="Capitolo successivo">Capitolo ${nc.n} ▶<small>${nc.chip} · ${nc.title}</small></button>`
    : `<button class="ps off" aria-hidden="true">▶<small></small></button>`;
  const navRow = `<div class="pr"><button class="ps ${prev ? "" : "off"}" onclick="flip(-1)" aria-label="Pagina precedente">◀ ${prev ? pageLabel(prev) : ""}<small>${prev ? pageSub(prev) : ""}</small></button>${nextBtn}</div>`;
  if (x.t === "open") return pageOpen(ci, navRow);
  if (x.t === "end") return pageEnd(ci, navRow);
  if (x.t === "pause") return pagePause(ci, x, navRow);
  return pagePoint(ci, x, navRow);
}
function pageLabel(x) { return x.t === "open" ? "Apertura" : x.t === "end" ? "Fine capitolo" : x.t === "pause" ? "🏨" : String(x.p); }
function pageSub(x) { return x.t === "pt" ? shortOf(x.p) : x.t === "pause" ? "Riposo" : x.t === "end" ? "rientro" : "Capitolo"; }
function nextSub(x) { return x.t === "pt" ? shortOf(x.p) + " · " + MODE[x.go.m].i + " " + x.go.min + " min" : x.t === "pause" ? "Riposo in hotel" : x.t === "end" ? (CH[S.ch].end.depart ? "partenza" : "🏨 rientro") : ""; }

function pageOpen(ci, navRow) {
  const c = CH[ci], first = ptPages(ci)[0];
  const list = c.parts.map((pt, pi) => pt.pause
    ? `<li><span class="i">🏨</span><span><b>${pt.name}</b> <span class="s">· ${MODE[pt.go.m].i} ${pt.go.min} min</span></span></li>`
    : pt.steps.map((s, si) => `<li class="tap" onclick="goPoint(${s.p})"><span class="k">${s.p}</span><span><b>${place(s.p).name}</b>${P[s.p].type === "cena" ? "" : ` <span class="s">· ${fmt(P[s.p].visit)}</span>`}</span><span class="t">${MODE[s.go.m].i} ${s.go.min} min</span></li>`).join("")).join("");
  const body = `
    <div class="kick">Capitolo ${c.n} · ${c.date} · ${c.when}</div>
    <div class="tt"><span class="n">${c.title}</span></div>

    <div class="card"><h4>Il percorso, punto per punto · ${fmt(chapterTime(ci))} senza i pasti (stima)</h4><ul class="see">${list}</ul></div>
    <div class="tip">🧭 ${c.before}</div>`;
  const pad = `<button class="pb" onclick="flip(1)">▶ INIZIA DAL PUNTO ${first.p}<small>${place(first.p).name} · ${MODE[first.go.m].i} ${first.go.txt || first.go.min + " min"}</small></button>${navRow}`;

}

function primaryFor(n, go) {
  const p = place(n);
  if (go.m === "taxi") return `<button class="pb" onclick="taxiCard('${esc(p.q)}')">🚕 TAXI PER IL ${n} · ${shortOf(n)}<small>mostra la destinazione al tassista · chiama</small></button>`;
  const mode = MODE[go.m].maps, dest = n === 4 ? p.q : p.loop ? p.loop.from : p.q;
  return `<a class="pb" href="${routeLink(dest, mode)}" target="_blank" rel="noopener">🧭 PORTAMI AL ${n} · ${shortOf(n)}<small>${MODE[go.m].i} ${go.txt || go.min + " min " + MODE[go.m].w} · dalla tua posizione</small></a>`;
}
function esc(s) { return String(s).replace(/\\/g, "\\\\").replace(/'/g, "\\'"); }

function pagePoint(ci, x, navRow) {
  const c = CH[ci], n = x.p, p = place(n), part = c.parts[x.pi];
  const all = ptPages(ci), k = all.findIndex(y => y.p === n && y.pi === x.pi && y.si === x.si) + 1;
  const left = partTime(ci, x.pi, x.si), isMeal = P[n].type === "cena";

  const gkey = c.n === 3 && P[n].g3 ? P[n].g3 : P[n].g;
  const G = gkey && GUIDES[gkey];

  else if (P[n].how) mid = `<div class="card"><h4>Come si fa</h4><ul class="how">${P[n].how.map(h => `<li><span>${h}</span></li>`).join("")}</ul></div>`;
  if (see) mid += `<div class="card"><h4>${c.n === 3 && P[n].see3 ? "Da comprare" : "Qui vedrai"}${G ? " · tocca per leggere" : ""}</h4><ul class="see">${see.map(s => `<li class="${G ? "tap" : ""}" ${G ? `onclick="openRead('${gkey}',${n},'${esc(s.sec || "")}')"` : ""}><span class="i">${s.i}</span><span><b>${s.t}</b> <span class="s">· ${s.s}</span></span>${G ? `<span class="chev">›</span>` : ""}</li>`).join("")}</ul>${G ? leggiBtn(gkey, n) : ""}</div>`;
  else if (G) mid += leggiBtn(gkey, n);
  const body = `
    <div class="tt"><span class="num">${n}</span><span class="n"><small>Capitolo ${c.n} · punto ${k} di ${all.length}${part.name && c.parts.length > 1 ? " · " + part.name : ""}</small>${p.name}</span></div>
    ${mapBlock(mapOpts(ci, x.pi, n, 215), true)}
    <div class="card" style="padding:9px 12px"><div class="bar"><i style="width:${Math.round((k - 1) / all.length * 100)}%"></i></div>
      <div class="est">${isMeal ? `Ultimo punto di questa parte · cena ${fmt(p.visit)}` : `Per finire ${part.steps.length > 1 ? "questa parte" : "qui"}: <b>${fmt(left)}</b>`}${cl ? " · " + cl : ""}</div></div>
    <div class="pills">${isMeal ? "" : `<span class="pill">⏱️ ${fmt(visitOf(ci, n))}</span>`}<span class="pill">💶 ${p.cost}</span>${p.hours ? `<span class="pill">🕐 ${p.hours}</span>` : ""}</div>
    ${p.warn ? `<div class="warn">⚠️ ${p.warn}</div>` : ""}
    ${mid}
    ${p.tip ? `<div class="tip">💡 ${p.tip}</div>` : ""}
    ${ese ? `<details class="ese"><summary>🎲 E se… piove, è chiuso, avete più tempo?</summary><div>${ese.text}</div></details>` : ""}
    <div class="btn3"><a href="${poiLink(p.q)}" target="_blank" rel="noopener">📌 Il punto su Maps</a>${p.loop ? `<a href="${loopLink(p.loop)}" target="_blank" rel="noopener">🔁 Giro del parco</a>` : ""}${p.tel ? `<a href="tel:${p.tel}">📞 Chiama</a>` : ""}<button onclick="taxiCard('${esc(p.q)}')">🚕 Taxi</button></div>
    <p class="foot">📍 ${p.addr}</p>`;
  return { body, pad: primaryFor(n, x.go) + navRow };
}
function leggiBtn(g, n) {
  const G = GUIDES[g], secs = readSecs(G), min = Math.max(1, Math.round(secs.reduce((a, s) => a + s.text.replace(/<[^>]+>/g, "").split(/\s+/).length, G.intro.split(/\s+/).length) / 180));
  return `<button class="leggi" onclick="openRead('${g}',${n},'')"><span class="bk">📖</span><span><b>Leggi il ${n}</b><small>${secs.slice(0, 3).map(s => s.title.toLowerCase()).join(" · ")} · ~${min} min</small></span><span class="ar">›</span></button>`;
}
function pagePause(ci, x, navRow) {
  const c = CH[ci], pt = c.parts[x.pi], nx = c.parts[x.pi + 1];

    <div class="tt"><span class="num hotel">🏨</span><span class="n"><small>Capitolo ${c.n} · pausa</small>${pt.name}</span></div>

/* ---------- LEGGI ---------- */
const LOGI = /^(In sintesi|Dove sei|Numeri utili|Se\.\.\.|Il percorso stasera|Prima di uscire|Prenotazioni|Pratico|Domani|Come chiamare|In auto|Riposo in hotel|Rientro|Partenza|Funicolare giù|Funicolare Saint-Jean|Halles Bocuse · ultimi|Alternative|Dopo cena)/;
function readSecs(G) { return G.sections.filter(s => !LOGI.test(s.title)); }
function openRead(g, n, sec) { S.read = { g, n, sec }; render(); window.scrollTo(0, 0); if (sec) setTimeout(() => { const el = document.querySelector(".hl"); if (el) el.scrollIntoView({ block: "start" }); }, 30); }
function closeRead() { S.read = null; render(); window.scrollTo(0, 0); }
function renderRead() {
  const { g, n, sec } = S.read, G = GUIDES[g], secs = readSecs(G), p = place(n);
  const id = i => "rs" + i;
  const body = `
    <div class="rd-h"><div class="tt"><span class="num">${n}</span><span class="n"><small>📖 Leggi</small>${p.name}</span></div>
      <div class="chips"><button class="${sec ? "" : "on"}" onclick="jumpSec('rs-i')">In breve</button>${secs.map((s, i) => `<button class="${s.title === sec ? "on" : ""}" onclick="jumpSec('${id(i)}')">${s.title}</button>`).join("")}</div></div>
    <div class="rd">
      <h3 id="rs-i">In breve</h3><p class="lead2">${G.intro}</p>
      ${secs.map((s, i) => `<div class="${s.title === sec ? "hl" : ""}"><h3 id="${id(i)}">${s.icon} ${s.title}</h3><div class="tx">${s.text}</div></div>`).join("")}
      ${G.linkTo && GUIDES[G.linkTo] ? `<div class="tip" style="margin-top:16px">➕ Se avete più tempo: <b>${GUIDES[G.linkTo].title || GUIDES[G.linkTo].subtitle}</b> — ${GUIDES[G.linkTo].intro}</div>` : ""}
    </div>`;
  return { body, pad: `<button class="pb dark" onclick="closeRead()">◀ TORNA ALLA PAGINA ${n}<small>${p.name} · la guida riprende da qui</small></button>` };
}
function jumpSec(id) { const el = $(id); if (el) el.scrollIntoView({ block: "start", behavior: "smooth" }); }

/* ---------- RISTORANTI ---------- */
function foodBlock(meal, inPage) {
  const F = FOOD[meal], cur = starOf(meal);
  const rows = F.items.map((r, i) => {
    const L = F.inside ? "" : String.fromCharCode(65 + i), mine = cur === r.id;
    const d = r.ll && F.from ? fmtDist(hav(r.ll, F.from === "hotel" ? HOTEL.ll : P[F.from].ll)) : "";
    return `<div class="rest ${mine ? "mine" : ""}"><div class="rt">${L ? `<span class="lt">${mine ? "★" : L}</span>` : `<span class="lt">🍽</span>`}
      <span class="rn"><b>${r.n}</b>${!F.inside ? (mine ? `<span class="bk-st ok">★ il vostro</span>` : "") : ""}<small>${r.k} · ${r.p}</small><small>📍 ${r.a}${d ? ` · ${d} ${F.fromTxt}` : ""}${r.hrs ? ` · 🕐 ${r.hrs}` : ""}</small>${r.book && !F.inside ? `<small>📅 prenotazione: ${r.book}</small>` : ""}</span></div>
      <div class="rb">${!F.inside ? `<button class="stb ${mine ? "on" : ""}" onclick="setStar('${meal}','${r.id}')" aria-pressed="${mine}" aria-label="Segna ${r.n} come il vostro ristorante">${mine ? "★ Il nostro" : "☆ È il nostro"}</button>` : ""}
        ${r.tel ? `<a class="tel" href="tel:${r.tel}">📞 Chiama</a>` : ""}<a href="${poiLink(r.n + ", " + (F.inside ? "Halles de Lyon Paul Bocuse, 102 Cours Lafayette" : r.a) + ", Lyon")}" target="_blank" rel="noopener">🗺️ Maps</a>${r.w ? `<a href="${r.w}" target="_blank" rel="noopener">🌐 Sito</a>` : ""}</div></div>`;
  }).join("");
  const head = F.inside ? "I banchi · dentro le Halles" : cur ? "Ristoranti in zona · ★ = il vostro tavolo" : "Scegliete e prenotate · toccate ☆ sul vostro";
  return `<div class="card"><h4>${head}</h4>${rows}</div>`;
}
function setStar(meal, id) {
  const was = starOf(meal);
  STAR[meal] = was === id ? null : id; save(KEY_STAR, STAR);
  toast(STAR[meal] ? "★ " + FOOD[meal].items.find(r => r.id === id).n + ": è il vostro tavolo" : "Stella tolta");

/* ---------- SOMMARIO ---------- */
function renderSommario() {
  const chaps = CH.map((c, ci) => {
    const done = doneSet(ci), pos = PAGES[ci][Math.min(S.pos[ci] || 0, PAGES[ci].length - 1)];
    const nums = []; ptPages(ci).forEach(x => { if (!nums.includes(x.p)) nums.push(x.p); });
    const where = pos.t === "pt" ? `📖 sei al ${pos.p}` : pos.t === "end" ? "✓ letto" : pos.t === "pause" ? "📖 pausa" : c.when;
    return `<button class="chap ${ci === S.ch ? "on" : ""}" onclick="switchCh(${ci},true)"><span class="top"><b>${c.n} · ${c.title}</b><span>${c.chip} · ${where}</span></span>
      <p>${c.story.replace(/<[^>]+>/g, "")}</p><span class="nums">${nums.map(n => `<span class="${pos.t === "pt" && pos.p === n && ci === S.ch ? "cur" : done.has(n) ? "done" : ""}">${n}</span>`).join("")}<em>${fmt(chapterTime(ci))} senza i pasti</em></span></button>`;
  }).join("");
  const book = ["gio", "venc"].map(m => { const r = chosen(m), F = FOOD[m];
    return `<li><span class="st ${r ? "ok" : ""}">${r ? "★ scelto" : "da prenotare"}</span><span><b>${F.h}</b><br>${r ? r.n + " · " + (r.book || "") : F.items.length + " papabili in 🍽️ Mangiare"}</span></li>`; }).join("");
  const todo = CH.map(c => c.todo.map(t => `<li><span class="st ok" style="background:#eef6f3;color:var(--ink)">${c.chip}</span><span>${t}</span></li>`).join("")).join("");
  const body = `
    <div class="kick">Sommario · Lione, 29–31 ottobre</div>
    ${chaps}
    <div class="card"><h4>Da prenotare</h4><ul class="todo">${book}</ul></div>
    <div class="card"><h4>Da non dimenticare</h4><ul class="todo">${todo}</ul></div>
    <button class="reset" onclick="azzera()"><span class="ic">↺</span><span><b>Azzera la lettura</b><small>Toglie segnalibro e punti fatti: la guida riparte dall'apertura del capitolo di oggi. Le stelle dei ristoranti restano.</small></span></button>
    <p class="foot">Tempi: stime con margine, nessun orologio. Piante schematiche: per navigare usate "Portami".</p>`;
  const pos = PAGES[S.ch][curPage()];
  return { body, pad: `<button class="pb" onclick="go('guida')">▶ ${pos.t === "pt" ? "RIPRENDI DAL " + pos.p : pos.t === "open" ? "APRI IL CAPITOLO " + CH[S.ch].n : "RIPRENDI LA LETTURA"}<small>${pos.t === "pt" ? place(pos.p).name + " · dove eri rimasto" : CH[S.ch].title}</small></button>` };
}
let undoSnap = null, undoTO = null;
function azzera() {
  undoSnap = JSON.stringify({ ch: S.ch, pos: S.pos });
  S.pos = {}; S.ch = todayCh(); S.read = null; S.v = "guida"; persist(); render(); window.scrollTo(0, 0);
  toast("↺ <b>Lettura azzerata</b> · si riparte dall'apertura", "ANNULLA", () => { const u = JSON.parse(undoSnap); S.ch = u.ch; S.pos = u.pos; persist(); render(); toast("Ripristinato"); }, 7000);
}

/* ---------- INDICE ---------- */
function renderIndice() {
  const chOf = n => CH.filter(c => c.parts.some(p => !p.pause && p.steps.some(s => s.p === n))).map(c => c.n);
  const rows = [];
  Object.keys(P).map(Number).forEach(n => { const p = place(n), cs = chOf(n), G = P[n].g;
    rows.push({ key: p.name.replace(/^(La |Le |Les |L'|Place |Cena · )/i, ""), cap: cs[0], html: `<li><button class="k" onclick="goPoint(${n})" aria-label="Apri la pagina ${n}">${n}</button><span class="nm"><b>${p.name}</b><small>${P[n].type} · cap. ${cs.join(" e ")} · ${p.addr}</small>${p.hours ? `<small>🕐 ${p.hours}</small>` : ""}</span>${G ? `<button class="ib rd" onclick="go('guida');openRead('${G}',${n},'')" aria-label="Leggi">📖</button>` : ""}<a class="ib" href="${poiLink(p.q)}" target="_blank" rel="noopener" aria-label="Il punto su Maps">🗺️</a></li>` }); });
  SEEN.forEach(s => rows.push({ key: s.name, cap: CH.findIndex(c => c.parts.some(p => !p.pause && p.steps.some(x => x.p === s.from))) + 1, html: `<li><span class="k o">·</span><span class="nm"><b>${s.name}</b><small>${s.note}</small></span><a class="ib" href="${poiLink(s.q)}" target="_blank" rel="noopener" aria-label="Il punto su Maps">🗺️</a></li>` }));
  Object.keys(FOOD).forEach(m => { const F = FOOD[m]; if (F.inside) return; F.items.forEach((r, i) => { if (starOf(m) === r.id) return;
    rows.push({ key: r.n, cap: F.ch, html: `<li><span class="k st">${String.fromCharCode(65 + i)}</span><span class="nm"><b>${r.n}</b><small>☆ ristorante · ${F.h} · ${r.a}</small></span><a class="ib" href="${poiLink(r.n + ", " + r.a + ", Lyon")}" target="_blank" rel="noopener" aria-label="Il punto su Maps">🗺️</a></li>` }); }); });
  rows.push({ key: "Hôtel Charlemagne", cap: 0, html: `<li><span class="k ht">🏨</span><span class="nm"><b>${HOTEL.name}</b><small>il vostro hotel · ${HOTEL.addr}</small></span><a class="ib" href="tel:${HOTEL.tel}" aria-label="Chiama l'hotel" style="background:#0e9f6e">📞</a><a class="ib" href="${poiLink(HOTEL.q)}" target="_blank" rel="noopener" aria-label="L'hotel su Maps">🗺️</a></li>` });
  IDX_ROWS = rows;
  return `<div class="kick">Indice dei luoghi</div>
    <input class="search" id="isearch" type="search" placeholder="🔎 Cerca un luogo, una via…" value="${(S.q || "").replace(/"/g, "&quot;")}" oninput="S.q=this.value;$('ilist').innerHTML=idxList()" aria-label="Cerca un luogo">
    <div class="seg" role="tablist"><button class="${S.idxMode === "az" ? "on" : ""}" onclick="S.idxMode='az';persist();render()">A–Z</button><button class="${S.idxMode === "cap" ? "on" : ""}" onclick="S.idxMode='cap';persist();render()">Per capitolo</button></div>
    <div id="ilist">${idxList()}</div>
    <p class="foot">Tocca il numero per aprire la sua pagina · 📖 per leggere · 🗺️ per il punto su Maps.<br>Cerchio tratteggiato = si vede ma non si visita · lettera = ristorante papabile.</p>`;
}
let IDX_ROWS = [];
function idxList() {
  const rows = IDX_ROWS;
  const q = (S.q || "").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
  const flt = rows.filter(r => !q || r.html.replace(/<[^>]+>/g, " ").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").includes(q));
  let list;
  if (S.idxMode === "az") list = `<div class="card" style="padding:4px 12px"><ul class="idx">${flt.sort((a, b) => a.key.localeCompare(b.key, "it")).map(r => r.html).join("") || "<li>Nessun luogo trovato</li>"}</ul></div>`;
  else list = [0, 1, 2, 3].map(c => { const g = flt.filter(r => r.cap === c); if (!g.length) return ""; return `<div class="sec-t">${c ? "Capitolo " + c + " · " + CH[c - 1].title : "Hotel"}</div><div class="card" style="padding:4px 12px"><ul class="idx">${g.map(r => r.html).join("")}</ul></div>`; }).join("");
  return list;
}

/* ---------- MANGIARE ---------- */
function renderFood() {
  const block = m => { const F = FOOD[m]; const ci = F.ch - 1;
    let mp = "";
    if (!F.inside) { const pi = CH[ci].parts.findIndex(p => !p.pause && p.steps.some(s => s.p === F.near));
      const o = mapOpts(ci, pi, null, 200); o.click = false; o.fitStars = true; mp = mapBlock(o, false); }
    return `<div class="sec-t">🍽 ${F.h} · punto ${F.near}</div>${mp}${foodBlock(m, false)}`; };
  return `<div class="kick">Mangiare · i papabili</div>
    <div class="tip">☆ Toccate <b>"È il nostro"</b> sul ristorante prenotato: sulla pianta diventa il punto numerato e "Portami" vi porta lì. Le lettere sono le stelline della pianta.</div>
    ${["gio", "venp", "venc"].map(block).join("")}
    <div class="tips">
      <div>💧 Chiedete <b>une carafe d'eau</b>: l'acqua del rubinetto è gratuita. Il servizio è già incluso nel conto.</div>
      <div>⏰ Molti ristoranti chiudono la cucina tra 14:00 e 19:00 (la Brasserie Georges no: servizio continuo).</div>
      <div>🧀 <b>Halles Bocuse</b>: banchi lun–sab 7:30–19:30 · ristoranti 11:30–14:30 · écailler 9:00–22:00.</div>
    </div>`;
}

/* ---------- SOS ---------- */
function renderSos() {
  return `<div class="kick">SOS · informazioni</div>
    <div class="ritem alert"><div class="r-name">⚠️ Ottobre 2026: scioperi e manifestazioni</div>
      <p class="info-p" style="margin-top:4px">A metà ottobre ci sono stati scioperi dei bus TCL e una manifestazione con disordini (17 ottobre: Presqu'île, Bellecour, padiglione dell'Office du tourisme incendiato). Prima di uscire controllate <b>tcl.fr</b> e state lontani dai cortei.</p>
      <div class="r-btns"><a href="https://www.tcl.fr" target="_blank" rel="noopener">🚇 tcl.fr</a><a class="b-web" href="https://www.visiterlyon.com" target="_blank" rel="noopener">🌐 visiterlyon.com</a></div></div>
    ${INFO_HTML}
    <div class="sec-h">🚗 Viaggio in auto · andata e ritorno</div>
    ${TRIP.map(g => `<div class="list"><div class="list-h">${g.label} · ${g.route}</div>${g.rows.map(r => `<div class="ritem"><div class="r-top"><span class="r-name">${r.dir === "tunnel" ? "🚇" : "⛰️"} ${r.name}</span><span class="r-price">${r.tot}</span></div><div class="r-addr">⏱️ ${r.dur} · 🛣️ ${r.km}<br>${r.det}</div><div class="r-btns"><a class="b-map" href="${r.map}" target="_blank" rel="noopener">🗺️ Percorso</a></div></div>`).join("")}</div>`).join("")}
    <p class="foot">Lyon_Guide · funziona anche senza rete. I link a Maps, i numeri di telefono e i siti richiedono la connessione.</p>`;
}

/* =====================================================================
   AZIONI
   ===================================================================== */
function go(v) { S.v = v; if (v !== "guida") S.read = null; S.focusSearch = false; persist(); render(); window.scrollTo(0, 0); }
function flip(d) { const pg = PAGES[S.ch], i = curPage() + d; if (i < 0 || i >= pg.length) return; S.pos[S.ch] = i; S.read = null; persist(); render(); window.scrollTo(0, 0); }
function switchCh(i, toGuide) { S.ch = i; S.read = null; if (toGuide) S.v = "guida"; if (S.v !== "guida" && S.v !== "sommario") S.v = "guida"; persist(); render(); window.scrollTo(0, 0); }
function goPoint(n) {
  closeSheet();
  let ci = CH.findIndex((c, i) => i === S.ch && PAGES[i].some(x => x.p === n));
  if (ci < 0) ci = CH.findIndex((c, i) => PAGES[i].some(x => x.p === n));
  S.ch = ci; S.pos[ci] = PAGES[ci].findIndex(x => x.p === n); S.v = "guida"; S.read = null; persist(); render(); window.scrollTo(0, 0);
}
function sheet(html) { overlay.innerHTML = `<div class="sheet" onclick="event.stopPropagation()">${html}</div>`; overlay.hidden = false; }
function closeSheet() { overlay.hidden = true; overlay.innerHTML = ""; bigOpts = null; }
overlay.addEventListener("click", closeSheet);
document.addEventListener("keydown", e => { if (e.key === "Escape") closeSheet(); });
function taxiCard(q) {
  const parts = q.split(",").map(x => x.trim());
  sheet(`<div class="sh-top"><b>🪧 Mostra al tassista</b><button class="sh-close" onclick="closeSheet()" aria-label="Chiudi">✕</button></div>
    <div class="taxi-card">${parts.join("<br>")}<small>S'il vous plaît · Merci !</small></div>
    <div class="r-btns">${TAXI.map(t => `<a href="tel:${t[1]}">📞 ${t[0]}</a>`).join("")}</div>
    <p class="foot">1 taxi = max 4 persone · ~15–25 € in centro</p>`);
}
let toastTO = null, toastAct = null;
function toast(msg, act, fn, ms) {
  const t = $("toast"); toastAct = fn || null;
  t.innerHTML = `<span>${msg}</span>${act ? `<button onclick="toastAct&&toastAct();hideToast()">${act}</button>` : ""}`;
  t.classList.add("show"); clearTimeout(toastTO); toastTO = setTimeout(hideToast, ms || 2600);
}
function hideToast() { $("toast").classList.remove("show"); }
document.querySelectorAll("nav.bnav button").forEach(b => b.addEventListener("click", () => go(b.dataset.v)));

/* scorrimento orizzontale = sfogliare (solo nella guida, non nella lettura) */
let tx = 0, ty = 0;
main.addEventListener("touchstart", e => { tx = e.touches[0].clientX; ty = e.touches[0].clientY; }, { passive: true });
main.addEventListener("touchend", e => {
  if (S.v !== "guida" || S.read) return;
  const dx = e.changedTouches[0].clientX - tx, dy = e.changedTouches[0].clientY - ty;
  if (Math.abs(dx) > 70 && Math.abs(dx) > Math.abs(dy) * 1.6 && !e.target.closest(".chips,.map")) flip(dx < 0 ? 1 : -1);
}, { passive: true });

if (gpsOn) startGps();
render();

/* Pubblicata su GitHub Pages: il service worker salva la guida sul telefono per l'uso offline.
   Aperta da file:// non serve (e non è disponibile). */
if ("serviceWorker" in navigator && location.protocol === "https:") {
  window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
}
</script>
</body>
</html>
