<style>
  :root {
    --bg: #e8f2ef;
    --txt-bg: #17323b;
    --mut-bg: #5b7a80;
    --line-bg: rgba(23,50,59,.15);
    --card: #ffffff;
    --line: #c3dcd5;
    --txt: #17323b;
    --mut: #5b7a80;
    --amber: #e0940f;
    --amber-text: #e0940f;
    --green: #0e9f6e;
    --green-text: #0e9f6e;
    --blue: #2563eb;
    --red: #dc4c4c;

    /* Design tokens */
    --radius-sm: 10px;
    --radius-md: 16px;
    --radius-lg: 22px;
    --radius-pill: 99px;
    --shadow-sm: 0 2px 8px rgba(0,0,0,.06);
    --shadow-md: 0 4px 16px rgba(0,0,0,.10);
    --shadow-lg: 0 -8px 24px rgba(0,0,0,.18);
    --shadow: var(--shadow-md);

    --radius: 16px;
  }

  body.phase-morning {
    --bg: #d4e8e3;
    --txt-bg: #17323b;
    --mut-bg: #3d5f63;
    --line-bg: rgba(23,50,59,.18);
    --amber-text: #b87800;
    --green-text: #0a7f56;
  }
  body.phase-day {
    --bg: #e8f2ef;
    --txt-bg: #17323b;
    --mut-bg: #5b7a80;
    --line-bg: rgba(23,50,59,.15);
    --amber-text: #e0940f;
    --green-text: #0e9f6e;
  }
  body.phase-evening {
    --bg: #2e8b81;
    --txt-bg: #eaf7f4;
    --mut-bg: #b8dcd5;
    --line-bg: rgba(255,255,255,.28);
    --amber-text: #ffd07a;
    --green-text: #8af0c5;
  }
  body.phase-night {
    --bg: #1f6f6b;
    --txt-bg: #eaf7f4;
    --mut-bg: #a8ccc6;
    --line-bg: rgba(255,255,255,.22);
    --amber-text: #ffd07a;
    --green-text: #8af0c5;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    background-color: var(--bg);
    color: var(--txt-bg);
    font-family: -apple-system, 'Segoe UI', Roboto, sans-serif;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
    padding-bottom: calc(72px + env(safe-area-inset-bottom));
    transition: background-color 1.4s ease, color 1.4s ease;
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.01ms !important;
      transition-duration: 0.01ms !important;
    }
  }

  .kicker, .kicker .phase, .stepno, .stepno .badge-done, .meta, .meta b,
  .alldone p, .guide-box, .guide-text, .guide-open-btn,
  .guide-title, .tip, .ttable td, .ttable .t-name,
  .ttable .t-det, .ttable .t-det b, .ttable .t-tot, .trip-note {
    transition: background-color 1.4s ease, color 1.4s ease, border-color 1.4s ease;
  }

  .sky {
    position: fixed; inset: 0; z-index: 0; pointer-events: none;
    transition: background 1.4s ease;
  }
  .sky.morning { background: radial-gradient(120% 90% at 50% -10%, rgba(255,245,220,.35), transparent 55%); }
  .sky.day     { background: radial-gradient(120% 90% at 50% -10%, rgba(220,240,255,.25), transparent 55%); }
  .sky.evening { background: radial-gradient(120% 90% at 50% -10%, rgba(255,200,150,.12), transparent 55%); }
  .sky.night   { background: radial-gradient(120% 90% at 50% -10%, rgba(150,170,220,.08), transparent 55%); }

  .topbar {
    position: fixed; top: 0; left: 0; right: 0; z-index: 30;
    display: flex; justify-content: space-between; align-items: center; gap: 6px;
    padding: calc(10px + env(safe-area-inset-top)) 12px 8px;
  }
  .tbtn {
    background: #ffffffdd; border: 1.5px solid var(--line); color: var(--mut);
    font-weight: 800; font-size: 18px; padding: 0; border-radius: 10px;
    width: 52px; height: 44px; flex: none; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
  }
  .tbtn:focus-visible { outline: 3px solid var(--amber); outline-offset: 2px; }
  .tbtn.on { color: var(--amber); border-color: var(--amber); }
  .clock {
    font-size: 12px; font-weight: 800; color: var(--mut);
    font-variant-numeric: tabular-nums;
    background: #ffffffcc; padding: 0; border-radius: 10px;
    border: 1.5px solid var(--line); width: 52px; height: 44px; flex: none;
    display: flex; align-items: center; justify-content: center;
  }

  .daystrip {
    flex: 1; min-width: 0;
    display: flex; justify-content: center; gap: 6px;
  }
  .daystrip button {
    background: #ffffffdd; border: 1.5px solid var(--line); color: var(--mut);
    font-weight: 800; font-size: 12px; padding: 0 6px; border-radius: 99px;
    flex: 1 1 0; max-width: 84px; min-width: 0; height: 44px; white-space: nowrap; cursor: pointer;
    transition: background .2s, border-color .2s, color .2s, box-shadow .2s, transform .12s;
  }
  .daystrip button:focus-visible { outline: 3px solid var(--amber); outline-offset: 2px; }
  .daystrip button.on {
    background: var(--amber); border-color: var(--amber); color: #1a1400;
    box-shadow: 0 4px 14px #ffc93c44;
  }
  .daystrip button:active { transform: scale(.96); }

  main {
    position: relative; z-index: 10; height: 100%;
    display: flex; flex-direction: column;
    padding: calc(66px + env(safe-area-inset-top)) 18px 0;
    overflow-y: auto; -webkit-overflow-scrolling: touch;
  }
  main.foodpage { padding-top: calc(12px + env(safe-area-inset-top)); }
  /* FIX 1: spazio di scorrimento sotto la card — così "Apri guida completa",
     i bottoni mappa e il tip non restano mai coperti dal pad fisso
     (PREC / FATTO / NEXT / TAXI) e dalla barra di navigazione. */
  main#nowPage { padding-bottom: 124px; }
  main[hidden] { display: none !important; }

  .kicker {
    text-align: center; font-size: 11px; font-weight: 800;
    letter-spacing: 1.8px; text-transform: uppercase;
    color: var(--amber-text); margin-bottom: 6px;
  }
  .kicker .phase {
    display: inline-block; margin-left: 8px; color: var(--mut-bg);
    letter-spacing: .4px; text-transform: none; font-weight: 700;
  }
  .stepno {
    text-align: center; font-size: 12px; color: var(--mut-bg);
    font-weight: 700; font-variant-numeric: tabular-nums; margin-bottom: 14px;
  }
  .stepno .badge-done { color: var(--green-text); font-weight: 800; }

  .bigcard {
    flex: 1; display: flex; flex-direction: column; justify-content: flex-start;
    max-width: 480px; margin: 0 auto; width: 100%; padding-bottom: 24px;
  }
  .emoji {
    font-size: 56px; text-align: center; margin-bottom: 10px;
    filter: drop-shadow(0 6px 18px #0006);
    animation: float 3.6s ease-in-out infinite;
  }
  /* FIX 2: emoji in linea con il titolo (a sinistra della scritta),
     card più compatta: più contenuti visibili senza scorrere. */
  .cardhead {
    display: flex; align-items: center; justify-content: center;
    gap: 10px; margin-bottom: 10px;
  }
  .cardhead .emoji { font-size: 40px; margin-bottom: 0; flex: none; }
  .cardhead .title { margin-bottom: 0; }
  @keyframes float {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-7px); }
  }
  .title {
    font-size: clamp(22px, 6.2vw, 28px); font-weight: 900;
    text-align: center; line-height: 1.18; margin-bottom: 10px;
  }
  .meta {
    text-align: center; font-size: 14px; color: var(--mut-bg); margin-bottom: 8px; line-height: 1.4;
  }
  .meta b { color: var(--txt-bg); }
  .poi-open-btn {
    display: block; width: 100%; max-width: 440px; margin: 14px auto 0; padding: 11px 14px;
    background: rgba(15,90,80,.05); border: 1.5px solid var(--line-bg); color: var(--txt-bg);
    font-family: inherit; font-size: 12.5px; font-weight: 800; border-radius: 10px;
    text-align: center; min-height: 44px; transition: transform .1s;
  }
  .poi-open-btn:active { transform: scale(.98); }
  .poi-open-btn:focus-visible { outline: 3px solid #fff; outline-offset: 2px; }
  body.phase-evening .poi-open-btn,
  body.phase-night .poi-open-btn { background: rgba(0,0,0,.15); }

  .guide-box {
    margin: 0 auto 16px; max-width: 440px;
    background: rgba(15,90,80,.05); border-left: 3px solid var(--amber-text);
    padding: 14px 16px; border-radius: 0 16px 16px 0;
    text-align: left; box-shadow: var(--shadow); width: 100%;
  }
  body.phase-evening .guide-box,
  body.phase-night .guide-box {
    background: rgba(0,0,0,.22); box-shadow: 0 4px 16px rgba(0,0,0,.25);
  }
  .guide-title {
    font-size: 11px; font-weight: 800; text-transform: uppercase;
    letter-spacing: 1.4px; color: var(--amber-text);
    margin-bottom: 8px; display: flex; align-items: center; gap: 5px;
  }
  .guide-text {
    font-size: 14px; line-height: 1.55; color: var(--txt-bg);
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
  body.phase-evening .guide-text,
  body.phase-night .guide-text { color: #dceeea; }
  .guide-open-btn {
    display: block; width: 100%; margin-top: 12px; padding: 12px 14px;
    background: linear-gradient(135deg, rgba(255,201,60,.18), rgba(255,201,60,.06));
    border: 1.5px solid rgba(255,201,60,.4);
    color: var(--amber-text); font-size: 13px; font-weight: 800;
    letter-spacing: .2px; border-radius: 10px; cursor: pointer;
    text-align: center; transition: transform .12s, background .15s;
  }
  .guide-open-btn:active { transform: scale(.97); background: rgba(255,201,60,.28); }
  .guide-open-btn:focus-visible { outline: 3px solid var(--amber); outline-offset: 2px; }

  .tip {
    margin: 14px auto 0; max-width: 400px;
    background: #ffc93c14; border: 1px solid #ffc93c33; color: #8a5b00;
    font-size: 13px; padding: 12px 14px; border-radius: 16px;
    line-height: 1.45; text-align: center;
  }
  body.phase-evening .tip,
  body.phase-night .tip {
    background: rgba(255,201,60,.12); border-color: rgba(255,201,60,.35); color: #ffe4a3;
  }
  .warn { background: #ff6b6b14; border-color: #ff6b6b44; color: #c06a6a; }
  body.phase-evening .tip.warn,
  body.phase-night .tip.warn {
    background: rgba(255,107,107,.14); border-color: rgba(255,107,107,.38); color: #ffbcbc;
  }

  .map-actions {
    display: flex; justify-content: center; gap: 6px; margin: 14px auto 0;
    width: 100%; max-width: 440px; flex-wrap: nowrap;
  }
  /* Bottoni mappa unificati: stile neutro, icona+label differenziano il mezzo */
  .map-btn {
    display: flex; align-items: center; justify-content: center; gap: 4px; text-decoration: none;
    font-size: 11px; font-weight: 800; padding: 9px 4px; border-radius: 10px;
    background: rgba(15,90,80,.05); border: 1.5px solid var(--line-bg);
    color: var(--txt-bg);
    transition: transform .1s, background .2s;
    min-height: 40px; white-space: nowrap;
    flex: 1 1 0; min-width: 0;
    box-shadow: var(--shadow-sm);
  }
  .map-btn:active { transform: scale(.95); }
  .loop-wrap { display: flex; width: 100%; max-width: 440px; margin: 6px auto 0; }
  .loop-wrap .map-btn { white-space: normal; min-height: 44px; font-size: 12px; }
  .map-btn:focus-visible { outline: 3px solid var(--amber); outline-offset: 2px; }
  body.phase-evening .map-btn,
  body.phase-night .map-btn {
    background: rgba(0,0,0,.20);
    color: var(--txt-bg);
  }

  .poi-list {
    max-width: 440px; margin: 8px auto 14px; width: 100%;
    background: rgba(255,255,255,.55); border: 1px solid var(--line);
    border-radius: 16px; overflow: hidden; box-shadow: var(--shadow);
  }
  .poi {
    display: flex; align-items: center; gap: 8px;
    padding: 8px 9px; border-bottom: 1px solid rgba(23,50,59,.08);
  }
  .poi:last-child { border-bottom: none; }
  .poi.start { border-left: 4px solid var(--green-text); }
  .poi.end { border-left: 4px solid var(--amber-text); }
  .poi .pi {
    font-size: 16px; width: 22px; text-align: center; flex-shrink: 0;
  }
  .poi .pt { flex: 1; min-width: 0; }
  .poi .pt b { display: block; font-size: 12.5px; font-weight: 700; color: var(--txt); line-height: 1.25; }
  .poi .pt small { display: block; font-size: 9.5px; color: #6b8589; margin-top: 1px; line-height: 1.3; }
  .poi .wrap { display: flex; flex-direction: column; gap: 3px; align-items: flex-end; flex-shrink: 0; }
  .poi .flag {
    font-size: 9px; font-weight: 800; color: #0a7f56; white-space: nowrap;
    background: #0e9f6e1a; border: 1px solid #0e9f6e55; border-radius: 10px; padding: 2px 6px;
  }
  .poi .go {
    flex-shrink: 0; font-size: 10px; font-weight: 800; text-decoration: none;
    background: #1d4ed8; color: #fff; padding: 7px 9px; border-radius: 10px;
    min-height: 34px; display: flex; align-items: center; justify-content: center; white-space: nowrap;
  }
  body.phase-evening .poi-list,
  body.phase-night .poi-list {
    background: rgba(0,0,0,.2); border-color: var(--line-bg);
    box-shadow: 0 4px 16px rgba(0,0,0,.25);
  }
  body.phase-evening .poi,
  body.phase-night .poi { border-bottom-color: rgba(255,255,255,.1); }
  body.phase-evening .poi .pt b,
  body.phase-night .poi .pt b { color: #eaf7f4; }
  body.phase-evening .poi .pt small,
  body.phase-night .poi .pt small { color: #b8dcd5; }
  body.phase-evening .poi .flag,
  body.phase-night .poi .flag {
    color: var(--green-text); background: rgba(255,255,255,.08); border-color: rgba(255,255,255,.25);
  }

  .sos-block {
    background: #fff5f5; border: 1.5px solid #ef9a9a; border-radius: 16px;
    padding: 12px 13px; margin-bottom: 14px;
  }
  .sos-block .sos-t {
    font-size: 11px; font-weight: 800; text-transform: uppercase;
    letter-spacing: 1px; color: #b71c1c; margin-bottom: 9px;
  }
  .sos-row {
    display: flex; align-items: center; justify-content: space-between;
    gap: 8px; padding: 7px 0;
  }
  .sos-chip {
    display: flex; align-items: center; gap: 8px; font-size: 13px;
    font-weight: 800; color: #7f1d1d; min-width: 0;
  }
  .sos-chip small { display: block; font-size: 10.5px; font-weight: 700; color: #a36a6a; }
  .sos-row a {
    text-decoration: none; font-size: 11.5px; font-weight: 800;
    padding: 9px 12px; border-radius: 10px; min-height: 38px;
    display: flex; align-items: center; white-space: nowrap;
  }
  .sos-row .a-tel { background: #b91c1c; color: #fff; }
  .sos-row .a-map { background: #1d4ed8; color: #fff; margin-left: 6px; }

  .pad {
    position: fixed; bottom: calc(64px + env(safe-area-inset-bottom)); left: 0; right: 0; z-index: 15;
    background: linear-gradient(to top, var(--bg) 65%, transparent);
    display: flex; align-items: center; justify-content: center;
    padding: 14px 16px; transition: background 1.4s ease;
  }
  .pad-inner {
    display: flex; align-items: center; justify-content: center; gap: 8px;
    width: 100%; max-width: 480px;
  }
  .pbtn {
    border: none; border-radius: 16px; font-weight: 800;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 2px; text-decoration: none; cursor: pointer;
  }
  .pbtn small { font-size: 9.5px; font-weight: 800; opacity: .85; letter-spacing: .2px; }
  .pbtn:active { transform: scale(.93); }
  .pbtn:focus-visible { outline: 3px solid var(--amber); outline-offset: 2px; }
  .pbtn.nav {
    width: 46px; height: 58px; background: #ffffffdd;
    border: 1.5px solid var(--line); color: var(--mut); font-size: 16px;
  }
  .pbtn.nav.off { opacity: .28; pointer-events: none; }
  .pbtn.metro {
    width: 50px; height: 58px; background: #ffffffdd; color: var(--mut);
    font-size: 18px; border: 1.5px solid var(--line);
  }
  .pbtn.tel {
    width: 50px; height: 58px; background: #ffffffdd; color: var(--mut);
    font-size: 18px; border: 1.5px solid var(--line);
  }
  body.phase-evening .pbtn.nav,
  body.phase-evening .pbtn.metro,
  body.phase-evening .pbtn.tel,
  body.phase-night .pbtn.nav,
  body.phase-night .pbtn.metro,
  body.phase-night .pbtn.tel {
    background: rgba(0,0,0,.25);
    border-color: var(--line-bg);
    color: var(--txt-bg);
  }
  .pbtn.done {
    flex: 1; background: var(--green); color: #06281c; font-size: 13.5px; height: 58px;
    font-weight: 900;
    box-shadow: 0 8px 24px #2ee6a855; animation: pulse 2.2s infinite;
  }
  .pbtn.done small { font-size: 10.5px; }
  @keyframes pulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.015); }
  }
  .pbtn.done:active { animation: none; }
  .pbtn.undo {
    flex: 1; background: #f9e0e0; color: #b03030; font-size: 12.5px; height: 58px;
    border: 1.5px solid #d98080; box-shadow: none; animation: none;
  }
  .pbtn.undo small { font-size: 10.5px; color: #c06a6a; }

  .alldone {
    flex: 1; display: flex; flex-direction: column; align-items: center;
    justify-content: center; text-align: center; gap: 16px; padding: 20px;
  }
  .alldone .emoji { animation: none; font-size: 72px; }
  .alldone h2 { font-size: 24px; font-weight: 900; }
  .alldone p { color: var(--mut-bg); font-size: 15px; max-width: 300px; line-height: 1.45; }

  .day-h {
    margin: 12px auto 10px;
    background: linear-gradient(135deg, #0f766e, #14b8a6);
    border-radius: 16px; padding: 16px; width: 100%; max-width: 480px;
  }
  .day-h .dh-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
  .day-h h2 { font-size: 17px; font-weight: 900; color: #fff; }
  .day-h .dh-sub {
    font-size: 11.5px; color: #eafff7; font-weight: 700;
    text-transform: uppercase; letter-spacing: .4px;
  }
  .dh-time {
    font-size: 11.5px; font-weight: 800; background: rgba(0,0,0,.35);
    color: #eafff7; padding: 7px 11px; border-radius: 999px;
    white-space: nowrap; font-variant-numeric: tabular-nums;
  }
  .prog { display: flex; align-items: center; gap: 10px; margin-top: 12px; }
  .prog .bar {
    flex: 1; height: 8px; background: rgba(0,0,0,.35);
    border-radius: 99px; overflow: hidden;
  }
  .prog .bar i {
    display: block; height: 100%; background: var(--green);
    width: 0; transition: width .35s ease;
  }
  .prog b { font-size: 12px; color: #eafff7; font-variant-numeric: tabular-nums; }

  .steps {
    padding: 0 0 24px; display: flex; flex-direction: column; gap: 10px;
    width: 100%; max-width: 480px; margin: 0 auto;
  }
  .step {
    background: var(--card); border: 1.5px solid var(--line);
    border-radius: 16px; padding: 14px; display: flex; gap: 12px;
    cursor: pointer; color: var(--txt); transition: border-color .2s, background .2s;
  }
  .step:focus-visible { outline: 3px solid var(--amber); outline-offset: 2px; }
  .step.done { opacity: .48; }
  .step.done .st-tit { text-decoration: line-through; }
  .step.cur { border-color: var(--amber); border-width: 2.5px; background: #fff8e6; color: #17323b; }
  .step.cur .st-sub, .step.cur .st-hint { color: #3d5f63; }
  .chk {
    appearance: none; -webkit-appearance: none;
    width: 32px; height: 32px; min-width: 32px;
    border: 2px solid var(--line); border-radius: 10px;
    margin-top: 2px; position: relative; cursor: pointer;
  }
  .chk:checked { background: var(--green); border-color: var(--green); }
  .chk:checked::after {
    content: '✓'; position: absolute; color: #06281c;

    {icon:"📖",title:"Cosa sono i traboules",text:"Dal latino <i>trans ambulare</i>, 'passare attraverso': scorciatoie che collegano due strade attraversando uno o più palazzi. Quelle del Vieux Lyon sono quasi tutte <b>rinascimentali</b>; quelle della Croix-Rousse (XVIII–XIX sec.) sono legate ai <b>canuts</b>, i tessitori della seta."},

    {icon:"👑",title:"Qui è passata la storia",text:"Due <b>concili ecumenici</b> (1245 e 1274), l'incoronazione di papa <b>Giovanni XXII</b> (1316) e il matrimonio di <b>Enrico IV con Maria de' Medici</b> (13 dicembre 1600)."},
    {icon:"🏗️",title:"Tre secoli di cantiere",text:"Iniziata verso il <b>1180</b> e finita nel <b>1480</b>: per questo l'abside è romanica e la facciata gotica. Il Dio Padre in cima al timpano è del 1481."},
    {icon:"🔍",title:"Cosa guardare nell'orologio",text:"Oltre all'ora segna la <b>data</b>, le posizioni di <b>Sole, Luna e Terra</b> e il sorgere delle stelle sopra Lione. Quando si anima, gli automi mettono in scena animali e un'<b>Annunciazione</b>."},
    {icon:"🎲",title:"Se...",text:"☔ Se piove: perfetto, sei al coperto<br>🚫 Se è chiusa (dopo le 19:45): la facciata illuminata vale comunque la sosta<br>⏳ Se hai 15 min in più: il Giardino Archeologico accanto"},
    {icon:"💡",title:"Consiglio",text:"Non fermarti alla navata: guarda il passaggio dal romanico del coro al gotico della facciata, e il <b>rosone</b> dal lato opposto della piazza."}]},

  "0:4":{heroEmoji:"🚡",wiki:"Funiculaire de Fourvière",subtitle:"Funicolare Saint-Jean → Fourvière",intro:"La funicolare parte accanto alla Cattedrale e ti porta sulla 'Collina che prega'. Cinque minuti di salita, quasi tutta in galleria.",sections:[
    {icon:"⚡",title:"In sintesi",text:"⏱️ 5 min · 💶 <b>2,10 €</b> (biglietto TCL, 1h: salita + discesa) · 🕐 ogni 5–10 min, ultima corsa ~22:00<br>🚡 linea F2, stazione <b>Vieux Lyon – Cathédrale Saint-Jean</b>"},
    {icon:"⭐",title:"Non perdere",text:"• Il <b>panorama sulla città</b> appena usciti dalla stazione superiore<br>• La <b>basilica illuminata</b> a pochi passi dall'uscita"},
    {icon:"📍",title:"Dove sei",text:"Stazione della funicolare accanto alla <b>Cattedrale di Saint-Jean</b>. <a href='https://www.google.com/maps/search/?api=1&query=Funiculaire+de+Lyon%2C+Cath%C3%A9drale+Saint-Jean-Baptiste%2C+69005+Lyon' target='_blank'>Apri mappa</a>"},
    {icon:"📖",title:"La collina che prega",text:"Sulla collina nacque il primo nucleo di <b>Lugdunum</b>. Qui nacquero <b>Claudio</b> e <b>Caracalla</b>. Oggi è il quartiere religioso e panoramico della città."},
    {icon:"🏛️",title:"La zona romana",text:"Restano il <b>Teatro Antico</b> (il più antico di Francia, 15 a.C.) e l'<b>Odeon</b>. Il Museo Gallo-Romano (a 5 min) espone la <b>tavola in bronzo di Claudio</b>."},
    {icon:"🚡",title:"La funicolare",text:"La prima funicolare di Lione (Saint-Jean–Saint-Just, oggi F1) è del <b>1878</b>; quella di Fourvière, la F2, del <b>1900</b>. Il ticket TCL (2,10 €) vale <b>1 ora</b> con convalide illimitate: copre anche la discesa."},
    {icon:"🧵",title:"Le due 'ficelle'",text:"I lionesi chiamano le funicolari <b>'ficelle'</b>, lo spago. Dalla stessa stazione partono la <b>F1</b> (1878) per Saint-Just e i teatri romani, e la <b>F2</b> (1900) per Fourvière: prendete la F2."},
    {icon:"🎲",title:"Se...",text:"⚠️ Se la F2 è in manutenzione: c'è il <b>bus navetta TCL</b> da Vieux Lyon (stesso biglietto)<br>🥾 Se vuoi camminare: la <b>salita delle scale di Fourvière</b> (Montée Saint-Barthélemy, 10 min, bella ma ripida)<br>☔ Se piove: la funicolare è al coperto"},
    {icon:"💡",title:"Consiglio",text:"Fate un biglietto a testa e convalidatelo alla salita: se scendete entro un'ora, la discesa è compresa."},
    {icon:"📞",title:"Numeri utili",text:"🚇 <b>Info TCL</b>: <a href='https://www.tcl.fr' target='_blank'>tcl.fr</a> (verifica manutenzioni F2 in tempo reale)"}],
   linkTo:"x:croix"},

  "0:5":{heroEmoji:"🌃",wiki:"Basilique de Fourvière",subtitle:"Basilica di Fourvière",intro:"La basilica (1872–1896) mescola bizantino, romanico e gotico. L'esplanade panoramica accanto è il punto foto migliore di Lione, di giorno e di notte.",sections:[
    {icon:"⚡",title:"In sintesi",text:"⏱️ 20–30 min (basilica + terrazza) · 💶 gratis · 🕐 basilica <b>7:00–20:00</b> · cancelli del santuario fino alle 23:00<br>📍 Cima della collina di Fourvière"},
    {icon:"⭐",title:"Non perdere",text:"• L'<b>esplanade panoramica</b> accanto alla basilica (il tappeto di luci di notte, le Alpi di giorno)<br>• I <b>mosaici dorati</b> dell'interno<br>• La <b>cripta di San Giuseppe</b> sotto la basilica (gratis)<br>• La <b>Vergine dorata</b> (1852) sulla torre della vecchia cappella"},
    {icon:"📍",title:"Dove sei",text:"Sulla cima della collina, alla terrazza davanti alla basilica. <a href='https://www.google.com/maps/search/?api=1&query=Basilique+Notre-Dame+de+Fourvi%C3%A8re%2C+8+Place+de+Fourvi%C3%A8re%2C+69005+Lyon' target='_blank'>Apri mappa</a>"},
    {icon:"📖",title:"Da sapere",text:"Iniziata nel <b>1872</b> e consacrata nel <b>1896</b>, su progetto di <b>Pierre Bossan</b>. Capolavoro neobizantino con influenze gotiche e romaniche, nata da un voto del 1870, durante la guerra franco-prussiana."},
    {icon:"😲",title:"Curiosità",text:"Vista dalla Città Vecchia, sembra un <b>gigantesco elefante rovesciato</b>! Le due chiese sono sovrapposte: in alto la basilica, in basso la cripta dedicata a San Giuseppe."},
    {icon:"👀",title:"La vista",text:"Stasera, il tappeto di luci della città. Di giorno, se limpido, <b>le Alpi fino al Monte Bianco</b>. A destra si vede la <b>Tour Métallique</b>, la 'Tour Eiffel di Lione'."},
    {icon:"🏛️",title:"Nei dintorni",text:"A 5 min a piedi, al <b>6 Rue de l'Antiquaille</b>: il <b>Grand Théâtre</b> (~15 a.C., il più antico di Francia; fino a <b>10.700</b> spettatori dopo l'ampliamento di Adriano) e l'<b>Odéon</b> (3.000 posti). Ingresso gratis, in ottobre <b>7:00–19:00</b>: stasera sono chiusi."},
    {icon:"🕯️",title:"Qui è nata la Festa delle Luci",text:"L'8 dicembre <b>1852</b> si inaugurava la <b>Vergine dorata</b> di Fabisch (rinviata da settembre per una piena della Saona). Pioveva; la sera il cielo si aprì e i lionesi misero spontaneamente <b>lumini alle finestre</b>. Da allora ogni 8 dicembre la città si illumina; dal 1999 è la <b>Fête des Lumières</b>."},
    {icon:"🗼",title:"La Tour Métallique",text:"<b>85,90 m</b> di traliccio, costruita tra il <b>1892 e il 1894</b> imitando l'ultimo piano della Tour Eiffel. Sta a ~372 m d'altitudine, il punto più alto di Lione. Oggi trasmette TV e radio: non si visita."},
    {icon:"🎲",title:"Se...",text:"☔ Se piove: la basilica è coperta ma la terrazza no<br>⏳ Se hai 15 min in più: affacciati sui Teatri Romani dall'alto (di sera sono chiusi)<br>🌫️ Se c'è nebbia: la terrazza perde il panorama, ma l'interno della basilica vale comunque<br>🌙 Se torni a dicembre: la <b>Festa delle Luci</b> (8 dicembre) trasforma Fourvière in uno spettacolo"},
    {icon:"💡",title:"Consiglio",text:"L'esplanade accanto alla basilica è il punto foto migliore di Lione. Di sera porta un giubbotto: in cima c'è spesso vento."}]},

  "0:6":{heroEmoji:"🚡",subtitle:"Funicolare giù a Saint-Jean",intro:"Discesa rapida con la F2 verso il cuore del Vieux Lyon.",sections:[
    {icon:"⚡",title:"In sintesi",text:"⏱️ 5 min · 💶 compresa nel ticket della salita (se entro 1h) · 🕐 ogni 5–10 min, ultima ~22:00<br>🚡 linea F2, da Fourvière a Vieux Lyon – Cathédrale"},
    {icon:"⭐",title:"Non perdere",text:"• Un ultimo sguardo al <b>panorama notturno</b> prima di entrare in stazione"},
    {icon:"📍",title:"Dove sei",text:"Stazione superiore della funicolare F2, a 50 m dalla basilica. <a href='https://www.google.com/maps/search/?api=1&query=Funiculaire+Fourvi%C3%A8re%2C+Place+de+Fourvi%C3%A8re%2C+69005+Lyon' target='_blank'>Apri mappa</a>"},
    {icon:"🚡",title:"La funicolare",text:"Il biglietto della salita vale <b>1 ora</b> con convalide illimitate: se hai convalidato meno di un'ora fa, riconvalida lo stesso ticket."},
    {icon:"🎲",title:"Se...",text:"⚠️ Se la F2 è in manutenzione: bus navetta TCL da/per Fourvière (stesso biglietto)<br>🥾 Se vuoi scendere a piedi: la <b>Montée Saint-Barthélemy</b> (10 min, ripida) porta in Rue Saint-Jean<br>🌃 Se è tardi: l'ultima F2 parte verso le 22:00 (verifica tcl.fr), poi taxi"},
    {icon:"💡",title:"Consiglio",text:"La F2 parte ogni 5–10 min. In discesa di solito non c'è coda: se la cabina è piena, aspetta la successiva."},
    {icon:"📞",title:"Numeri utili",text:"🚇 <b>Info TCL</b>: <a href='https://www.tcl.fr' target='_blank'>tcl.fr</a> (orari e manutenzioni in tempo reale) · 🚕 <b>Taxi Lyonnais</b>: <a href='tel:+33478268181'>04 78 26 81 81</a>"}]},

  "0:7":{heroEmoji:"🍽️",subtitle:"Cena in un bouchon",intro:"Le storiche trattorie lionesi: andouillette, quenelle, saucisson chaud. Il modo più autentico per chiudere la giornata.",sections:[
    {icon:"⚡",title:"In sintesi",text:"⏱️ 1h 30–2h · 💶 25–40 €/persona (vino incluso) · 🕐 prenotate per 4 · 📍 Vieux Lyon<br>💳 qualche locale piccolo preferisce i contanti: tenetene un po'"},
    {icon:"⭐",title:"Non perdere",text:"• L'<b>andouillette</b> (salsiccia di maiale e trippa) — il piatto-simbolo<br>• La <b>quenelle di luccio</b> con salsa Nantua<br>• Il <b>saucisson chaud brioché</b><br>• Un <b>Côtes du Rhône</b> della casa"},
    {icon:"📖",title:"Cosa sono i bouchon",text:"Trattorie storiche di Lione, riconoscibili dal <b>fascio di fieno</b> appeso all'insegna. Cucina di recupero, porzioni generose, atmosfera rumorosa: sono l'opposto dello stellato, ed è per questo che sono autentici."},
    {icon:"👩‍🍳",title:"Le 'Mères Lyonnaises'",text:"Figure come <b>Eugénie Brazier</b> (prima donna con tre stelle Michelin, 1933) hanno reso celebre la cucina lionese. Il modello era: padrona di casa + cucina borghese semplificata + prodotti del mercato."},
    {icon:"🍖",title:"Cosa mangiare",text:"<b>Andouillette</b> (se ti piace il sapore forte), <b>quenelle</b> (delicata, per tutti), <b>saucisson chaud</b> (antipasto tipico). Vino: un <b>Côtes du Rhône</b> o un Beaujolais (il 'pot lyonnais', la brocca di ceramica)."},
    {icon:"🎲",title:"Se...",text:"🚫 Se il bouchon è pieno: alternative nella scheda 🍽️ Mangiare<br>🥗 Se sei vegetariano: la cucina lionese è tradizionalmente di carne, ma molti bouchon hanno opzioni (chiedi al momento della prenotazione)<br>🍷 Se vuoi solo bere: molti bouchon hanno un banco bar dove si può bere un bicchiere senza cena"},
    {icon:"📞",title:"Prenotazioni",text:"Nomi e numeri nella scheda 🍽️ Mangiare. Prenotate <b>prima di partire</b>: il giovedì sera i bouchon si riempiono."},
    {icon:"💡",title:"Consiglio",text:"Non ordinate tutto subito: le porzioni sono abbondanti, meglio dividere. Il servizio è già incluso nel conto."},
    {icon:"📞",title:"Numeri utili",text:"🍽️ <b>Ristoranti</b>: scheda 🍽️ Mangiare · 🚕 <b>Taxi Lyonnais</b>: <a href='tel:+33478268181'>04 78 26 81 81</a>"}]},

  "0:8":{heroEmoji:"🚕",subtitle:"Rientro in hotel",intro:"Rientro comodo in taxi. Meglio non tornare a piedi.",sections:[
    {icon:"⚡",title:"In sintesi",text:"⏱️ 10 min · 💶 20–27 € · 📍 da Vieux Lyon a Hôtel Charlemagne (Perrache)<br>🚕 taxi in Place Saint-Jean o chiamato per telefono"},
    {icon:"⭐",title:"Non perdere",text:"• La <b>vista notturna</b> della Cattedrale dal finestrino<br>• Il <b>lungofiume della Saona</b> illuminato (se il taxi passa da lì)"},
    {icon:"🚕",title:"Come chiamare",text:"Ci sono taxi in Place Saint-Jean fino a tardi. In alternativa: <b>Taxi Lyonnais 24/7</b> al <a href='tel:+33478268181'>04 78 26 81 81</a> (radiotaxi, sempre attivo) oppure <b>Allo Taxi</b> al <a href='tel:+33472104106'>04 72 10 41 06</a>."},
    {icon:"🎲",title:"Se...",text:"🌧️ Se piove e non trovi taxi: chiama, non aspettare sotto la pioggia<br>💶 Se hai solo carta: quasi tutti i taxi accettano carte ormai, ma chiedi prima di salire<br>🚶 Se vuoi risparmiare: ~30 min a piedi in piano lungo la Saona"},
    {icon:"💡",title:"Consiglio",text:"Chiamate il taxi quando chiedete il conto: in 4 ci state in un solo taxi. Domani la giornata è lunga."},
    {icon:"🌙",title:"Domani",text:"Bellecour, Terreaux, Mur des Lyonnais, Parc de la Tête d'Or, Halles Bocuse e Brasserie Georges. Sveglia alle 8:00, partenza alle 9:00."},
    {icon:"📞",title:"Numeri utili",text:"🚕 <b>Taxi Lyonnais 24/7</b>: <a href='tel:+33478268181'>04 78 26 81 81</a><br>🚕 <b>Allo Taxi</b>: <a href='tel:+33472104106'>04 72 10 41 06</a><br>🚨 <b>Emergenze</b>: 112"}]},

  "1:0":{heroEmoji:"🚇",wiki:"Place Bellecour",subtitle:"Place Bellecour",intro:"312×200 metri: la più grande piazza pedonale d'Europa. Il punto di partenza della giornata.",sections:[
    {icon:"⚡",title:"In sintesi",text:"⏱️ 10 min (piazza) · 💶 gratis · 🚇 Metro A/D, fermata <b>Bellecour</b> · 🕐 sempre aperta · ♿ accessibile<br>📍 Centro di Lione, tra Rodano e Saona"},
    {icon:"⭐",title:"Non perdere",text:"• La <b>statua equestre di Luigi XIV</b> al centro (1825)<br>• Il <b>chilometro zero</b>: tutte le distanze di Lione si misurano da qui<br>• La <b>vista sulla collina di Fourvière</b> da sud-ovest"},
    {icon:"📍",title:"Dove sei",text:"<b>Place Bellecour</b>, Metro A/D fermata Bellecour. <a href='https://www.google.com/maps/search/?api=1&query=Place+Bellecour%2C+69002+Lyon' target='_blank'>Apri mappa</a>"},
    {icon:"📖",title:"Da sapere",text:"Con <b>~62.000 m²</b> (312×200 m) è la più grande piazza pedonale d'Europa e la terza di Francia. Le facciate sono di <b>Robert de Cotte</b>; la prima statua di Luigi XIV (1713) fu distrutta nel 1793."},
    {icon:"👀",title:"Da vedere",text:"La <b>statua equestre di Luigi XIV</b> (1825, di François-Frédéric Lemot) e, sullo sfondo, la <b>collina di Fourvière</b> con la basilica."},
    {icon:"🐴",title:"'Sotto la coda del cavallo'",text:"I lionesi chiamano la statua il <b>Cheval de Bronze</b> e si danno appuntamento 'sotto la coda del cavallo'. La prima statua del Re Sole (1713) fu fusa durante la Rivoluzione; quella attuale è stata restaurata nel 2023–2024."},
    {icon:"✈️",title:"Saint-Exupéry e il Piccolo Principe",text:"Sul lato Saona, davanti alla libreria Decitre: <b>Antoine de Saint-Exupéry</b>, nato a Lione, seduto con il <b>Piccolo Principe</b> su una colonna di marmo bianco (2000, centenario della nascita)."},
    {icon:"📛",title:"Da dove viene il nome",text:"Da <b>'Bella Curtis'</b>, 'bel giardino': era una vigna dell'arcivescovo. È Place Bellecour solo dal <b>1850</b>, dopo essere stata place Louis-le-Grand, de la Fédération e Bonaparte. L'<b>Office du Tourisme</b> è nel padiglione della piazza, lato Rodano."},
    {icon:"🎲",title:"Se...",text:"🛍️ Se vuoi fare shopping: Rue de la République parte da qui (pedonale, 1 km)"},
    {icon:"💡",title:"Consiglio",text:"Piazza enorme e senza ripari dal vento: a fine ottobre una giacca in più. Non perderci più di 10 minuti: il bello arriva dopo."}]},

  "1:1":{heroEmoji:"⛲",wiki:"Place des Terreaux",subtitle:"Place des Terreaux",intro:"Il cuore di Lione: Municipio, Fontana Bartholdi e Museo di Belle Arti.",sections:[
    {icon:"⚡",title:"In sintesi",text:"⏱️ 15–20 min (piazza) · 💶 gratis · 🚇 Metro A/C, <b>Hôtel de Ville – Louis Pradel</b> · 🕐 sempre aperta · ♿ accessibile<br>📍 Tra Croix-Rousse e Presqu'île"},
    {icon:"⭐",title:"Non perdere",text:"• La <b>Fontana Bartholdi</b> (1892, lo stesso scultore della Statua della Libertà)<br>• La <b>facciata del Municipio</b> (XVII sec.)<br>• Il <b>Museo di Belle Arti</b> sul lato sud (8 €, chiuso il martedì)"},
    {icon:"📍",title:"Dove sei",text:"<b>Place des Terreaux</b>. Metro A/C, Hôtel de Ville – Louis Pradel. <a href='https://www.google.com/maps/search/?api=1&query=Place+des+Terreaux%2C+69001+Lyon' target='_blank'>Apri mappa</a>"},
    {icon:"📖",title:"Da sapere",text:"Il nome viene dai <b>'terreaux'</b>, i terrapieni con cui fu colmato un antico fossato. Oggi è la piazza del Municipio e del Museo di Belle Arti."},
    {icon:"👀",title:"Da vedere",text:"L'<b>Hôtel de Ville</b> (XVII sec., facciata monumentale), la <b>Fontana di Bartholdi</b> (1892), il <b>Museo di Belle Arti</b> (una delle collezioni più ricche di Francia: 8 €, chiuso il martedì, venerdì 10:30–18:00)."},
    {icon:"⛲",title:"Una fontana nata per Bordeaux",text:"Bartholdi la disegnò per <b>Bordeaux</b> come 'carro trionfale della Garonna', ma era troppo cara: Lione la comprò dopo l'Esposizione universale del <b>1889</b>. Marianne guida <b>quattro cavalli</b>, i fiumi che corrono al mare; pesa <b>21 tonnellate</b>. Al centro della piazza dal 1992, restaurata nel 2016–2018."},
    {icon:"🎭",title:"L'Opéra di Jean Nouvel",text:"A 2 minuti, in Place de la Comédie: un teatro del <b>1831</b> su cui Jean Nouvel (1985–1993) ha posato una grande <b>volta di vetro e acciaio</b> che ne raddoppia l'altezza."},
    {icon:"🎲",title:"Se...",text:"🖼️ Se piove: il Museo di Belle Arti è perfetto (10:30–18:00)<br>⏳ Se hai 30 min in più: sali alla <b>Croix-Rousse</b> con la Metro C (a cremagliera) da Hôtel de Ville"},
    {icon:"💡",title:"Consiglio",text:"Sedetevi a un tavolino e godetevi il viavai. È una delle piazze più vive di Lione: qui si incontra tutto il centro."}]},

  "1:2":{heroEmoji:"🎨",wiki:"Fresque des Lyonnais",subtitle:"Mur des Lyonnais",intro:"Muro dipinto di 800 m² con ~30 lionesi celebri: 2000 anni di storia di Lione. Gratis, visibile dalla strada, 10 minuti ben spesi.",sections:[
    {icon:"⚡",title:"In sintesi",text:"⏱️ 10–15 min · 💶 gratis · 🕐 sempre visibile · 🚶 ~10 min da Place des Terreaux<br>📍 Angolo 49 Quai Saint-Vincent / 2 Rue de la Martinière, 1er"},
    {icon:"⭐",title:"Non perdere",text:"• I <b>fratelli Lumière</b> (inventori del cinema)<br>• <b>Claudio</b>, l'imperatore romano nato a Lione<br>• <b>Saint-Exupéry</b> con il Piccolo Principe<br>• <b>Paul Bocuse</b>, lo chef più famoso di Francia<br>• <b>Jacquard</b> con il telaio per la seta (lato Quai Saint-Vincent)"},
    {icon:"📍",title:"Dove sei",text:"Angolo <b>Quai Saint-Vincent / Rue de la Martinière</b>, lungo la Saona, ~10 minuti da Place des Terreaux. <a href='https://www.google.com/maps/search/?api=1&query=Fresque+des+Lyonnais%2C+2+Rue+de+la+Martini%C3%A8re%2C+69001+Lyon' target='_blank'>Apri mappa</a>"},
    {icon:"📖",title:"Da sapere",text:"Dipinto nel <b>1994–95</b> dalla Cité de la Création. <b>800 m²</b> su due lati e <b>~30 personaggi</b> (25 storici e 6 contemporanei): Claudio, i <b>fratelli Lumière</b>, <b>Jacquard</b>, <b>Ampère</b>, <b>Paul Bocuse</b>, <b>Saint-Exupéry</b>. Un trompe-l'œil architettonico su 2000 anni di storia lionese."},
    {icon:"🎨",title:"Il trompe-l'œil",text:"Il muro 'finge' di essere un palazzo con balconi, finestre e botteghe. I personaggi si affacciano dalle finestre finte come se fossero inquilini. Guarda i dettagli: il cinema dei Lumière, il telaio di Jacquard, il Piccolo Principe che parla con Saint-Exupéry."},
    {icon:"🧑‍🤝‍🧑",title:"Chi cercare",text:"• <b>Lato Quai Saint-Vincent</b>: l'imperatore Claudio, Jacquard, il pittore Puvis de Chavannes, il regista Bertrand Tavernier<br>• <b>Lato Rue de la Martinière</b>: Ampère, i fratelli Lumière, Saint-Exupéry con il Piccolo Principe, <b>Guignol</b> con il suo creatore Laurent Mourguet, Paul Bocuse, Juliette Récamier"},
    {icon:"🎲",title:"Se...",text:"☔ Se piove: il muro è scoperto, ma vale comunque una sosta di 5 min<br>⏳ Se hai 20 min in più: il <b>Mur des Canuts</b> alla Croix-Rousse (Metro C)<br>📸 Se vuoi la foto migliore: di mattina, con il sole sulla facciata"},
    {icon:"💡",title:"Consiglio",text:"Gratuita e visibile dalla strada. Fate il gioco: chi trova per primo <b>Guignol</b>, il <b>Piccolo Principe</b> e il regista <b>Bertrand Tavernier</b>?"}]},

  "1:3":{heroEmoji:"🌳",wiki:"Parc de la Tête d'Or",subtitle:"Parc de la Tête d'Or",intro:"Grande parco cittadino con lago, serre botaniche e piccolo zoo. Ingresso gratuito, 105 ettari, uno dei più grandi parchi urbani di Francia.",sections:[
    {icon:"⚡",title:"In sintesi",text:"⏱️ 1h–1h 30 · 💶 gratis · 🕐 <b>6:30–20:30</b> (invernale) · 🚇 Metro A <b>Masséna</b> + 10 min a piedi · 🚌 C1<br>📍 6e arrondissement"},
    {icon:"⭐",title:"Non perdere",text:"• Il <b>lago</b> (16 ettari) e l'imbarcadero<br>• Le <b>Grandes Serres</b> (piante tropicali) — <b>9:00–16:30</b><br>• Il <b>giardino zoologico</b> gratuito<br>• La <b>Porte des Enfants du Rhône</b>, l'ingresso monumentale sul Rodano"},
    {icon:"📍",title:"Dove sei",text:"Nel 6e arrondissement. Metro A fino a <b>Masséna</b>, poi ~10 min a piedi. <a href='https://www.google.com/maps/search/?api=1&query=Parc+de+la+T%C3%AAte+d%27Or%2C+Place+G%C3%A9n%C3%A9ral+Leclerc%2C+69006+Lyon' target='_blank'>Apri mappa</a>"},
    {icon:"📖",title:"Da sapere",text:"Creato nel <b>1857</b>, oggi <b>105 ettari</b> (117 quelli acquistati nel 1856), progettato da Denis e Eugène Bühler. Il nome deriva da una leggenda: una <b>testa di Cristo in oro</b> sarebbe sepolta sul fondo del lago. Da qui il nome 'Tête d'Or'."},
    {icon:"🕐",title:"Orari e stagioni",text:"Dal 15 ottobre chiude alle <b>20:30</b> (orario invernale); d'estate fino alle 22:30. Non si entra negli ultimi 15 minuti e può chiudere con vento forte. Le Grandes Serres: <b>9:00–16:30</b>."},
    {icon:"⛏️",title:"Un lago scavato a mano",text:"Il paesaggista svizzero <b>Denis Bühler</b> disegnò il parco in circa quattro anni, ispirandosi al Bois de Boulogne e ai giardini inglesi. Il lago di <b>16 ettari</b> fu scavato da <b>disoccupati</b> assunti dalla città."},
    {icon:"🪖",title:"L'isola del ricordo",text:"Sul lago, l'<b>Île du Souvenir</b> (o 'isola dei cigni') ospita il monumento ai caduti della Grande Guerra di <b>Tony Garnier</b>. Aperta <b>11:00–17:00</b>."},
    {icon:"🦒",title:"Lo zoo gratuito",text:"La <b>pianura africana</b> (dal 2006) con giraffe, antilopi e watussi, e le <b>Foreste d'Asia</b> (2021) con 25 specie minacciate."},
    {icon:"🎲",title:"Se...",text:"☔ Se piove: rimanda, il bello è camminare all'aperto<br>🥪 Se hai fame: chioschi interni (panini, gelati) ma cari; meglio un panino fuori<br>⏳ Se hai 30 min in più: le <b>serre</b> (entro le 16:30)"},
    {icon:"💡",title:"Consiglio",text:"Punta sul lago e sulle serre: sono la parte più caratteristica. Se hai poco tempo, salta lo zoo (carino ma standard) e fai il giro del lago."},
    {icon:"🚻",title:"Pratico",text:"Bagni pubblici in varie zone del parco (mappa all'ingresso). Fontanelle ovunque. Chioschi bar sparsi."}]},

  "1:4":{heroEmoji:"🧀",wiki:"Halles Paul Bocuse",subtitle:"Les Halles Paul Bocuse",intro:"Il tempio della gastronomia: Sibilia (salumi dal 1922) e Giraudet (quenelle). Il pranzo più buono della giornata.",sections:[
    {icon:"⚡",title:"In sintesi",text:"⏱️ 45 min–1h · 💶 15–30 €/persona · 🕐 banchi <b>lun–sab 7:30–19:30</b>, dom 7:30–13:00 · ristoranti <b>11:30–14:30</b> · 🚌 C3/C13<br>📍 102 Cours Lafayette"},
    {icon:"⭐",title:"Non perdere",text:"• La <b>quenelle di Giraudet</b><br>• Il <b>saucisson brioché di Sibilia</b> (dal 1922)<br>• Le <b>ostriche di Antonin</b> (se ti piacciono)<br>• Il <b>formaggio di Mons</b> (affinato in cantina)"},
    {icon:"📍",title:"Dove sei",text:"<b>102 Cours Lafayette</b>. Bus C3/C13, fermata <b>Halles Paul Bocuse</b>. <a href='https://www.google.com/maps/search/?api=1&query=Halles+de+Lyon+Paul+Bocuse%2C+102+Cours+Lafayette%2C+69003+Lyon' target='_blank'>Apri mappa</a>"},
    {icon:"📖",title:"Da sapere",text:"Il mercato coperto dei gourmet lionesi, intitolato a <b>Paul Bocuse</b> quando lo chef era ancora vivo. <b>56 commercianti</b>, di cui 12 ristoratori."},
    {icon:"🍴",title:"Cosa assaggiare",text:"La <b>quenelle</b> da Giraudet, il <b>saucisson brioché</b> da Sibilia, le <b>ostriche</b> da Chez Antonin o Chez Léon. Prezzi indicativi nella scheda 🍽️ Mangiare."},
    {icon:"🕰️",title:"Un po' di storia",text:"Le prime Halles aprirono ai Cordeliers il <b>1° marzo 1859</b>, in un edificio di ferro e vetro. I commercianti si sono trasferiti qui nel <b>gennaio 1971</b>; la grande facciata di vetro è del restyling dei primi anni 2000."},
    {icon:"🦪",title:"Altri banchi famosi",text:"<b>Pupier</b> per i frutti di mare e la fromagerie <b>Mère Richard</b>, oltre a Sibilia e Giraudet."},
    {icon:"🎲",title:"Se...",text:"🌧️ Se piove: perfetto, è coperto<br>💶 Se hai solo carta: quasi tutti accettano carte, ma qualche banco storico preferisce contanti<br>🍽️ Se vuoi sederti: i ristoranti interni (Chez Léon, Chez Antonin) hanno tavoli, ma sono cari<br>🚫 Se sei vegetariano: Giraudet ha anche opzioni di verdura"},
    {icon:"💡",title:"Consiglio",text:"Non fermarti al primo banco: fai un giro completo, poi scegli. Molti banchi fanno assaggi gratuiti. Il pranzo migliore: prendi 3–4 cose piccole in banchi diversi e mangiale ai tavolini esterni."},
    {icon:"📞",title:"Numeri utili",text:"🥟 <b>Giraudet</b>: <a href='tel:+33478623405'>04 78 62 34 05</a> · 🥓 <b>Sibilia</b>: <a href='tel:+33478622129'>04 78 62 21 29</a><br>🍽️ <b>Altri banchi</b>: scheda 🍽️ Mangiare"}]},

  "1:5":{heroEmoji:"😴",subtitle:"Riposo in hotel",intro:"Pausa meritata. Due ore per ricaricare le batterie prima della cena in Brasserie Georges.",sections:[
    {icon:"⚡",title:"In sintesi",text:"⏱️ 2h · 📍 Hôtel Charlemagne (23 Cours Charlemagne) · 🚇 Metro A, fermata <b>Perrache</b> (5 min a piedi)<br>🔋 tempo di ricarica: doccia, riposo, cambio"},
    {icon:"⭐",title:"Cosa fare",text:"• <b>Doccia</b> e riposo<br>• <b>Ricarica</b> del telefono (power bank per la sera)<br>• Controllate la <b>prenotazione online</b> della Brasserie Georges"},
    {icon:"📍",title:"Dove sei",text:"<b>Hôtel Charlemagne</b>, 23 Cours Charlemagne. Metro A, fermata <b>Perrache</b>. <a href='https://www.google.com/maps/search/?api=1&query=H%C3%B4tel+Charlemagne%2C+23+Cours+Charlemagne%2C+69002+Lyon' target='_blank'>Apri mappa</a>"},
    {icon:"💡",title:"Consiglio",text:"Usa questo tempo per una doccia e un riposo vero. La cena è alle 19:30: alle 19:15 si esce."},
    {icon:"🎲",title:"Se...",text:"🛍️ Se vuoi fare un giro: <b>Place Bellecour</b> è a 2 fermate di metro<br>☔ Se piove: restate in hotel, la Brasserie è a 7 min"},
    {icon:"📞",title:"Numeri utili",text:"🏨 <b>Hotel Charlemagne</b>: <a href='tel:+33472777000'>04 72 77 70 00</a><br>🚕 <b>Taxi Lyonnais</b>: <a href='tel:+33478268181'>04 78 26 81 81</a>"}]},

  "1:6":{heroEmoji:"🍺",wiki:"Brasserie Georges",subtitle:"Brasserie Georges",intro:"Istituzione lionese dal 1836, atmosfera Art Déco. A ~500 metri dall'hotel, comodissima per la cena.",sections:[
    {icon:"⚡",title:"In sintesi",text:"⏱️ 1h 30–2h · 💶 30–50 €/persona · 🕐 <b>ven 11:30–00:15</b> (servizio continuo) · 🚶 ~7 min dall'hotel<br>📍 30 Cours de Verdun, Perrache · <b>prenotazione solo online</b>"},
    {icon:"⭐",title:"Non perdere",text:"• La <b>sala Art Déco</b> (1924)<br>• La <b>birra in loco</b>, prodotta nei tini d'epoca<br>• La <b>facciata neoclassica</b> su Cours de Verdun<br>• Il <b>soufflé</b> o la <b>choucroute</b> (piatti della tradizione)"},
    {icon:"📍",title:"Dove sei",text:"A ~500 metri dall'hotel, sul lato nord della stazione di Perrache. <a href='https://www.google.com/maps/search/?api=1&query=Brasserie+Georges%2C+30+Cours+de+Verdun+Perrache%2C+69002+Lyon' target='_blank'>Apri mappa</a>"},
    {icon:"📖",title:"Da sapere",text:"Fondata nel <b>1836</b> da Georges Hoffherr, birraio alsaziano. Nel <b>1924</b> fu ridecorata in stile <b>Art Déco</b>. È una delle brasserie più grandi d'Europa e produce ancora la sua birra."},
    {icon:"🍽️",title:"Alternative",text:"Se è piena (capita il venerdì): <b>Les Petites Cantines</b> (74 Rue de la Charité, 10–18 €, no-profit) o <b>HEAT Food Court</b> (70 Quai Perrache, 10–20 €, food hall con 8 cucine). Entrambe a 10 min a piedi."},
    {icon:"⭐",title:"Ospiti illustri",text:"Tra i clienti storici: <b>Verlaine, Jules Verne, Rodin, Édith Piaf, Hemingway</b>."},
    {icon:"🏆",title:"Record da brasserie",text:"Nel <b>1986</b> servì la choucroute più grande del mondo (~1,5 tonnellate), nel <b>1996</b> un'omelette norvegese di <b>34 metri</b>. Oltre <b>700 coperti</b> per servizio."},
    {icon:"🍽️",title:"Cosa ordinare",text:"La <b>salsiccia lionese al pistacchio</b>, la <b>choucroute</b> e, per chiudere, l'<b>omelette norvegese</b>. Birra: quella della casa."},
    {icon:"🎲",title:"Se...",text:"🍺 Se non hai prenotato: il venerdì sera mettete in conto un'attesa<br>🥗 Se sei vegetariano: pochi piatti, ma insalate e zuppe ci sono<br>💶 Se hai solo carta: nessun problema, accettano tutto"},
    {icon:"🌙",title:"Dopo cena",text:"Rientro a piedi in ~7 minuti, attraverso Perrache."},
    {icon:"📞",title:"Numeri utili",text:"🍺 <b>Brasserie Georges</b>: <a href='tel:+33472565454'>04 72 56 54 54</a><br>🍽️ <b>Alternative</b>: scheda 🍽️ Mangiare"}]},

  "1:7":{heroEmoji:"🚶",subtitle:"Rientro a piedi",intro:"~500 metri attraverso Perrache. Due passi digestivi prima di dormire.",sections:[
    {icon:"⚡",title:"In sintesi",text:"⏱️ ~7 min a piedi · 🚶 ~500 m · 📍 da Brasserie Georges a Hôtel Charlemagne<br>🚉 si passa dalla stazione di Perrache"},
    {icon:"🎲",title:"Se...",text:"🌧️ Se piove forte: un taxi per 500 m è sprecato, meglio un ombrello<br>🚶 Se hai voglia di camminare di più: allunga fino a <b>Place Bellecour</b> (~15 min) prima di rientrare"},
    {icon:"💡",title:"Consiglio",text:"Domani si fa check-out alle 9:00 e si parte già carichi: preparate le valigie stasera."},
    {icon:"🌙",title:"Domani",text:"Check-out alle 9:00, Musée des Confluences (esterno), Halles Bocuse (ultimi acquisti), Tour Incity e partenza dalle Halles verso Magenta."},

  "2:0":{heroEmoji:"🧳",subtitle:"Check-out · Hôtel Charlemagne",intro:"Ultima mattina: si carica l'auto e si parte per il giro finale, senza tornare in hotel.",sections:[

    {icon:"📍",title:"Dove sei",text:"<b>Hôtel Charlemagne</b>, 23 Cours Charlemagne. <a href='https://www.google.com/maps/search/?api=1&query=H%C3%B4tel+Charlemagne%2C+23+Cours+Charlemagne%2C+69002+Lyon' target='_blank'>Apri mappa</a>"},

  "2:1":{heroEmoji:"🏛️",wiki:"Musée des Confluences",subtitle:"Musée des Confluences",intro:"Architettura futuristica dove Rodano e Saona si incontrano. Da vedere dall'esterno (il museo apre alle 10:30): l'edificio merita da solo la sosta.",sections:[
    {icon:"⚡",title:"In sintesi",text:"⏱️ 20–30 min (esterno) · 2h (interno) · 💶 gratis fuori, <b>12 €</b> dentro · 🕐 <b>10:30–18:30</b> (aperto tutti i giorni nelle vacanze scolastiche) · 🚗 ~10 min dall'hotel<br>📍 86 Quai Perrache, 2e arrondissement"},
    {icon:"⭐",title:"Non perdere",text:"• La <b>forma dell'edificio</b> (una 'nuvola' di vetro e acciaio)<br>• La <b>punta della confluenza</b> Rodano–Saona, dietro il museo<br>• Il <b>quartiere Confluence</b> (ex aree portuali e industriali rinate)"},
    {icon:"📍",title:"Dove sei",text:"<b>86 Quai Perrache</b>, ~10 min in auto dall'hotel. <a href='https://www.google.com/maps/search/?api=1&query=Mus%C3%A9e+des+Confluences%2C+86+Quai+Perrache%2C+69002+Lyon' target='_blank'>Apri mappa</a>"},
    {icon:"📖",title:"Da sapere",text:"Inaugurato nel <b>2014</b>, progettato dallo studio viennese <b>Coop Himmelb(l)au</b>. È un esempio di architettura <b>decostruttivista</b>: una nuvola di vetro e acciaio sospesa tra i due fiumi."},
    {icon:"🌊",title:"La confluenza",text:"Il punto esatto in cui il <b>Rodano</b> (che scende dalle Alpi) e la <b>Saona</b> (che scende dai Vosgi) si incontrano. Da qui il nome 'Confluence'. La punta è subito dietro il museo."},
    {icon:"🏗️",title:"Il quartiere",text:"Ex aree portuali e industriali rinate dagli anni 2000: architettura contemporanea lungo la Saona e un grande centro commerciale."},
    {icon:"🔷",title:"Cristallo, nuvola, zoccolo",text:"L'edificio ha tre parti: il <b>Cristallo</b> di vetro (1.900 m², l'ingresso), la <b>Nuvola</b> rivestita d'acciaio inox con le sale, e lo <b>Zoccolo</b> di cemento che regge tutto."},
    {icon:"🎲",title:"Se...",text:"🎟️ Se vuoi entrare: 12 €, apre alle 10:30 — ma il check-out è già fatto e le Halles aspettano<br>☔ Se piove: guardatelo dall'auto e passate alle Halles<br>🅿️ Parcheggio: a pagamento nel quartiere, seguite i cartelli"},
    {icon:"💡",title:"Consiglio",text:"La forma dell'edificio merita da sola il viaggio. Se il tempo è bello, fai il giro esterno fino alla punta: 20 min ben spesi, zero euro. Oggi il museo non ci sta: tenetelo per il prossimo viaggio."}]},

  "2:2":{heroEmoji:"🧺",subtitle:"Halles Bocuse · ultimi acquisti",intro:"Salumi, formaggi e specialità da portare a casa. Il modo migliore per salutare Lione.",sections:[

    {icon:"⭐",title:"Non perdere",text:"• <b>Salumi</b> da Sibilia (saucisson brioché sottovuoto, 8–12 €)<br>• <b>Formaggi</b> da Mons (Saint-Marcellin, 5–8 €)<br>• <b>Quenelle</b> da Giraudet (vasetto sottovuoto, 10 €)"},
    {icon:"📍",title:"Dove sei",text:"<b>102 Cours Lafayette</b>. <a href='https://www.google.com/maps/search/?api=1&query=Halles+de+Lyon+Paul+Bocuse%2C+102+Cours+Lafayette%2C+69003+Lyon' target='_blank'>Apri mappa</a>"},
    {icon:"🛍️",title:"Cosa comprare",text:"<b>Salumi</b> (saucisson, rosette, jambon persillé), <b>formaggi</b> (Saint-Marcellin, Fourme d'Ambert). Chiedi la <b>confezione sottovuoto</b> per i salumi: durano 5–7 giorni."},
    {icon:"🎲",title:"Se...",text:"🧳 Se hai poco spazio in valigia: salumi sottovuoto + formaggi duri, non freschi<br>🚗 Se parti subito: puoi lasciare i sacchetti in auto<br>💶 Se hai solo carta: quasi tutti accettano"},
    {icon:"💡",title:"Consiglio",text:"Chiedi la confezione sottovuoto per i salumi. Per i formaggi: i duri (Beaufort, Comté) resistono al viaggio, i molli (Saint-Marcellin) no."},
    {icon:"📞",title:"Numeri utili",text:"🥓 <b>Sibilia</b>: <a href='tel:+33478622129'>04 78 62 21 29</a>"}]},

  "2:3":{heroEmoji:"🏙️",wiki:"Tour Incity",subtitle:"Tour Incity",intro:"Il grattacielo più alto di Lione: 200 m con la guglia, 39 piani, completato nel 2015. Si guarda da fuori.",sections:[
    {icon:"⚡",title:"In sintesi",text:"⏱️ 5–10 min (esterno) · 💶 gratis · 🕐 sempre visibile · 🚶 ~5 min dalle Halles<br>📍 Angolo Cours Lafayette / Rue Garibaldi, 3e"},
    {icon:"⭐",title:"Non perdere",text:"• La <b>vista dal basso</b> della torre di vetro<br>• Il confronto con la <b>Tour Part-Dieu</b>, detta <b>'Le Crayon'</b> (la matita), del 1972–1976"},
    {icon:"📍",title:"Dove sei",text:"Incrocio <b>Cours Lafayette / Rue Garibaldi</b>, a due passi dalle Halles. <a href='https://www.google.com/maps/search/?api=1&query=Tour+Incity%2C+116+Cours+Lafayette%2C+69003+Lyon' target='_blank'>Apri mappa</a>"},
    {icon:"📖",title:"Da sapere",text:"Progettata da <b>Valode & Pistre</b> con Albert Constantin: 200 m con l'antenna, 170 m al tetto, 39 piani, cantiere 2013–2015. Sono uffici (Caisse d'Epargne e SNCF): non si visita."},
    {icon:"✏️",title:"La matita e la gomma",text:"La vicina Tour Part-Dieu (165 m, 1972–1976) è <b>'Le Crayon'</b>, la matita, per la piramide di 23 m sul tetto. La Incity, più alta e accanto, è stata subito ribattezzata <b>'La Gomme'</b>: la gomma. Negli ultimi piani del Crayon c'è un hotel, con il bar al 32° piano."},
    {icon:"💡",title:"Consiglio",text:"Foto dall'incrocio con Rue Garibaldi, poi tornate al parcheggio delle Halles: da lì si parte per casa."}]},

let state = load();

/* Giorno del viaggio: 29/30/31 ottobre → 0/1/2; fuori dal viaggio → -1 (si apre il giorno 1) */
const now = new Date();
const todayIdx = (now.getMonth() === 9 && now.getDate() >= 29 && now.getDate() <= 31) ? now.getDate() - 29 : -1;
let dayIdx = todayIdx < 0 ? 0 : todayIdx;
let steps = DAYS[dayIdx].steps;
/* Tappa da mostrare per un giorno: oggi → quella dell'orario attuale (saltando le già fatte);
   altri giorni → la prima non ancora fatta */
function pickIdx(d) {
  const st = DAYS[d].steps;
  if (d === todayIdx) {
    const n = new Date(), mins = n.getHours() * 60 + n.getMinutes();
    let i = 0;
    st.forEach((s, k) => { const [h, mi] = s.time.split(':').map(Number); if (h * 60 + mi <= mins) i = k; });
    while (i < st.length && state[d + ':' + i]) i++;
    return i;
  }
  const f = st.findIndex((_, k) => !state[d + ':' + k]);
  return f < 0 ? st.length : f;
}
let idx = pickIdx(dayIdx);
let undoStack = Object.keys(state);

function phaseFor(h) {
  if (h >= 5 && h < 9) return 'morning';
  if (h >= 9 && h < 17) return 'day';
  if (h >= 17 && h < 21) return 'evening';
  return 'night';
}
function applyPhase() {
  const h = new Date().getHours();
  const p = phaseFor(h);
  document.body.classList.remove('phase-morning', 'phase-day', 'phase-evening', 'phase-night');
  document.body.classList.add('phase-' + p);
  const sky = document.getElementById('sky');
  if (sky) sky.className = 'sky ' + p;
}
applyPhase();
setInterval(applyPhase, 60000);

const view = document.getElementById('nowPage');
const dayView = document.getElementById('dayPage');
const overlay = document.getElementById('overlay');
const guideOverlay = document.getElementById('guideOverlay');
let toastTO;

function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTO);
  toastTO = setTimeout(() => t.classList.remove('show'), 2400);
}

function phaseLabel() {
  const s = steps[idx];
  if (!s) return '';
  if (dayIdx !== todayIdx) return `alle ${s.time}`;
  const n = new Date();
  const [hh, mm] = s.time.split(':').map(Number);
  const diff = (hh * 60 + mm) - (n.getHours() * 60 + n.getMinutes());
  if (diff > 60) return `tra ${Math.floor(diff / 60)}h${String(diff % 60).padStart(2, '0')}`;
  if (diff > 0) return `tra ${diff} min`;
  if (diff > -60) return `in ritardo di ${-diff} min · niente panico`;
  return 'flessibile';
}

function mapLinks(s) {
  const b = 'https://www.google.com/maps/dir/?api=1';
  const l = `&origin=${encodeURIComponent(s.orig)}&destination=${encodeURIComponent(s.dest)}`;
  /* punti intermedi solo per il percorso a piedi, nell'ordine in cui si incontrano */
  const w = s.via && s.via.length ? `&waypoints=${encodeURIComponent(s.via.join('|'))}` : '';
  return {
    walk: `${b}${l}${w}&travelmode=walking`,
    transit: `${b}${l}&travelmode=transit`,
    drive: `${b}${l}&travelmode=driving`
  };
}
/* Giro a piedi sul posto: sequenza di punti dentro il luogo della tappa */
function loopLink(g) {
  return 'https://www.google.com/maps/dir/?api=1&origin=' + encodeURIComponent(g.from) +
    '&destination=' + encodeURIComponent(g.to) +
    (g.via && g.via.length ? '&waypoints=' + encodeURIComponent(g.via.join('|')) : '') + '&travelmode=walking';
}
/* Link a un PUNTO di interesse (marker sulla mappa), non a un percorso */
function poiLink(q) {
  return 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(q);
}

let poisOpen = {};
function togglePois() {
  const k = dayIdx + ':' + idx;
  poisOpen[k] = !poisOpen[k];

function renderDayStrip() {
  const strip = document.getElementById('daystrip');

  ).join('');
}

function render() {
  renderDayStrip();
  renderDayPage();
  const s = steps[idx];
  if (!s) {
    view.innerHTML = `
      <div class="alldone">
        <div class="emoji">🎉</div>
        <h2>Giornata completata!</h2>
        <p><b>${DAYS[dayIdx].name}</b> è tutto spuntato.<br>Tocca un altro giorno in alto oppure 🗓️ Giorno / ⚙️ Servizio.</p>
        <button class="tbtn on" style="min-height:48px;padding:12px 22px" onclick="openSheet()">⚙️ Apri servizio</button>
      </div>`;
    const pad = document.getElementById('pad-fixed');
    if (pad) { pad.innerHTML = ''; pad.style.display = 'none'; }
    return;
  }
  const isDone = !!state[dayIdx + ':' + idx];
  const guideData = GUIDES[dayIdx + ':' + idx];
  const pois = POIS[dayIdx + ':' + idx] || [];
  /* Tappa "sul posto": origine = destinazione → niente percorso, solo il punto */
  const onsite = s.orig && s.dest && s.orig === s.dest;
  const short = x => (x || '').split(',')[0];
  const hasPoi = q => pois.some(p => p.q === q);   /* stesso luogo = una sola riga */
  const poiRows = [
    s.orig && !onsite && !hasPoi(s.orig) ? { i: '🚩', n: short(s.orig), d: 'tu sei qui', q: s.orig, k: 'start' } : null,
    ...pois,
    s.dest && !onsite && !hasPoi(s.dest) ? { i: '🏁', n: short(s.dest), d: 'arrivo', q: s.dest, k: 'end' } : null
  ].filter(Boolean);
  const m = mapLinks(s);
  const doneBtn = isDone
    ? `<button class="pbtn undo" onclick="toggleDone()" aria-label="Deseleziona tappa">DESELEZIONA ✕<small>annulla spunta</small></button>`
    : `<button class="pbtn done" onclick="toggleDone()" aria-label="Segna come fatto">FATTO ✓<small>avanti →</small></button>`;

  view.innerHTML = `
    <div class="kicker">${dayIdx === todayIdx ? 'Adesso' : 'Programma'} · ${DAYS[dayIdx].date}<span class="phase" id="phase"></span></div>
    <div class="stepno">Tappa ${idx + 1} di ${steps.length} · ${s.dur}${isDone ? ' · <span class="badge-done">✓ completata</span>' : ''}</div>
    <div class="bigcard">
      <div class="cardhead">
        <div class="emoji" aria-hidden="true">${s.emoji}</div>
        <div class="title">${s.title}</div>
      </div>
      <div class="meta">${s.meta}</div>
      ${s.desc ? `
        <div class="guide-box">
          <div class="guide-title">📖 Cosa sapere</div>
          <div class="guide-text">${s.desc}</div>${guideData ? `<button class="guide-open-btn" onclick="openGuide()">📖 Apri guida completa →</button>` : ''}
        </div>
      ` : ''}
      <div class="map-actions">
        ${onsite
          ? `<a class="map-btn map-here" href="${poiLink(s.dest)}" target="_blank" rel="noopener">📍 Il punto sulla mappa</a>`
          : `<a class="map-btn map-walk" href="${m.walk}" target="_blank" rel="noopener">🚶 A piedi</a>
             ${DAYS[dayIdx].car
               ? `<a class="map-btn map-drive" href="${m.drive}" target="_blank" rel="noopener">🚗 Auto</a>`
               : `<a class="map-btn map-transit" href="${m.transit}" target="_blank" rel="noopener">🚇 Mezzi</a>
             <a class="map-btn map-drive" href="${m.drive}" target="_blank" rel="noopener">🚕 Taxi</a>`}
             <a class="map-btn map-here" href="${poiLink(s.orig)}" target="_blank" rel="noopener">📍 Tu sei qui</a>`}
      </div>
      ${s.loop ? `<div class="loop-wrap"><a class="map-btn map-loop" href="${loopLink(s.loop)}" target="_blank" rel="noopener">🚶 ${s.loop.label}</a></div>` : ''}
      ${poiRows.length ? `<button class="poi-open-btn" onclick="togglePois()">${poisOpen[dayIdx + ':' + idx] ? '▴ Chiudi i punti di interesse' : '📍 Apri i punti di interesse della tappa'}</button>` : ''}
      ${poisOpen[dayIdx + ':' + idx] && poiRows.length ? `<div class="poi-list">${poiRows.map(p => `<div class="poi ${p.k || ''}"><span class="pi">${p.i}</span><span class="pt"><b>${p.n}</b><small>${p.d || ''}</small></span><span class="wrap">${p.walk ? '<span class="flag">🚶 solo a piedi</span>' : ''}<a class="go" href="${poiLink(p.q)}" target="_blank" rel="noopener">🗺️ Apri</a></span></div>`).join('')}</div>` : ''}
      ${s.tip ? `<div class="tip ${s.warn ? 'warn' : ''}">${s.tip}</div>` : ''}
    </div>`;

  let padHTML = document.getElementById('pad-fixed');
  if (!padHTML) {
    padHTML = document.createElement('div');
    padHTML.id = 'pad-fixed';
    padHTML.className = 'pad';
    document.body.appendChild(padHTML);
  }
  padHTML.innerHTML = `
    <div class="pad-inner">
      <button class="pbtn metro" onclick="openTransit()" aria-label="Pianta dei mezzi pubblici">🚇<small>METRO</small></button>
      <button class="pbtn nav ${idx === 0 ? 'off' : ''}" onclick="prevS()" aria-label="Tappa precedente">◀<small>PREC</small></button>
      ${doneBtn}
      <button class="pbtn nav ${idx >= steps.length - 1 ? 'off' : ''}" onclick="nextS()" aria-label="Tappa successiva">▶<small>NEXT</small></button>
      <a class="pbtn tel" href="${s.tel ? 'tel:' + s.tel : 'tel:+33478268181'}" aria-label="${s.tel ? 'Chiama' : 'Chiama taxi'}">📞<small>${s.tel ? 'CHIAMA' : 'TAXI'}</small></a>
    </div>`;
  tick();
}

function tick() {
  const ph = document.getElementById('phase');
  if (ph) ph.textContent = '· ' + phaseLabel();
}
setInterval(tick, 30000);

}

  dayView.innerHTML = `

        <div class="bar"><i style="width:${done / day.steps.length * 100}%"></i></div>
        <b>${done}/${day.steps.length}</b>
      </div>
    </div>
    <div class="steps">
      ${day.steps.map((s, i) => {
        const k = dayIdx + ':' + i;
        const isDone = !!state[k];
        const cur = i === idx;
        const g = GUIDES[k];
        const hint = cur && !isDone ? '▶ prossima tappa' : (g ? '📖 guida disponibile' : '');
        return `
          <div class="step ${isDone ? 'done' : ''} ${cur ? 'cur' : ''}" data-i="${i}" data-k="${k}" onclick="goStep(${i})" role="button" tabindex="0">
            <input type="checkbox" class="chk" ${isDone ? 'checked' : ''} data-k="${k}" aria-label="${s.title}" onclick="event.stopPropagation()">
            <div class="st-body">
              <div class="badges">
                <span class="bdg">${i + 1}/${day.steps.length}</span>
                <span class="bdg">${s.time}</span>
                <span class="bdg">${s.dur}</span>
              </div>
              <div class="st-tit">${s.emoji}${s.title}</div>
              <div class="st-sub">${s.meta.replace(/<[^>]+>/g, '')}</div>${hint ? `<div class="st-hint">${hint}</div>` : ''}
            </div>
          </div>`;
      }).join('')}
    </div>`;
  dayView.querySelectorAll('.chk').forEach(c => {
    c.addEventListener('change', () => {
      const k = c.dataset.k;
      const card = c.closest('.step');
      const si = +card.dataset.i;
      if (c.checked) {
        state[k] = true;
        undoStack.push(k);
        card.classList.add('done');
        toast(`✓ ${DAYS[dayIdx].steps[si].title}`);
      } else {
        delete state[k];
        card.classList.remove('done');
      }
      save(state);
      const newIdx = steps.findIndex((_, j) => !state[dayIdx + ':' + j]);
      idx = newIdx < 0 ? steps.length : newIdx;
      render();
    });
  });
}

function toggleDone() {
  const key = dayIdx + ':' + idx;
  if (state[key]) {
    delete state[key];
    save(state);
    undoStack = undoStack.filter(k => k !== key);
    if (navigator.vibrate) navigator.vibrate(20);
    toast(`↩︎ Deselezionata: ${steps[idx].title}`);
    render();
  } else {
    state[key] = true;
    save(state);
    undoStack.push(key);
    if (navigator.vibrate) navigator.vibrate(30);
    toast(`✓ ${steps[idx].title}`);
    idx++;
    if (idx >= steps.length) {
      if (navigator.vibrate) navigator.vibrate([40, 60, 40]);
    }
    render();
  }
}
function nextS() {
  if (idx < steps.length - 1) {
    idx++;
    render();
  }
}
function prevS() {
  if (idx > 0) {
    idx--;
    render();
  }
}

  idx = i;

function undoLast() {
  const key = undoStack.filter(k => k.startsWith(dayIdx + ':')).pop();
  if (key) {
    const i = +key.split(':')[1];

    save(state);
    undoStack = undoStack.filter(k => k !== key);
    idx = i;
    closeSheet();
    render();
    toast('↩︎ Ultima spunta annullata');
    return;
  }
  toast('Niente da annullare');
}
function resetDay() {
  if (!confirm(`Azzerare tutte le tappe di "${DAYS[dayIdx].name}"?`)) return;
  steps.forEach((_, i) => delete state[dayIdx + ':' + i]);
  undoStack = undoStack.filter(k => !k.startsWith(dayIdx + ':'));
  save(state);
  idx = 0;
  closeSheet();
  render();
  toast('Giornata azzerata');
}
function resetAll() {
  if (!confirm('Azzerare l’intero viaggio (tutti i giorni)?')) return;

}

function showPage(id) {
  Object.entries(PAGES).forEach(([k, el]) => el.hidden = k !== id);
  document.querySelectorAll('nav a').forEach(x => x.classList.toggle('on', x.dataset.nav === id));
  const strip = document.getElementById('daystrip');
  const useDay = (id === 'nowPage' || id === 'dayPage');
  strip.style.visibility = useDay ? 'visible' : 'hidden';
  const pad = document.getElementById('pad-fixed');
  if (pad) pad.style.display = (id === 'nowPage') ? 'flex' : 'none';
  if (id === 'dayPage') renderDayPage();
  if (id === 'nowPage') render();
  window.scrollTo({ top: 0 });
}
document.querySelectorAll('nav a').forEach(a => {
  a.addEventListener('click', e => {
    e.preventDefault();
    showPage(a.dataset.nav);
  });
});

let tx = 0, ty = 0;
view.addEventListener('touchstart', e => {
  tx = e.touches[0].clientX;
  ty = e.touches[0].clientY;
}, { passive: true });
view.addEventListener('touchend', e => {
  const dx = e.changedTouches[0].clientX - tx;
  const dy = e.changedTouches[0].clientY - ty;
  if (Math.abs(dx) > 70 && Math.abs(dx) > Math.abs(dy)) {
    dx < 0 ? nextS() : prevS();
  }
}, { passive: true });
document.addEventListener('keydown', e => {
  if (!PAGES.nowPage.hidden) {
    if (e.key === 'ArrowRight') nextS();
    if (e.key === 'ArrowLeft') prevS();
    if (e.key === ' ') {
      e.preventDefault();
      toggleDone();
    }
  }
  if (e.key === 'Escape') {
    if (!guideOverlay.hidden) closeGuide();
    else if (!overlay.hidden) closeSheet();
  }
});
